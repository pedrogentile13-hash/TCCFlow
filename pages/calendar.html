<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Calendário — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
    .cal-head-cell{text-align:center;font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 0;}
    .cal-cell{min-height:88px;border-radius:10px;padding:6px;border:1px solid transparent;background:var(--paper);transition:border-color .15s,background .15s;cursor:pointer;}
    .cal-cell:hover{border-color:var(--line);background:var(--bg-2);}
    .cal-cell.today{border-color:var(--violet);background:rgba(124,58,237,.04);}
    .cal-cell.other-month{opacity:.35;}
    .cal-cell .day-num{font-family:var(--font-mono);font-size:.75rem;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px;}
    .cal-cell.today .day-num{background:var(--grad);color:white;}
    .event-pill{display:block;padding:2px 7px;border-radius:4px;font-size:.625rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}

    /* Gantt */
    .gantt-container{overflow-x:auto;padding-bottom:8px;}
    .gantt-table{min-width:900px;width:100%;}
    .gantt-header{display:grid;gap:0;border-bottom:2px solid var(--line);margin-bottom:0;}
    .gantt-row-wrap{border-bottom:1px dashed var(--line);}
    .gantt-row-wrap:last-child{border-bottom:none;}
    .gantt-row{display:grid;align-items:center;min-height:52px;}
    .gantt-label{padding:10px 14px 10px 4px;font-size:.875rem;font-weight:500;overflow:hidden;}
    .gantt-label .sub{font-family:var(--font-mono);font-size:.625rem;color:var(--muted);font-weight:400;margin-top:2px;}
    .gantt-cell{position:relative;height:52px;}
    .gantt-bar{position:absolute;top:10px;bottom:10px;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:.6875rem;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:filter .2s,transform .2s;}
    .gantt-bar:hover{filter:brightness(1.1);transform:scaleY(1.05);}
    .gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--rose);opacity:.7;pointer-events:none;z-index:2;}
    .gantt-today-line::before{content:"hoje";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:.5625rem;color:var(--rose);white-space:nowrap;font-weight:600;}

    .milestone{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;background:var(--amber);border-radius:3px;rotate:45deg;cursor:pointer;transition:scale .2s;}
    .milestone:hover{scale:1.3;}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const EVENTS = {
  25:[{title:"Reunião orientador",cls:"rgba(124,58,237,.15)",color:"var(--violet)"}],
  28:[{title:"Entrega metodologia",cls:"rgba(245,158,11,.15)",color:"var(--amber)"}],
  30:[{title:"Sessão de escrita",cls:"rgba(6,182,212,.15)",color:"var(--cyan)"}],
  3: [{title:"Revisão cap.1",cls:"rgba(16,185,129,.15)",color:"var(--emerald)"}],
  5: [{title:"Apresentação parcial",cls:"rgba(244,63,94,.15)",color:"var(--rose)"},{title:"Sprint pesquisa",cls:"rgba(6,182,212,.15)",color:"var(--cyan)"}],
  10:[{title:"Reunião orientador",cls:"rgba(124,58,237,.15)",color:"var(--violet)"}],
  15:[{title:"Entrega do Projeto",cls:"rgba(245,158,11,.15)",color:"var(--amber)"}],
};

const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DAYS_ABBR=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

const UPCOMING=[
  {title:"Reunião orientador",date:"Hoje, 14:00",color:"var(--violet)"},
  {title:"Entrega da metodologia",date:"28 abr, 23:59",color:"var(--amber)"},
  {title:"Sessão de escrita",date:"30 abr, 10:00",color:"var(--cyan)"},
  {title:"Revisão capítulo 1",date:"3 mai, 18:00",color:"var(--emerald)"},
  {title:"Entrega do Projeto",date:"15 mai, 23:59",color:"var(--rose)"},
];

const GANTT_MONTHS = ["Mar","Abr","Mai","Jun","Jul","Ago","Set","Out"];
const GANTT_TASKS = [
  { label:"Pesquisa bibliográfica",   sub:"Coleta de fontes",          start:0,    end:2.5,  color:"linear-gradient(90deg,#7c3aed,#8b5cf6)", pct:70 },
  { label:"Referencial teórico",      sub:"Cap. 1 & 2",                start:1,    end:4,    color:"linear-gradient(90deg,#06b6d4,#14b8a6)", pct:45 },
  { label:"Metodologia",              sub:"Elaboração do survey",      start:1.5,  end:3,    color:"linear-gradient(90deg,#f59e0b,#f97316)", pct:30 },
  { label:"Coleta de dados",          sub:"Aplicação do questionário", start:3,    end:4.5,  color:"linear-gradient(90deg,#10b981,#06b6d4)", pct:0  },
  { label:"Análise e resultados",     sub:"Estatística & interpretação",start:4,   end:6,    color:"linear-gradient(90deg,#3b82f6,#8b5cf6)", pct:0  },
  { label:"Redação final",            sub:"Escrita completa",          start:5,    end:7.5,  color:"linear-gradient(90deg,#ec4899,#f43f5e)", pct:0  },
  { label:"Revisão & entrega",        sub:"Correções finais",          start:7,    end:7.8,  color:"linear-gradient(90deg,#f97316,#f59e0b)", pct:0  },
  { label:"Defesa",                   sub:"Apresentação banca",        start:7.8,  end:8,    color:"linear-gradient(90deg,#7c3aed,#06b6d4)", pct:0  },
];
const MILESTONES = [
  { label:"Qualificação", month:3,   color:"var(--violet)" },
  { label:"Entrega Final",month:6.5, color:"var(--amber)" },
  { label:"Defesa",       month:7.9, color:"var(--rose)" },
];
const TODAY_POS = 1.8;
const TOTAL_MONTHS = 8;

function GanttView() {
  const labelW = 180;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <h2 style={{fontFamily:"var(--font-display)",fontSize:"1.375rem",fontWeight:400,letterSpacing:"-.02em"}}>
            Cronograma <em style={{fontStyle:"italic",color:"var(--violet)"}}>Gantt</em>
          </h2>
          <p style={{fontSize:".8125rem",color:"var(--muted)",marginTop:2}}>Mar 2026 — Out 2026</p>
        </div>
        <div style={{display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:".8125rem",color:"var(--muted)"}}>
            <span style={{width:24,height:4,borderRadius:999,background:"var(--rose)",display:"inline-block"}}></span> Hoje
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:".8125rem",color:"var(--muted)"}}>
            <span style={{width:10,height:10,background:"var(--amber)",borderRadius:2,rotate:"45deg",display:"inline-block"}}></span> Marco
          </div>
          <button className="btn btn-ghost btn-sm">Exportar PDF</button>
        </div>
      </div>

      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div className="gantt-container">
          <div className="gantt-table">
            <div style={{display:"grid",gridTemplateColumns:`${labelW}px repeat(${TOTAL_MONTHS},1fr)`,borderBottom:"2px solid var(--line)",background:"var(--bg-2)"}}>
              <div style={{padding:"10px 14px",fontFamily:"var(--font-mono)",fontSize:".625rem",textTransform:"uppercase",letterSpacing:".1em",color:"var(--muted)"}}>Fase</div>
              {GANTT_MONTHS.map(m=>(
                <div key={m} style={{textAlign:"center",padding:"10px 4px",fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)",fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>{m}</div>
              ))}
            </div>

            {GANTT_TASKS.map((task,i)=>(
              <div key={i} className="gantt-row-wrap">
                <div className="gantt-row" style={{gridTemplateColumns:`${labelW}px repeat(${TOTAL_MONTHS},1fr)`}}>
                  <div className="gantt-label">
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <div style={{width:3,height:36,borderRadius:999,background:task.color,flexShrink:0}}></div>
                      <div>
                        <div>{task.label}</div>
                        <div className="sub">{task.sub}</div>
                      </div>
                    </div>
                  </div>
                  {Array.from({length:TOTAL_MONTHS}).map((_,ci)=>{
                    const colStart = ci;
                    const colEnd = ci + 1;
                    const barStart = Math.max(task.start, colStart);
                    const barEnd = Math.min(task.end, colEnd);
                    const hasBar = barEnd > barStart;
                    const left = `${(barStart - colStart) * 100}%`;
                    const width = `${(barEnd - barStart) * 100}%`;
                    const isTodayCol = TODAY_POS >= colStart && TODAY_POS < colEnd;
                    const todayLeft = `${(TODAY_POS - colStart) * 100}%`;

                    return (
                      <div key={ci} className="gantt-cell" style={{background:ci%2===0?"transparent":"rgba(0,0,0,.015)"}}>
                        {isTodayCol && <div className="gantt-today-line" style={{left:todayLeft}}></div>}
                        {hasBar && (
                          <div className="gantt-bar" style={{left,width,background:task.color,opacity:task.pct>0?1:.7}}>
                            {(barEnd - barStart) > 0.4 && task.pct > 0 && `${task.pct}%`}
                          </div>
                        )}
                        {MILESTONES.filter(ms=>ms.month>=colStart && ms.month<colEnd).map((ms,mi)=>(
                          <div key={mi} className="milestone" style={{left:`${(ms.month-colStart)*100}%`,background:ms.color}} title={ms.label}></div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)",background:"var(--bg-2)",display:"flex",gap:20,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>Marcos:</span>
          {MILESTONES.map((ms,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:".8125rem",color:"var(--ink-2)"}}>
              <span style={{width:10,height:10,background:ms.color,borderRadius:2,display:"inline-block",rotate:"45deg",flexShrink:0}}></span>
              {ms.label}
            </div>
          ))}
          <div style={{marginLeft:"auto",fontSize:".8125rem",color:"var(--muted)"}}>
            Progresso atual: <strong style={{color:"var(--violet)"}}>34%</strong>
          </div>
        </div>
      </div>
    </div>
  );
}

function MonthView({current, setCurrent, goals=[], sessions=[]}) {
  const today = new Date();
  function buildCells(){
    const first=new Date(current.year,current.month,1);
    const last=new Date(current.year,current.month+1,0);
    const cells=[];
    for(let i=0;i<first.getDay();i++){const d=new Date(current.year,current.month,-first.getDay()+1+i);cells.push({day:d.getDate(),other:true});}
    for(let d=1;d<=last.getDate();d++)cells.push({day:d,other:false});
    while(cells.length%7!==0){const d=cells.length-(last.getDate()+first.getDay())+1;cells.push({day:d,other:true});}
    return cells;
  }
  const cells=buildCells();
  const isToday=(c)=>!c.other&&c.day===today.getDate()&&current.month===today.getMonth()&&current.year===today.getFullYear();

  const goalsForDay = (day) => {
    return goals.filter(g => {
      if (!g.deadline) return false;
      const d = new Date(g.deadline);
      return d.getDate()===day && d.getMonth()===current.month && d.getFullYear()===current.year;
    }).map(g => ({title:g.title, color:"var(--violet)", cls:"rgba(124,58,237,.15)"}));
  };

  const upcomingEvents = [...goals.filter(g=>g.deadline&&new Date(g.deadline)>=today).slice(0,3).map(g=>({
    title:g.title, date:new Date(g.deadline).toLocaleDateString('pt-BR'), color:"var(--violet)"
  }))];

  return(
    <div className="cal-grid-layout" style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:16}}>
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <h2 style={{fontFamily:"var(--font-display)",fontSize:"1.375rem",fontWeight:400,letterSpacing:"-.02em"}}>
            {MONTHS[current.month]} <em style={{fontStyle:"italic",color:"var(--violet)"}}>{current.year}</em>
          </h2>
          <div style={{display:"flex",gap:4}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCurrent(c=>c.month===0?{year:c.year-1,month:11}:{year:c.year,month:c.month-1})}>←</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCurrent(c=>c.month===11?{year:c.year+1,month:0}:{year:c.year,month:c.month+1})}>→</button>
          </div>
        </div>
        <div className="cal-grid" style={{marginBottom:4}}>
          {DAYS_ABBR.map(d=><div key={d} className="cal-head-cell">{d}</div>)}
        </div>
        <div className="cal-grid">
          {cells.map((c,i)=>(
            <div key={i} className={`cal-cell${isToday(c)?" today":""}${c.other?" other-month":""}`}>
              <div className="day-num">{c.day}</div>
              {!c.other&&(goalsForDay(c.day)||[]).map((ev,j)=>(
                <span key={j} className="event-pill" style={{background:ev.cls,color:ev.color}}>{ev.title}</span>
              ))}
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div className="card">
          <div className="card-title"><span className="ct-icon">📅</span> Próximos eventos</div>
          {upcomingEvents.length===0 && <div style={{color:"var(--muted)",fontSize:".8125rem",padding:"8px 0"}}>Nenhum evento próximo</div>}
          {upcomingEvents.map((ev,i)=>(
            <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 0",borderBottom:i<upcomingEvents.length-1?"1px dashed var(--line)":"none"}}>
              <span style={{width:3,alignSelf:"stretch",borderRadius:999,background:ev.color,flexShrink:0}}></span>
              <div>
                <div style={{fontSize:".8125rem",fontWeight:500}}>{ev.title}</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)",marginTop:2}}>{ev.date}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title"><span className="ct-icon">⏱</span> Sessão de Foco</div>
          <div style={{textAlign:"center",padding:"16px 0"}}>
            <div style={{fontFamily:"var(--font-display)",fontSize:"2.5rem",letterSpacing:"-.04em",lineHeight:1,color:"var(--violet)"}}>25:00</div>
            <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)",margin:"6px 0 14px"}}>Pomodoro · Foco</div>
            <button className="btn btn-violet" style={{width:"100%"}}>▶ Iniciar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function EventModal({ open, onClose, onSave, saving }) {
  const [type, setType] = useState("goal");
  const [title, setTitle] = useState("");
  const [date, setDate] = useState("");
  const [time, setTime] = useState("");
  const [topic, setTopic] = useState("");

  if (!open) return null;

  function reset() { setType("goal"); setTitle(""); setDate(""); setTime(""); setTopic(""); }

  function handleSave() {
    if (!title.trim() || !date) return;
    onSave({ type, title: title.trim(), date, time, topic: topic.trim() });
    reset();
  }

  function handleClose() { reset(); onClose(); }

  return (
    <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",backdropFilter:"blur(4px)"}} onClick={handleClose}></div>
      <div style={{position:"relative",background:"var(--paper)",borderRadius:20,border:"1px solid var(--line)",boxShadow:"0 20px 60px rgba(0,0,0,.2)",width:"100%",maxWidth:440,padding:"28px 24px",margin:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h2 style={{fontFamily:"var(--font-display)",fontSize:"1.375rem",fontWeight:400}}>Novo <em style={{fontStyle:"italic",color:"var(--violet)"}}>evento</em></h2>
          <button onClick={handleClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:"1.25rem",color:"var(--muted)"}}>✕</button>
        </div>

        <div style={{display:"flex",gap:4,marginBottom:18}}>
          {[["goal","Meta / Entrega"],["session","Sessão / Reunião"]].map(([v,l])=>(
            <button key={v} className={`btn btn-sm ${type===v?"btn-primary":"btn-ghost"}`} style={{border:"none",flex:1}} onClick={()=>setType(v)}>{l}</button>
          ))}
        </div>

        <div className="field">
          <label>Título</label>
          <input type="text" placeholder={type==="goal"?"Ex: Entrega do capítulo 2":"Ex: Reunião com orientador"} value={title} onChange={e=>setTitle(e.target.value)}/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field">
            <label>Data</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          </div>
          {type==="session" && (
            <div className="field">
              <label>Horário</label>
              <input type="time" value={time} onChange={e=>setTime(e.target.value)}/>
            </div>
          )}
        </div>

        {type==="session" && (
          <div className="field">
            <label>Assunto</label>
            <input type="text" placeholder="Ex: Revisão da metodologia" value={topic} onChange={e=>setTopic(e.target.value)}/>
          </div>
        )}

        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button className="btn btn-violet" style={{flex:1}} onClick={handleSave} disabled={saving || !title.trim() || !date}>
            {saving ? "Salvando..." : "Salvar evento"}
          </button>
          <button className="btn btn-ghost" onClick={handleClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

function CalendarPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [view,setView]=useState("gantt");
  const [current,setCurrent]=useState({year:2026,month:3});
  const [goals, setGoals] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [saving, setSaving] = useState(false);

  async function loadEvents() {
    if (!project) return;
    const g = await DB.calendarGoals.getAll(project.id);
    setGoals(g || []);
    const s = await DB.calendarSessions.getAll(project.id);
    setSessions(s || []);
  }

  useEffect(() => { loadEvents(); }, [project]);

  async function handleSaveEvent(evt) {
    if (!project) return;
    setSaving(true);
    try {
      if (evt.type === "goal") {
        await DB.calendarGoals.add(project.id, { title: evt.title, deadline: evt.date });
      } else {
        await DB.calendarSessions.add(project.id, { subject: evt.title, topic: evt.topic, date: evt.date, time: evt.time });
      }
      await loadEvents();
      setShowModal(false);
    } catch(e) {
      alert("Erro ao salvar evento: " + (e.message || e));
    }
    setSaving(false);
  }

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  return(
    <div className="app-layout">
      <Sidebar active="calendar" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Calendário" user={user} actions={
          <button className="btn btn-violet btn-sm" onClick={()=>setShowModal(true)}>+ Novo evento</button>
        }/>
        <div className="page-content">
          <div style={{display:"flex",gap:4,marginBottom:20}}>
            {[["gantt","📊 Gantt"],["month","📅 Mês"],["week","📋 Semana"]].map(([v,l])=>(
              <button key={v} className={`btn btn-sm ${view===v?"btn-primary":"btn-ghost"}`} onClick={()=>setView(v)}>{l}</button>
            ))}
          </div>
          {view==="gantt"  && <GanttView/>}
          {view==="month"  && <MonthView current={current} setCurrent={setCurrent} goals={goals} sessions={sessions}/>}
          {view==="week"   && (
            <div className="empty-state">
              <div className="es-icon">📋</div>
              <h3>Visão Semanal</h3>
              <p>Em breve — use a visão Mensal ou o Gantt por enquanto.</p>
            </div>
          )}
        </div>
      </div>
      <EventModal open={showModal} onClose={()=>setShowModal(false)} onSave={handleSaveEvent} saving={saving}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalendarPage/>);
</script>
</body>
</html>
