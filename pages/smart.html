<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Validação SMART — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    .smart-grid{display:grid;grid-template-columns:260px 1fr 280px;height:calc(100vh - 60px);overflow:hidden;}
    .smart-left{background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;padding:20px 16px;}
    .smart-left::-webkit-scrollbar{display:none;}
    .smart-left{scrollbar-width:none;}
    .smart-main{overflow-y:auto;padding:28px 32px;}
    .smart-main::-webkit-scrollbar{width:6px;}
    .smart-main::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
    .smart-right{background:var(--bg-2);border-left:1px solid var(--line);overflow-y:auto;padding:20px 16px;}
    .smart-right::-webkit-scrollbar{display:none;}
    .smart-right{scrollbar-width:none;}
    .smart-header{font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;}
    .letter-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem;color:#fff;flex-shrink:0;}
    .smart-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s;}
    .smart-item:hover{box-shadow:var(--shadow-sm);}
    .smart-item-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;}
    .smart-item-head .title{font-size:.8125rem;font-weight:600;color:var(--ink);}
    .smart-item-head .arrow{margin-left:auto;color:var(--muted);font-size:.75rem;transition:transform .2s;}
    .smart-item-head .arrow.open{transform:rotate(180deg);}
    .smart-item-body{padding:0 14px 14px;font-size:.8125rem;color:var(--muted);line-height:1.55;}
    .smart-item-body .example-label{font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;margin-top:10px;margin-bottom:4px;}
    .smart-item-body .example-good{background:rgba(16,185,129,.08);color:var(--emerald);padding:6px 10px;border-radius:8px;font-size:.75rem;margin-bottom:4px;}
    .smart-item-body .example-bad{background:rgba(244,63,94,.08);color:var(--rose);padding:6px 10px;border-radius:8px;font-size:.75rem;}
    .smart-item-check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--ink-2);cursor:pointer;}
    .smart-item-check input[type="checkbox"]{width:16px;height:16px;accent-color:var(--violet);}
    .progress-label{font-family:var(--font-mono);font-size:.6875rem;color:var(--muted);margin-top:16px;margin-bottom:6px;}
    .progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
    .progress-track-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .4s ease;}
    .theme-input{width:100%;font-family:var(--font-display);font-size:1.25rem;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .2s;}
    .theme-input:focus{border-color:var(--violet);}
    .theme-input::placeholder{color:var(--muted);opacity:.5;}
    .analysis-card{display:flex;gap:14px;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:box-shadow .2s;}
    .analysis-card:hover{box-shadow:var(--shadow-sm);}
    .analysis-card .status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:600;}
    .status-atende{background:rgba(16,185,129,.1);color:var(--emerald);}
    .status-parcial{background:rgba(245,158,11,.1);color:var(--amber);}
    .status-nao{background:rgba(244,63,94,.1);color:var(--rose);}
    .analysis-card .suggestion{font-size:.75rem;color:var(--muted);margin-top:6px;padding:8px 10px;background:var(--bg-2);border-radius:8px;line-height:1.5;}
    .score-ring{position:relative;width:140px;height:140px;margin:0 auto 16px;}
    .score-ring svg{transform:rotate(-90deg);}
    .score-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .score-num{font-family:var(--font-display);font-size:2rem;line-height:1;}
    .score-label-text{font-family:var(--font-mono);font-size:.625rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em;}
    .score-quality{font-size:.9375rem;font-weight:600;text-align:center;margin-bottom:16px;}
    .rec-list{list-style:none;padding:0;margin:0 0 20px;}
    .rec-list li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;font-size:.8125rem;color:var(--ink-2);line-height:1.5;border-bottom:1px solid var(--line);}
    .rec-list li:last-child{border-bottom:none;}
    .rec-dot{width:6px;height:6px;border-radius:50%;background:var(--violet);flex-shrink:0;margin-top:6px;}
    .approved-section{margin-top:20px;}
    .approved-section .section-title{font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;}
    .approved-example{padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:.75rem;color:var(--ink-2);line-height:1.5;}
    .approved-example .ex-tag{font-family:var(--font-mono);font-size:.5625rem;color:var(--emerald);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
    @media(max-width:1024px){.smart-grid{grid-template-columns:1fr;height:auto;overflow:visible;}.smart-left,.smart-right{border:none;padding:16px;}}
  </style>
</head>
<body><div id="root"><div class="app-splash"><div class="splash-logo"><img src="../assets/logo.png" alt=""/></div><div class="splash-name">TCC<em>Flow</em></div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SMART_DATA = [
  {
    key:"S", label:"Específico", color:"var(--violet)",
    desc:"O tema deve ser claro, direto e bem delimitado, evitando generalidades.",
    good:"Impacto das redes sociais na autoestima de adolescentes de 15-18 anos em escolas públicas de São Paulo",
    bad:"Redes sociais e jovens"
  },
  {
    key:"M", label:"Mensurável", color:"var(--cyan)",
    desc:"Deve ser possível medir os resultados da pesquisa com dados concretos.",
    good:"Análise quantitativa da correlação entre tempo de tela e desempenho escolar",
    bad:"Estudo sobre tecnologia na educação"
  },
  {
    key:"A", label:"Alcançável", color:"var(--emerald)",
    desc:"O escopo deve ser viável dentro dos recursos e prazos de um TCC.",
    good:"Pesquisa com 50 alunos de uma escola municipal usando questionário online",
    bad:"Pesquisa com todos os estudantes do Brasil"
  },
  {
    key:"R", label:"Relevante", color:"var(--amber)",
    desc:"O tema deve contribuir para a área de estudo e ter aplicação prática.",
    good:"Efeitos da gamificação no ensino de matemática: uma proposta para o ensino fundamental",
    bad:"Estudo sobre um assunto já muito pesquisado sem nova perspectiva"
  },
  {
    key:"T", label:"Temporal", color:"var(--rose)",
    desc:"A pesquisa deve ter um recorte temporal claro e ser realizável no prazo.",
    good:"Adoção de inteligência artificial em PMEs brasileiras no período 2023-2025",
    bad:"História completa da computação desde o início"
  }
];

const SUGGESTIONS_MAP = {
  specific: [
    "Delimite o público-alvo (ex: faixa etária, profissão)",
    "Defina o contexto geográfico (ex: cidade, região)",
    "Adicione um subtítulo com recorte mais preciso"
  ],
  measurable: [
    "Mencione a metodologia (ex: pesquisa quantitativa, estudo de caso)",
    "Inclua termos como análise, avaliação, comparação ou impacto",
    "Indique que tipo de dados serão coletados"
  ],
  achievable: [
    "Reduza o escopo para algo realizável em um semestre",
    "Evite termos absolutos como toda, sempre, universal",
    "Foque em uma amostra acessível"
  ],
  relevant: [
    "Conecte o tema a uma área de conhecimento (saúde, educação, tecnologia)",
    "Justifique a relevância social ou acadêmica",
    "Relacione com problemas ou desafios atuais"
  ],
  temporal: [
    "Adicione um recorte temporal (ex: 2020-2025)",
    "Use termos como atual, contemporâneo, recente",
    "Especifique o período de coleta de dados"
  ]
};

const APPROVED_EXAMPLES = [
  "Impacto da gamificação no engajamento de alunos do ensino médio em escolas públicas de Belo Horizonte (2024-2025)",
  "Análise da influência do marketing digital na decisão de compra de consumidores de 18-30 anos no e-commerce brasileiro",
  "Efeitos do trabalho remoto na saúde mental de profissionais de tecnologia durante o período pós-pandêmico"
];

function analyzeTheme(text) {
  const words = text.trim().split(/\s+/);
  const lower = text.toLowerCase();
  const results = {};

  results.specific = words.length >= 5 && !/geral|tudo|vários/.test(lower);
  results.measurable = /impacto|efeito|relação|correlação|influência|análise|comparação|avaliação/.test(lower);
  results.achievable = !/toda|sempre|nunca|impossível|universal|mundo inteiro/.test(lower) && words.length < 30;
  results.relevant = /saúde|educação|tecnologia|social|ambiental|econômic|psicolog|comunicação|direito|engenhar/.test(lower);
  results.temporal = /\d{4}|atual|contemporâne|século|década|pandemic|pós-|recente|últimos anos|período/.test(lower);

  const score = Object.values(results).filter(Boolean).length * 20;
  return { results, score };
}

function getScoreColor(score) {
  if (score >= 80) return "var(--emerald)";
  if (score >= 60) return "var(--cyan)";
  if (score >= 40) return "var(--amber)";
  return "var(--rose)";
}

function getScoreLabel(score) {
  if (score >= 80) return "Excelente";
  if (score >= 60) return "Bom";
  if (score >= 40) return "Regular";
  return "Fraco";
}

function LeftPanel({ checks, onToggle, expanded, onExpand }) {
  const checkedCount = Object.values(checks).filter(Boolean).length;

  return (
    React.createElement("div", {className:"smart-left"},
      React.createElement("div", {className:"smart-header"}, "Critérios SMART"),
      SMART_DATA.map(function(item) {
        const isOpen = expanded === item.key;
        return React.createElement("div", {className:"smart-item", key:item.key},
          React.createElement("div", {className:"smart-item-head", onClick:function(){onExpand(isOpen ? null : item.key);}},
            React.createElement("div", {className:"letter-circle", style:{background:item.color}}, item.key),
            React.createElement("span", {className:"title"}, item.label),
            React.createElement("span", {className:"arrow" + (isOpen ? " open" : "")}, "▼")
          ),
          isOpen && React.createElement("div", {className:"smart-item-body"},
            React.createElement("p", null, item.desc),
            React.createElement("div", {className:"example-label"}, "Bom exemplo"),
            React.createElement("div", {className:"example-good"}, "✓ " + item.good),
            React.createElement("div", {className:"example-label"}, "Exemplo fraco"),
            React.createElement("div", {className:"example-bad"}, "✗ " + item.bad),
            React.createElement("label", {className:"smart-item-check"},
              React.createElement("input", {type:"checkbox", checked:!!checks[item.key], onChange:function(){onToggle(item.key);}}),
              "Atende este critério?"
            )
          )
        );
      }),
      React.createElement("div", {className:"progress-label"}, checkedCount + "/5 critérios"),
      React.createElement("div", {className:"progress-track"},
        React.createElement("div", {className:"progress-track-fill", style:{width:(checkedCount * 20) + "%"}})
      )
    )
  );
}

function MainArea({ theme, setTheme, analysis }) {
  const keys = ["specific","measurable","achievable","relevant","temporal"];
  const labels = ["Específico","Mensurável","Alcançável","Relevante","Temporal"];
  const letters = ["S","M","A","R","T"];
  const colors = ["var(--violet)","var(--cyan)","var(--emerald)","var(--amber)","var(--rose)"];
  const explanations = {
    specific: {yes:"O tema é claro e bem delimitado.", partial:"O tema poderia ser mais específico.", no:"O tema é muito genérico e precisa de delimitação."},
    measurable: {yes:"Contém termos que indicam mensurabilidade.", partial:"Faltam indicadores claros de mensuração.", no:"Não indica como os resultados serão medidos."},
    achievable: {yes:"O escopo é viável para um TCC.", partial:"O escopo pode ser um pouco amplo.", no:"O escopo parece inviável ou muito amplo."},
    relevant: {yes:"O tema está conectado a uma área relevante.", partial:"A relevância poderia ser mais explícita.", no:"Não indica conexão com uma área de conhecimento."},
    temporal: {yes:"Possui recorte temporal definido.", partial:"O recorte temporal poderia ser mais claro.", no:"Não possui referência temporal."}
  };
  const suggestions = {
    specific:"Tente adicionar público-alvo, contexto geográfico ou subtítulo delimitador.",
    measurable:"Inclua termos como análise, impacto, avaliação ou comparação.",
    achievable:"Reduza o escopo e evite termos absolutos como toda, sempre, nunca.",
    relevant:"Conecte o tema a uma área como saúde, educação, tecnologia ou direito.",
    temporal:"Adicione um período, ano ou termo como atual, recente ou pós-pandêmico."
  };

  return (
    React.createElement("div", {className:"smart-main"},
      React.createElement("div", {className:"smart-header"}, "Analise seu tema"),
      React.createElement("input", {
        className:"theme-input",
        type:"text",
        placeholder:"Digite seu tema de TCC...",
        value:theme,
        onChange:function(e){setTheme(e.target.value);}
      }),
      React.createElement("div", {style:{marginTop:24}},
        !analysis
          ? React.createElement("div", {className:"empty-state"},
              React.createElement("div", {className:"es-icon"}, "🎯"),
              React.createElement("h3", null, "Aguardando tema"),
              React.createElement("p", null, "Digite um tema acima para iniciar a análise")
            )
          : keys.map(function(k, i) {
              var passed = analysis.results[k];
              var status = passed ? "atende" : "nao";
              var statusLabel = passed ? "✓ Atende" : "✗ Não atende";
              var statusClass = passed ? "status-atende" : "status-nao";
              var explain = passed ? explanations[k].yes : explanations[k].no;

              return React.createElement("div", {className:"analysis-card", key:k},
                React.createElement("div", {className:"letter-circle", style:{background:colors[i], width:36, height:36, fontSize:".875rem"}}, letters[i]),
                React.createElement("div", {style:{flex:1, minWidth:0}},
                  React.createElement("div", {style:{display:"flex", alignItems:"center", gap:10, marginBottom:4}},
                    React.createElement("span", {style:{fontWeight:600, fontSize:".875rem", color:"var(--ink)"}}, labels[i]),
                    React.createElement("span", {className:"status-badge " + statusClass}, statusLabel)
                  ),
                  React.createElement("p", {style:{fontSize:".8125rem", color:"var(--ink-2)", lineHeight:1.5}}, explain),
                  !passed && React.createElement("div", {className:"suggestion"}, "💡 " + suggestions[k])
                )
              );
            })
      )
    )
  );
}

function RightPanel({ analysis, onSave }) {
  var score = analysis ? analysis.score : 0;
  var circumference = 2 * Math.PI * 58;
  var offset = circumference - (score / 100) * circumference;
  var color = getScoreColor(score);
  var label = getScoreLabel(score);

  var recs = [];
  if (analysis) {
    if (!analysis.results.specific) recs = recs.concat(SUGGESTIONS_MAP.specific);
    if (!analysis.results.measurable) recs = recs.concat(SUGGESTIONS_MAP.measurable);
    if (!analysis.results.achievable) recs = recs.concat(SUGGESTIONS_MAP.achievable);
    if (!analysis.results.relevant) recs = recs.concat(SUGGESTIONS_MAP.relevant);
    if (!analysis.results.temporal) recs = recs.concat(SUGGESTIONS_MAP.temporal);
  }

  return (
    React.createElement("div", {className:"smart-right"},
      React.createElement("div", {className:"score-ring"},
        React.createElement("svg", {width:140, height:140, viewBox:"0 0 140 140"},
          React.createElement("circle", {cx:70, cy:70, r:58, fill:"none", stroke:"var(--line)", strokeWidth:8}),
          React.createElement("circle", {cx:70, cy:70, r:58, fill:"none", stroke:color, strokeWidth:8, strokeLinecap:"round",
            strokeDasharray:circumference, strokeDashoffset:offset,
            style:{transition:"stroke-dashoffset .8s ease, stroke .4s ease"}})
        ),
        React.createElement("div", {className:"score-val"},
          React.createElement("span", {className:"score-num", style:{color:color}}, score + "%"),
          React.createElement("span", {className:"score-label-text"}, "pontuação")
        )
      ),
      React.createElement("div", {className:"score-quality", style:{color:color}}, label),
      recs.length > 0 && React.createElement("div", null,
        React.createElement("div", {className:"smart-header"}, "Recomendações"),
        React.createElement("ul", {className:"rec-list"},
          recs.map(function(r, i) {
            return React.createElement("li", {key:i},
              React.createElement("span", {className:"rec-dot"}),
              r
            );
          })
        )
      ),
      React.createElement("div", {className:"approved-section"},
        React.createElement("div", {className:"section-title"}, "Exemplos de temas aprovados"),
        APPROVED_EXAMPLES.map(function(ex, i) {
          return React.createElement("div", {className:"approved-example", key:i},
            React.createElement("div", {className:"ex-tag"}, "Exemplo " + (i + 1)),
            ex
          );
        })
      ),
      React.createElement("button", {
        className:"btn btn-violet",
        style:{width:"100%", marginTop:16, justifyContent:"center"},
        onClick:onSave,
        disabled:!analysis
      }, "Salvar análise")
    )
  );
}

function SmartPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [theme, setTheme] = useState("");
  const [analysis, setAnalysis] = useState(null);
  const [checks, setChecks] = useState({});
  const [expanded, setExpanded] = useState("S");
  const debounceRef = useRef(null);

  useEffect(function() {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    if (theme.trim().length < 5) { setAnalysis(null); return; }
    debounceRef.current = setTimeout(function() {
      setAnalysis(analyzeTheme(theme));
    }, 500);
    return function() { clearTimeout(debounceRef.current); };
  }, [theme]);

  useEffect(function() {
    if (!analysis) return;
    var newChecks = {};
    var keys = ["S","M","A","R","T"];
    var fields = ["specific","measurable","achievable","relevant","temporal"];
    fields.forEach(function(f, i) { newChecks[keys[i]] = analysis.results[f]; });
    setChecks(newChecks);
  }, [analysis]);

  function handleToggleCheck(key) {
    setChecks(function(prev) {
      var next = Object.assign({}, prev);
      next[key] = !next[key];
      return next;
    });
  }

  function handleSave() {
    if (!analysis || !user) return;
    var data = {theme:theme, score:analysis.score, results:analysis.results, date:new Date().toISOString()};
    localStorage.setItem("tccflow_smart_" + user.uid, JSON.stringify(data));
    alert("Análise salva com sucesso!");
  }

  if (loading) return React.createElement("div", {style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"var(--font-body)",color:"var(--muted)"}}, "Carregando...");

  return (
    React.createElement("div", {className:"app-layout"},
      React.createElement(Sidebar, {active:"tools", userData:userData, project:project, subscription:subscription}),
      React.createElement("div", {className:"main-area"},
        React.createElement(Topbar, {page:"Validação SMART", user:user}),
        React.createElement("div", {className:"smart-grid"},
          React.createElement(LeftPanel, {checks:checks, onToggle:handleToggleCheck, expanded:expanded, onExpand:setExpanded}),
          React.createElement(MainArea, {theme:theme, setTheme:setTheme, analysis:analysis}),
          React.createElement(RightPanel, {analysis:analysis, onSave:handleSave})
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(SmartPage));
</script>
</body></html>
