<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Diário de Progresso — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    .diary-grid{display:grid;grid-template-columns:260px 1fr 280px;height:calc(100vh - 60px);overflow:hidden}
    .diary-left{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
    .diary-left-header{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .month-nav{display:flex;align-items:center;gap:6px}
    .month-nav button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.875rem;padding:2px 4px;border-radius:4px;transition:color .15s}
    .month-nav button:hover{color:var(--ink)}
    .month-nav span{font-family:var(--font-mono);font-size:.75rem;font-weight:600;color:var(--ink);min-width:90px;text-align:center}
    .timeline-list{flex:1;overflow-y:auto;padding:12px 0 12px 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .timeline-list::-webkit-scrollbar{width:3px}
    .timeline-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
    .tl-item{position:relative;padding:10px 16px 10px 40px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;margin-bottom:2px}
    .tl-item:hover{background:rgba(124,58,237,.04)}
    .tl-item.selected{background:rgba(124,58,237,.07);border-left-color:var(--violet)}
    .tl-line{position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--line)}
    .tl-dot{position:absolute;left:17px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--paper);z-index:1}
    .tl-dot.status-done{border-color:var(--emerald);background:var(--emerald)}
    .tl-dot.status-progress{border-color:var(--amber);background:var(--amber)}
    .tl-dot.status-planned{border-color:var(--muted);background:var(--muted)}
    .tl-date{font-family:var(--font-mono);font-size:.75rem;font-weight:700;color:var(--ink)}
    .tl-time{font-family:var(--font-mono);font-size:.625rem;color:var(--muted);margin-left:6px}
    .tl-title{font-size:.8125rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .diary-main{overflow-y:auto;padding:28px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .diary-main::-webkit-scrollbar{width:4px}
    .diary-main::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
    .diary-right{background:var(--bg-2);border-left:1px solid var(--line);overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .diary-right::-webkit-scrollbar{width:3px}
    .diary-right::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
    .mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
    .mini-cal-head{font-family:var(--font-mono);font-size:.5625rem;text-align:center;color:var(--muted);text-transform:uppercase}
    .mini-cal-day{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.5625rem;color:var(--muted)}
    .mini-cal-day.has-entry{background:rgba(16,185,129,.15);color:var(--emerald);font-weight:600}
    .mini-cal-day.today{outline:2px solid var(--violet);outline-offset:-1px}
    .week-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .week-bar-label{font-family:var(--font-mono);font-size:.5625rem;color:var(--muted);width:24px;text-align:right;flex-shrink:0}
    .week-bar-fill{height:16px;border-radius:4px;background:var(--grad);min-width:2px;transition:width .4s}
    .week-bar-val{font-family:var(--font-mono);font-size:.5625rem;color:var(--muted);flex-shrink:0}
    .mood-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .mood-bar-emoji{font-size:.875rem;flex-shrink:0;width:22px;text-align:center}
    .mood-bar-track{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
    .mood-bar-fill{height:100%;border-radius:5px;background:var(--violet-2);transition:width .4s}
    .mood-bar-count{font-family:var(--font-mono);font-size:.5625rem;color:var(--muted);width:16px;text-align:right;flex-shrink:0}
    .topic-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
    .topic-item:last-child{border-bottom:none}
    .topic-word{font-size:.8125rem;color:var(--ink-2)}
    .topic-count{font-family:var(--font-mono);font-size:.625rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
    .mood-selector{display:flex;gap:8px;align-items:center}
    .mood-btn{font-size:1.5rem;cursor:pointer;transition:transform .15s,opacity .15s;opacity:.4;filter:grayscale(.5);background:none;border:none;padding:4px;border-radius:8px}
    .mood-btn:hover{opacity:.8;filter:none;transform:scale(1.15)}
    .mood-btn.active{opacity:1;filter:none;transform:scale(1.25);background:rgba(124,58,237,.08)}
    .view-field{margin-bottom:16px}
    .view-field-label{font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
    .view-field-value{font-size:.9375rem;color:var(--ink);line-height:1.55;white-space:pre-wrap}
    @media(max-width:768px){
      .diary-grid{grid-template-columns:1fr;height:auto}
      .diary-left,.diary-right{display:none}
    }
  </style>
</head>
<body><div id="root"><div class="app-splash"><div class="splash-logo"><img src="../assets/logo.png" alt=""/></div><div class="splash-name">TCC<em>Flow</em></div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const MONTHS_PT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MOODS = [{v:1,e:"\u{1F61F}"},{v:2,e:"\u{1F610}"},{v:3,e:"\u{1F642}"},{v:4,e:"\u{1F60A}"},{v:5,e:"\u{1F929}"}];
const STOP_WORDS = new Set(["de","do","da","dos","das","e","o","a","os","as","em","no","na","nos","nas","um","uma","para","com","que","por","se","ao","ou","foi","ser","ter","mais","como","mas","este","esta","esse","essa","isso","isto","ele","ela","seu","sua","meu","minha","nos","eu","me","muito","sobre","entre","quando","onde","mesmo","depois","antes","ainda","bem","pode","tem","fiz","fazer","feito","dia"]);

function pad2(n){return String(n).padStart(2,"0");}
function fmtDate(d){return `${pad2(d.getDate())} ${MONTHS_PT[d.getMonth()]}`;}
function fmtTime(t){return t||"";}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function firstDayOfMonth(y,m){return new Date(y,m,1).getDay();}
function isoDate(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`;}
function weekOfMonth(dateStr){const d=new Date(dateStr+"T00:00:00");const first=new Date(d.getFullYear(),d.getMonth(),1);return Math.floor((d.getDate()+first.getDay()-1)/7);}

function DiarioPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [entries, setEntries] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [editing, setEditing] = useState(false);
  const [creating, setCreating] = useState(false);
  const [viewMonth, setViewMonth] = useState(new Date().getMonth());
  const [viewYear, setViewYear] = useState(new Date().getFullYear());
  const [saving, setSaving] = useState(false);

  const [formDate, setFormDate] = useState("");
  const [formTime, setFormTime] = useState("");
  const [formStatus, setFormStatus] = useState("planned");
  const [formTitle, setFormTitle] = useState("");
  const [formWhatDone, setFormWhatDone] = useState("");
  const [formNextSteps, setFormNextSteps] = useState("");
  const [formHours, setFormHours] = useState(0);
  const [formMinutes, setFormMinutes] = useState(0);
  const [formMood, setFormMood] = useState(0);

  const projectId = project?.id;

  const loadEntries = useCallback(async () => {
    if (!projectId) return;
    try {
      const { data, error } = await _supa
        .from("diary_entries")
        .select("*")
        .eq("project_id", projectId)
        .order("date", { ascending: false });
      if (error) throw error;
      setEntries(data || []);
    } catch(e) {
      console.error(e);
    }
  }, [projectId]);

  useEffect(() => { loadEntries(); }, [loadEntries]);

  const monthEntries = useMemo(() =>
    entries.filter(en => {
      const d = new Date(en.date + "T00:00:00");
      return d.getMonth() === viewMonth && d.getFullYear() === viewYear;
    }).sort((a,b) => b.date.localeCompare(a.date) || (b.time||"").localeCompare(a.time||""))
  , [entries, viewMonth, viewYear]);

  const selected = entries.find(e => e.id === selectedId) || null;

  function prevMonth(){
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y-1); }
    else setViewMonth(m => m-1);
  }
  function nextMonth(){
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y+1); }
    else setViewMonth(m => m+1);
  }

  function resetForm(){
    const now = new Date();
    setFormDate(now.toISOString().split("T")[0]);
    setFormTime(pad2(now.getHours())+":"+pad2(now.getMinutes()));
    setFormStatus("planned");
    setFormTitle("");
    setFormWhatDone("");
    setFormNextSteps("");
    setFormHours(0);
    setFormMinutes(0);
    setFormMood(0);
  }

  function startCreate(){
    resetForm();
    setSelectedId(null);
    setEditing(false);
    setCreating(true);
  }

  function startEdit(){
    if (!selected) return;
    setFormDate(selected.date||"");
    setFormTime(selected.time||"");
    setFormStatus(selected.status||"planned");
    setFormTitle(selected.title||"");
    setFormWhatDone(selected.what_done||"");
    setFormNextSteps(selected.next_steps||"");
    const mins = selected.time_spent_minutes||0;
    setFormHours(Math.floor(mins/60));
    setFormMinutes(mins%60);
    setFormMood(selected.mood||0);
    setEditing(true);
    setCreating(false);
  }

  async function saveEntry(){
    if (!formTitle.trim() || !formDate) return;
    setSaving(true);
    const payload = {
      project_id: projectId,
      user_id: user.uid,
      date: formDate,
      time: formTime,
      title: formTitle.trim(),
      what_done: formWhatDone.trim(),
      next_steps: formNextSteps.trim(),
      time_spent_minutes: (parseInt(formHours)||0)*60 + (parseInt(formMinutes)||0),
      status: formStatus,
      mood: formMood,
      updated_at: new Date().toISOString()
    };
    try {
      if (editing && selectedId) {
        const { error } = await _supa.from("diary_entries").update(payload).eq("id", selectedId);
        if (error) throw error;
      } else {
        payload.created_at = new Date().toISOString();
        const { data, error } = await _supa.from("diary_entries").insert(payload).select().maybeSingle();
        if (error) throw error;
        if (data) setSelectedId(data.id);
      }
      await loadEntries();
      setEditing(false);
      setCreating(false);
    } catch(e) {
      console.error(e);
    }
    setSaving(false);
  }

  async function deleteEntry(){
    if (!selectedId) return;
    if (!confirm("Excluir esta entrada?")) return;
    try {
      const { error } = await _supa.from("diary_entries").delete().eq("id", selectedId);
      if (error) throw error;
      setSelectedId(null);
      setEditing(false);
      await loadEntries();
    } catch(e) { console.error(e); }
  }

  const statusLabel = s => s === "done" ? "Concluído" : s === "progress" ? "Em progresso" : "Planejado";
  const statusDotClass = s => s === "done" ? "status-done" : s === "progress" ? "status-progress" : "status-planned";

  const totalMinutes = monthEntries.reduce((s,e) => s + (e.time_spent_minutes||0), 0);
  const totalHours = (totalMinutes/60).toFixed(1);

  const weekHours = useMemo(() => {
    const w = [0,0,0,0,0];
    monthEntries.forEach(e => {
      const wi = weekOfMonth(e.date);
      if (wi >= 0 && wi < 5) w[wi] += (e.time_spent_minutes||0)/60;
    });
    return w.slice(-4);
  }, [monthEntries]);

  const moodDist = useMemo(() => {
    const d = [0,0,0,0,0];
    monthEntries.forEach(e => { if (e.mood >= 1 && e.mood <= 5) d[e.mood-1]++; });
    return d;
  }, [monthEntries]);

  const avgMood = useMemo(() => {
    const mooded = monthEntries.filter(e => e.mood >= 1 && e.mood <= 5);
    if (!mooded.length) return 0;
    return Math.round(mooded.reduce((s,e) => s + e.mood, 0) / mooded.length);
  }, [monthEntries]);

  const topWords = useMemo(() => {
    const freq = {};
    monthEntries.forEach(e => {
      const text = ((e.what_done||"") + " " + (e.next_steps||"") + " " + (e.title||"")).toLowerCase();
      text.split(/\s+/).forEach(w => {
        const clean = w.replace(/[^a-záàâãéèêíïóôõúüç]/gi,"");
        if (clean.length > 2 && !STOP_WORDS.has(clean)) freq[clean] = (freq[clean]||0)+1;
      });
    });
    return Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,5);
  }, [monthEntries]);

  const entryDates = useMemo(() => new Set(monthEntries.map(e => e.date)), [monthEntries]);

  if (loading) return React.createElement(AppSplash);

  const isFormOpen = creating || editing;

  return (
    <div className="app-layout">
      <Sidebar active="tools" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Diário de Progresso" user={user} actions={}/>
        <div className="diary-grid">
          <div className="diary-left">
            <div className="diary-left-header">
              <span style={{fontFamily:"var(--font-display)",fontSize:"1.125rem"}}>Entradas</span>
              <div className="month-nav">
                <button onClick={prevMonth}>&larr;</button>
                <span>{MONTHS_PT[viewMonth]} {viewYear}</span>
                <button onClick={nextMonth}>&rarr;</button>
              </div>
            </div>
            <div className="timeline-list">
              {monthEntries.length === 0 && (
                <div style={{padding:"32px 16px",textAlign:"center",color:"var(--muted)",fontSize:".8125rem"}}>Nenhuma entrada este mês</div>
              )}
              {monthEntries.map(en => {
                const d = new Date(en.date+"T00:00:00");
                return (
                  <div key={en.id} className={`tl-item${selectedId===en.id?" selected":""}`} onClick={() => { setSelectedId(en.id); setEditing(false); setCreating(false); }}>
                    <div className="tl-line"></div>
                    <div className={`tl-dot ${statusDotClass(en.status)}`}></div>
                    <div>
                      <span className="tl-date">{fmtDate(d)}</span>
                      {en.time && <span className="tl-time">{fmtTime(en.time)}</span>}
                    </div>
                    <div className="tl-title">{en.title||"Sem título"}</div>
                  </div>
                );
              })}
            </div>
            <div style={{padding:"12px 16px",borderTop:"1px solid var(--line)",flexShrink:0}}>
              <button className="btn btn-violet" style={{width:"100%",justifyContent:"center"}} onClick={startCreate}>+ Nova entrada</button>
            </div>
          </div>

          <div className="diary-main">
            {!selected && !isFormOpen && (
              <div className="empty-state">
                <div className="es-icon">{"\u{1F4D3}"}</div>
                <h3>Selecione ou crie uma entrada</h3>
                <p>Use o painel lateral para navegar entre entradas ou crie uma nova.</p>
              </div>
            )}

            {isFormOpen && (
              <div>
                <div style={{marginBottom:20}}>
                  <span style={{fontFamily:"var(--font-display)",fontSize:"1.5rem"}}>{editing?"Editar entrada":"Nova entrada"}</span>
                </div>
                <div className="grid-2" style={{marginBottom:0}}>
                  <div className="field">
                    <label>Data</label>
                    <input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)}/>
                  </div>
                  <div className="field">
                    <label>Hora</label>
                    <input type="time" value={formTime} onChange={e=>setFormTime(e.target.value)}/>
                  </div>
                </div>
                <div className="field">
                  <label>Status</label>
                  <select value={formStatus} onChange={e=>setFormStatus(e.target.value)}>
                    <option value="planned">Planejado</option>
                    <option value="progress">Em progresso</option>
                    <option value="done">Concluído</option>
                  </select>
                </div>
                <div className="field">
                  <label>Título</label>
                  <input type="text" value={formTitle} onChange={e=>setFormTitle(e.target.value)} placeholder="Título da entrada" style={{fontFamily:"var(--font-display)",fontSize:"1.25rem"}}/>
                </div>
                <div className="field">
                  <label>O que foi feito</label>
                  <textarea value={formWhatDone} onChange={e=>setFormWhatDone(e.target.value)} style={{minHeight:200}} placeholder="Descreva o que foi realizado..."/>
                </div>
                <div className="field">
                  <label>Próximos passos</label>
                  <textarea value={formNextSteps} onChange={e=>setFormNextSteps(e.target.value)} style={{minHeight:150}} placeholder="O que precisa ser feito a seguir..."/>
                </div>
                <div className="grid-2" style={{marginBottom:0}}>
                  <div className="field">
                    <label>Horas</label>
                    <input type="number" min="0" max="24" value={formHours} onChange={e=>setFormHours(e.target.value)}/>
                  </div>
                  <div className="field">
                    <label>Minutos</label>
                    <input type="number" min="0" max="59" value={formMinutes} onChange={e=>setFormMinutes(e.target.value)}/>
                  </div>
                </div>
                <div className="field">
                  <label>Humor</label>
                  <div className="mood-selector">
                    {MOODS.map(m => (
                      <button key={m.v} type="button" className={`mood-btn${formMood===m.v?" active":""}`} onClick={()=>setFormMood(m.v)}>{m.e}</button>
                    ))}
                  </div>
                </div>
                <div style={{display:"flex",gap:10,marginTop:8}}>
                  <button className="btn btn-violet" onClick={saveEntry} disabled={saving}>{saving?"Salvando...":"Salvar entrada"}</button>
                  <button className="btn btn-ghost" onClick={()=>{setCreating(false);setEditing(false);}}>Cancelar</button>
                </div>
              </div>
            )}

            {selected && !isFormOpen && (
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                  <span style={{fontFamily:"var(--font-display)",fontSize:"1.5rem"}}>{selected.title||"Sem título"}</span>
                  <div style={{display:"flex",gap:8}}>
                    <button className="btn btn-ghost btn-sm" onClick={startEdit}>Editar</button>
                    <button className="btn btn-ghost btn-sm" style={{color:"var(--rose)"}} onClick={deleteEntry}>Excluir</button>
                  </div>
                </div>
                <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}}>
                  <span className={`tag ${selected.status==="done"?"tag-emerald":selected.status==="progress"?"tag-amber":"tag-slate"}`}>{statusLabel(selected.status)}</span>
                  <span className="tag tag-violet">{(() => { const d=new Date(selected.date+"T00:00:00"); return fmtDate(d); })()}{selected.time ? " · " + selected.time : ""}</span>
                  {selected.time_spent_minutes > 0 && <span className="tag tag-cyan">{Math.floor(selected.time_spent_minutes/60)}h {selected.time_spent_minutes%60}min</span>}
                  {selected.mood >= 1 && selected.mood <= 5 && <span style={{fontSize:"1.25rem"}}>{MOODS[selected.mood-1].e}</span>}
                </div>
                {selected.what_done && (
                  <div className="view-field">
                    <div className="view-field-label">O que foi feito</div>
                    <div className="view-field-value">{selected.what_done}</div>
                  </div>
                )}
                {selected.next_steps && (
                  <div className="view-field">
                    <div className="view-field-label">Próximos passos</div>
                    <div className="view-field-value">{selected.next_steps}</div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="diary-right">
            <div className="card" style={{marginBottom:16}}>
              <div className="card-title"><span className="ct-icon">{"\u{1F4C5}"}</span> Progresso do mês</div>
              <div className="mini-cal">
                {["D","S","T","Q","Q","S","S"].map((d,i) => <div key={i} className="mini-cal-head">{d}</div>)}
                {(() => {
                  const first = firstDayOfMonth(viewYear, viewMonth);
                  const total = daysInMonth(viewYear, viewMonth);
                  const today = new Date();
                  const cells = [];
                  for (let i=0;i<first;i++) cells.push(<div key={"e"+i} className="mini-cal-day"></div>);
                  for (let d=1;d<=total;d++){
                    const iso = isoDate(viewYear,viewMonth,d);
                    const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
                    const has = entryDates.has(iso);
                    cells.push(<div key={d} className={`mini-cal-day${has?" has-entry":""}${isToday?" today":""}`}>{d}</div>);
                  }
                  return cells;
                })()}
              </div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)",textAlign:"center"}}>{monthEntries.length} entrada{monthEntries.length!==1?"s":""} este mês</div>
            </div>

            <div className="card" style={{marginBottom:16}}>
              <div className="card-title"><span className="ct-icon">{"⏱"}</span> Tempo investido</div>
              <div style={{fontFamily:"var(--font-display)",fontSize:"2rem",textAlign:"center",marginBottom:12,color:"var(--ink)"}}>{totalHours}<span style={{fontSize:".875rem",color:"var(--muted)",marginLeft:4}}>horas</span></div>
              {weekHours.map((h,i) => {
                const max = Math.max(...weekHours, 1);
                return (
                  <div className="week-bar" key={i}>
                    <div className="week-bar-label">S{i+1}</div>
                    <div style={{flex:1,background:"var(--line)",borderRadius:4,height:16,overflow:"hidden"}}>
                      <div className="week-bar-fill" style={{width:Math.max((h/max)*100,2)+"%"}}></div>
                    </div>
                    <div className="week-bar-val">{h.toFixed(1)}h</div>
                  </div>
                );
              })}
            </div>

            <div className="card" style={{marginBottom:16}}>
              <div className="card-title"><span className="ct-icon">{"\u{1F60A}"}</span> Humor médio</div>
              <div style={{textAlign:"center",fontSize:"2rem",marginBottom:10}}>{avgMood >= 1 && avgMood <= 5 ? MOODS[avgMood-1].e : "—"}</div>
              {MOODS.map((m,i) => {
                const max = Math.max(...moodDist, 1);
                return (
                  <div className="mood-bar-row" key={i}>
                    <div className="mood-bar-emoji">{m.e}</div>
                    <div className="mood-bar-track"><div className="mood-bar-fill" style={{width:(moodDist[i]/max)*100+"%"}}></div></div>
                    <div className="mood-bar-count">{moodDist[i]}</div>
                  </div>
                );
              })}
            </div>

            <div className="card">
              <div className="card-title"><span className="ct-icon">{"\u{1F4AC}"}</span> Tópicos frequentes</div>
              {topWords.length === 0 && <div style={{fontSize:".8125rem",color:"var(--muted)",textAlign:"center",padding:"12px 0"}}>Sem dados suficientes</div>}
              {topWords.map(([word, count]) => (
                <div className="topic-item" key={word}>
                  <span className="topic-word">{word}</span>
                  <span className="topic-count">{count}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DiarioPage/>);
</script>
</body></html>
