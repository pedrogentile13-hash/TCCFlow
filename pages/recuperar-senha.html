<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .liquid-bg .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
        .blob-1 { width: 500px; height: 500px; background: rgba(139,92,246,0.12); top: -100px; right: -100px; animation: drift1 25s infinite ease-in-out; }
        .blob-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.10); bottom: -80px; left: -80px; animation: drift2 30s infinite ease-in-out; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-150px,100px) scale(1.1)} 66%{transform:translate(80px,-60px) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(120px,-80px) scale(0.95)} 66%{transform:translate(-60px,60px) scale(1.1)} }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="login.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao login
        </a>

        <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50">

            <!-- Step 1: Email Input -->
            <div id="step1">
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-key text-white text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Recuperar Senha</h1>
                    <p class="text-sm text-slate-500 mt-2">Enviaremos um link de recuperacao para seu email</p>
                </div>

                <form id="recoveryForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">
                            <i class="fa-solid fa-envelope mr-1 text-violet-600"></i> Email
                        </label>
                        <input type="email" id="email" required placeholder="seu@email.com"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                    </div>

                    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                        <i class="fa-solid fa-paper-plane mr-2"></i>Enviar link
                    </button>
                </form>

                <p class="text-center text-sm text-slate-500 mt-6">
                    Lembrou a senha? <a href="login.html" class="text-violet-600 hover:underline font-medium">Fazer login</a>
                </p>
            </div>

            <!-- Step 2: Success Message -->
            <div id="step2" class="hidden">
                <div class="text-center">
                    <div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-check text-green-600 text-xl"></i>
                    </div>
                    <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl px-4 py-4 mb-6">
                        Link de recuperacao enviado! Verifique seu email (inclusive a pasta de spam).
                    </div>
                    <a href="login.html"
                        class="inline-block w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25 text-center">
                        <i class="fa-solid fa-arrow-left mr-2"></i>Voltar ao Login
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('recoveryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Enviando...';

            try {
                await auth.resetPasswordForEmail(email);
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } catch (err) {
                errorMsg.textContent = err.message || 'Erro ao enviar email de recuperacao.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Enviar link';
            }
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
