<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>I.A. — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .ai-root{display:flex;height:100%;overflow:hidden;}
    .conv-sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);overflow:hidden;}
    .conv-sidebar-head{padding:14px 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
    .conv-list{flex:1;overflow-y:auto;padding:8px 8px;scrollbar-width:none;}
    .conv-list::-webkit-scrollbar{display:none;}
    .conv-section-label{font-family:var(--font-mono);font-size:.5625rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 6px 4px;}
    .conv-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
    .conv-item:hover{background:var(--bg-2);}
    .conv-item.active{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);}
    .conv-item .ci-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.8125rem;flex-shrink:0;}
    .conv-item .ci-body{flex:1;min-width:0;}
    .conv-item .ci-title{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-item .ci-meta{font-family:var(--font-mono);font-size:.5625rem;color:var(--muted);margin-top:1px;}
    .ai-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
    .mode-tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);background:var(--paper);}
    .mode-tab{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:.875rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;margin-bottom:-1px;}
    .mode-tab:hover{color:var(--ink);}
    .mode-tab.active{color:var(--violet);border-bottom-color:var(--violet);}
    .mode-tab .tab-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.875rem;}
    .mode-tab.active .tab-icon{background:rgba(124,58,237,.1);}
    .pesquisa-area{flex:1;overflow-y:auto;padding:24px 28px;}
    .search-bar-wrap{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s;margin-bottom:20px;}
    .search-bar-wrap:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.1);}
    .search-bar-wrap input{flex:1;border:none;background:none;font-family:var(--font-body);font-size:1rem;color:var(--ink);outline:none;}
    .search-bar-wrap input::placeholder{color:var(--muted);}
    .search-btn{background:var(--grad);color:white;padding:8px 18px;border-radius:9px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;white-space:nowrap;}
    .filter-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:.8125rem;color:var(--ink-2);cursor:pointer;background:var(--paper);transition:all .2s;}
    .filter-btn:hover,.filter-btn.active{border-color:var(--violet);color:var(--violet);background:rgba(124,58,237,.05);}
    .article-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .2s;}
    .article-card:hover{border-color:var(--violet);}
    .article-card .art-title{font-size:.9375rem;font-weight:600;margin-bottom:6px;}
    .article-card .art-authors{font-size:.8125rem;color:var(--muted);margin-bottom:6px;}
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
    .msg{display:flex;gap:12px;align-items:flex-start;max-width:820px;}
    .msg.user{flex-direction:row-reverse;align-self:flex-end;}
    .msg .bubble{padding:12px 16px;border-radius:14px;font-size:.9375rem;line-height:1.55;}
    .msg.ai .bubble{background:var(--paper);border:1px solid var(--line);}
    .msg.user .bubble{background:var(--grad);color:white;}
    .chat-inputbar{border-top:1px solid var(--line);padding:14px 20px;background:var(--paper);}
    .chat-input-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--bg-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;}
    .chat-input-wrap textarea{flex:1;border:none;background:none;resize:none;font-family:var(--font-body);font-size:.9375rem;color:var(--ink);outline:none;max-height:120px;}
    .send-btn{width:34px;height:34px;border-radius:8px;background:var(--grad);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;}
  </style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const CONVERSATIONS = [
  { id:1, icon:"🔍", title:"Impacto redes sociais", date:"hoje", mode:"pesquisa", active:true },
  { id:2, icon:"🎓", title:"Metodologia survey", date:"hoje", mode:"orientador" },
  { id:3, icon:"🔍", title:"Framework análise correlação", date:"ontem", mode:"pesquisa" },
];

const SAMPLE_RESULTS = [
  { title:"Social Media Use and Academic Performance", authors:"Johnson, M., Silva, R.", year:2024, source:"Scopus", cites:142 },
  { title:"Redes Sociais e Desempenho Acadêmico", authors:"Ferreira, L., Nunes, B.", year:2023, source:"SciELO", cites:87 },
];

function PesquisaMode() {
  const [query, setQuery] = useState("impacto redes sociais desempenho acadêmico");
  const [searched, setSearched] = useState(true);

  return (
    <div className="pesquisa-area">
      <div className="search-bar-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{color:"var(--muted)",flexShrink:0}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar artigos acadêmicos…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <button className="search-btn" onClick={() => setSearched(true)}>Buscar →</button>
      </div>

      <div style={{background:"var(--paper)",border:"1px solid var(--line)",borderRadius:12,padding:"14px 16px",marginBottom:20}}>
        <div className="mono-label" style={{marginBottom:8}}>Filtrar por</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {["Google Scholar","SciELO","Scopus","CAPES"].map(b => (
            <button key={b} className="filter-btn active">● {b}</button>
          ))}
        </div>
      </div>

      {searched && (
        <>
          <div style={{marginBottom:14}}>
            <span style={{fontWeight:600}}>{SAMPLE_RESULTS.length} resultados</span>
            <span style={{fontFamily:"var(--font-mono)",fontSize:".75rem",color:"var(--muted)",marginLeft:8}}>para "{query}"</span>
          </div>
          {SAMPLE_RESULTS.map((art,i) => (
            <div key={i} className="article-card">
              <div className="art-title">{art.title}</div>
              <div className="art-authors">{art.authors} · {art.year}</div>
              <div style={{display:"flex",gap:10,marginTop:10}}>
                <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{art.cites} citações</span>
                <button className="btn btn-ghost btn-sm">Citar ABNT</button>
                <button className="btn btn-violet btn-sm">Ver artigo →</button>
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function OrientadorMode() {
  const [msgs, setMsgs] = useState([{ role:"ai", text:"Olá! Sou seu Orientador Virtual. Posso ajudar com estruturação, revisão e preparação para a qualificação." }]);
  const [input, setInput] = useState("");
  const bottomRef = useRef(null);
  useEffect(() => { if(bottomRef.current) bottomRef.current.scrollTop = bottomRef.current.scrollHeight; }, [msgs]);

  function send() {
    if (!input.trim()) return;
    setMsgs(prev=>[...prev,{role:"user",text:input}]);
    setInput("");
    setTimeout(() => setMsgs(prev=>[...prev,{role:"ai",text:"Entendi sua dúvida. Para seu TCC sobre redes sociais, recomendo aprofundar a metodologia antes da coleta de dados."}]), 500);
  }

  return (
    <div className="chat-area">
      <div className="chat-messages" ref={bottomRef}>
        {msgs.map((m,i)=>(
          <div key={i} className={`msg ${m.role}`}>
            {m.role==="ai" && <div className="av av-sm c1" style={{background:"var(--grad)",flexShrink:0,fontWeight:700}}>OV</div>}
            <div className="bubble">{m.text}</div>
            {m.role==="user" && <div className="av av-sm c1" style={{flexShrink:0}}>PG</div>}
          </div>
        ))}
      </div>
      <div className="chat-inputbar">
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {["Revisar meu texto","Estruturar argumento","Preparar para banca"].map(s=>(
            <button key={s} className="btn btn-ghost btn-sm" style={{fontSize:".75rem"}} onClick={()=>setInput(s)}>{s}</button>
          ))}
        </div>
        <div className="chat-input-wrap">
          <textarea rows={1} placeholder="Converse com seu orientador virtual…" value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
          <button className="send-btn" onClick={send}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

function AIPage() {
  const [mode, setMode] = useState("pesquisa");
  const [activeConv, setActiveConv] = useState(1);

  const today = CONVERSATIONS.filter(c=>c.date==="hoje");
  const recent = CONVERSATIONS.filter(c=>c.date!=="hoje");

  return (
    <div className="app-layout">
      <Sidebar active="ai"/>
      <div className="main-area" style={{overflow:"hidden"}}>
        <Topbar page="I.A."/>
        <div className="ai-root">
          <div className="conv-sidebar">
            <div className="conv-sidebar-head">
              <button className="btn btn-violet" style={{width:"100%",justifyContent:"center",fontSize:".8125rem"}}>+ Nova conversa</button>
            </div>
            <div className="conv-list">
              <div className="conv-section-label">Hoje</div>
              {today.map(c=>(
                <div key={c.id} className={`conv-item ${activeConv===c.id?"active":""}`} onClick={()=>{ setActiveConv(c.id); setMode(c.mode); }}>
                  <div className="ci-icon">{c.icon}</div>
                  <div className="ci-body">
                    <div className="ci-title">{c.title}</div>
                    <div className="ci-meta">{c.mode==="pesquisa"?"Pesquisa":"Orientador"}</div>
                  </div>
                </div>
              ))}
              <div className="conv-section-label">Anteriores</div>
              {recent.map(c=>(
                <div key={c.id} className={`conv-item ${activeConv===c.id?"active":""}`} onClick={()=>{ setActiveConv(c.id); setMode(c.mode); }}>
                  <div className="ci-icon">{c.icon}</div>
                  <div className="ci-body">
                    <div className="ci-title">{c.title}</div>
                    <div className="ci-meta">{c.date}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="ai-main">
            <div className="mode-tabs">
              <div className={`mode-tab ${mode==="orientador"?"active":""}`} onClick={()=>setMode("orientador")}>
                <span className="tab-icon">🎓</span>Orientador Virtual
              </div>
              <div className={`mode-tab ${mode==="pesquisa"?"active":""}`} onClick={()=>setMode("pesquisa")}>
                <span className="tab-icon">🔍</span>Pesquisa Acadêmica
              </div>
            </div>
            {mode==="pesquisa" ? <PesquisaMode/> : <OrientadorMode/>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AIPage/>);
</script>
</body>
</html>
