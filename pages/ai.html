<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>I.A. — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .ai-root{display:flex;height:100%;overflow:hidden;}
    .conv-sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);overflow:hidden;}
    .conv-sidebar-head{padding:14px 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
    .conv-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none;}
    .conv-list::-webkit-scrollbar{display:none;}
    .ai-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
    .mode-tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);background:var(--paper);}
    .mode-tab{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:.875rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s;margin-bottom:-1px;}
    .mode-tab:hover{color:var(--ink);}
    .mode-tab.active{color:var(--violet);border-bottom-color:var(--violet);}
    .pesquisa-area{flex:1;overflow-y:auto;padding:24px 28px;}
    .search-bar-wrap{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:20px;}
    .search-bar-wrap:focus-within{border-color:var(--violet);}
    .search-bar-wrap input{flex:1;border:none;background:none;font-family:var(--font-body);font-size:1rem;color:var(--ink);outline:none;}
    .search-btn{background:var(--grad);color:white;padding:8px 18px;border-radius:9px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;}
    .filter-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:.8125rem;cursor:pointer;background:var(--paper);}
    .filter-btn.active{border-color:var(--violet);color:var(--violet);}
    .article-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .2s;}
    .article-card:hover{border-color:var(--violet);}
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
    .msg{display:flex;gap:12px;align-items:flex-start;max-width:820px;}
    .msg.user{flex-direction:row-reverse;align-self:flex-end;}
    .msg .bubble{padding:12px 16px;border-radius:14px;font-size:.9375rem;line-height:1.55;}
    .msg.ai .bubble{background:var(--paper);border:1px solid var(--line);}
    .msg.user .bubble{background:var(--grad);color:white;}
    .chat-inputbar{border-top:1px solid var(--line);padding:14px 20px;background:var(--paper);}
    .chat-input-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--bg-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;}
    .chat-input-wrap textarea{flex:1;border:none;background:none;resize:none;font-family:var(--font-body);font-size:.9375rem;color:var(--ink);outline:none;max-height:120px;}
    .send-btn{width:34px;height:34px;border-radius:8px;background:var(--grad);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

function PesquisaMode({ project }) {
  const [query, setQuery] = useState("");
  const [savedPapers, setSavedPapers] = useState([]);
  const [usage, setUsage] = useState(null);

  useEffect(() => {
    if (!project) return;
    (async () => {
      const papers = await DB.savedPapers.getAll(project.id);
      setSavedPapers(papers);
      const u = await DB.aiUsage.canSearch(project.id);
      setUsage(u);
    })();
  }, [project]);

  async function savePaper(paper) {
    const exists = await DB.savedPapers.exists(project.id, paper.title);
    if (exists) { alert('Artigo já salvo!'); return; }
    await DB.savedPapers.add(project.id, paper);
    const papers = await DB.savedPapers.getAll(project.id);
    setSavedPapers(papers);
  }

  async function removePaper(id) {
    await DB.savedPapers.remove(id);
    setSavedPapers(prev => prev.filter(p => p.id !== id));
  }

  return (
    <div className="pesquisa-area">
      <div className="mono-label" style={{marginBottom:10}}>Pesquisa Acadêmica</div>
      {usage && (
        <div style={{fontFamily:"var(--font-mono)",fontSize:".75rem",color:"var(--muted)",marginBottom:16}}>
          {usage.remaining}/{usage.limit} buscas restantes este mês
        </div>
      )}
      <div className="search-bar-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{color:"var(--muted)",flexShrink:0}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar artigos acadêmicos…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <button className="search-btn">Buscar →</button>
      </div>

      <div style={{marginBottom:20}}>
        <div className="mono-label" style={{marginBottom:8}}>Artigos salvos ({savedPapers.length})</div>
        {savedPapers.length === 0 && <div style={{color:"var(--muted)",fontSize:".875rem"}}>Nenhum artigo salvo ainda</div>}
        {savedPapers.map(p => (
          <div key={p.id} className="article-card">
            <div style={{fontWeight:600,fontSize:".9375rem",marginBottom:4}}>{p.title}</div>
            <div style={{fontSize:".8125rem",color:"var(--muted)",marginBottom:4}}>{p.authors} · {p.year}</div>
            {p.abstract && <div style={{fontSize:".8125rem",color:"var(--ink-2)",lineHeight:1.5,marginBottom:8}}>{p.abstract}</div>}
            <div style={{display:"flex",gap:8}}>
              {p.source && <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{p.source}</span>}
              {p.citations > 0 && <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{p.citations} citações</span>}
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={() => removePaper(p.id)}>Remover</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OrientadorMode() {
  const [msgs, setMsgs] = useState([{ role:"ai", text:"Olá! Sou seu Orientador Virtual. Posso ajudar com estruturação, revisão e preparação para a qualificação." }]);
  const [input, setInput] = useState("");
  const bottomRef = useRef(null);
  useEffect(() => { if(bottomRef.current) bottomRef.current.scrollTop = bottomRef.current.scrollHeight; }, [msgs]);

  function send() {
    if (!input.trim()) return;
    setMsgs(prev=>[...prev,{role:"user",text:input}]);
    setInput("");
    setTimeout(() => setMsgs(prev=>[...prev,{role:"ai",text:"Esta funcionalidade requer integração com a API de IA. Configure sua chave para começar a usar o orientador virtual."}]), 500);
  }

  return (
    <div className="chat-area">
      <div className="chat-messages" ref={bottomRef}>
        {msgs.map((m,i)=>(
          <div key={i} className={`msg ${m.role}`}>
            {m.role==="ai" && <div className="av av-sm c1" style={{background:"var(--grad)",flexShrink:0,fontWeight:700}}>OV</div>}
            <div className="bubble">{m.text}</div>
            {m.role==="user" && <div className="av av-sm c1" style={{flexShrink:0}}>PG</div>}
          </div>
        ))}
      </div>
      <div className="chat-inputbar">
        <div className="chat-input-wrap">
          <textarea rows={1} placeholder="Converse com seu orientador virtual…" value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
          <button className="send-btn" onClick={send}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

function AIPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [mode, setMode] = useState("pesquisa");

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  return (
    <div className="app-layout">
      <Sidebar active="ai" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area" style={{overflow:"hidden"}}>
        <Topbar page="I.A." user={user}/>
        <div className="ai-root">
          <div className="ai-main">
            <div className="mode-tabs">
              <div className={`mode-tab ${mode==="orientador"?"active":""}`} onClick={()=>setMode("orientador")}>🎓 Orientador Virtual</div>
              <div className={`mode-tab ${mode==="pesquisa"?"active":""}`} onClick={()=>setMode("pesquisa")}>🔍 Pesquisa Acadêmica</div>
            </div>
            {mode==="pesquisa" ? <PesquisaMode project={project}/> : <OrientadorMode/>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AIPage/>);
</script>
</body>
</html>
