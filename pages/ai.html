<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>I.A. — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .ai-root{display:flex;height:100%;overflow:hidden;}
    .conv-sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);overflow:hidden;}
    .conv-sidebar-head{padding:14px 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
    .conv-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none;}
    .conv-list::-webkit-scrollbar{display:none;}
    .conv-item{padding:10px 12px;border-radius:9px;cursor:pointer;transition:background .15s;margin-bottom:4px;font-size:.8125rem;}
    .conv-item:hover{background:var(--bg-2);}
    .conv-item.active{background:rgba(124,58,237,.08);color:var(--violet);font-weight:500;}
    .conv-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8125rem;margin-bottom:2px;}
    .conv-date{font-family:var(--font-mono);font-size:.625rem;color:var(--muted);}
    .ai-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
    .mode-tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);background:var(--paper);}
    .mode-tab{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:.875rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s;margin-bottom:-1px;}
    .mode-tab:hover{color:var(--ink);}
    .mode-tab.active{color:var(--violet);border-bottom-color:var(--violet);}
    .pesquisa-area{flex:1;overflow-y:auto;padding:24px 28px;}
    .search-bar-wrap{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;}
    .search-bar-wrap:focus-within{border-color:var(--violet);}
    .search-bar-wrap input{flex:1;border:none;background:none;font-family:var(--font-body);font-size:1rem;color:var(--ink);outline:none;}
    .search-btn{background:var(--grad);color:white;padding:8px 18px;border-radius:9px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;}
    .filter-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:.8125rem;cursor:pointer;background:var(--paper);transition:border-color .15s,color .15s;}
    .filter-btn:hover{border-color:var(--violet);}
    .filter-btn.active{border-color:var(--violet);color:var(--violet);background:rgba(124,58,237,.06);}
    .article-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .2s;}
    .article-card:hover{border-color:var(--violet);}
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
    .msg{display:flex;gap:12px;align-items:flex-start;max-width:820px;}
    .msg.user{flex-direction:row-reverse;align-self:flex-end;}
    .msg .bubble{padding:12px 16px;border-radius:14px;font-size:.9375rem;line-height:1.55;}
    .msg.ai .bubble{background:var(--paper);border:1px solid var(--line);}
    .msg.user .bubble{background:var(--grad);color:white;}
    .chat-inputbar{border-top:1px solid var(--line);padding:14px 20px;background:var(--paper);}
    .chat-input-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--bg-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;}
    .chat-input-wrap textarea{flex:1;border:none;background:none;resize:none;font-family:var(--font-body);font-size:.9375rem;color:var(--ink);outline:none;max-height:120px;}
    .send-btn{width:34px;height:34px;border-radius:8px;background:var(--grad);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;}
    .year-select{padding:5px 10px;border-radius:7px;border:1.5px solid var(--line);font-size:.8125rem;background:var(--paper);color:var(--ink);font-family:var(--font-body);cursor:pointer;}
    .year-select:focus{border-color:var(--violet);outline:none;}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SOURCES = [
  { id:"all", label:"Todas as fontes" },
  { id:"scholar", label:"Google Scholar" },
  { id:"scielo", label:"SciELO" },
  { id:"pubmed", label:"PubMed" },
  { id:"ieee", label:"IEEE" },
];

const TYPES = [
  { id:"all", label:"Todos" },
  { id:"article", label:"Artigos" },
  { id:"thesis", label:"Teses" },
  { id:"book", label:"Livros" },
  { id:"conference", label:"Conferências" },
];

function PesquisaMode({ project, user }) {
  const [query, setQuery] = useState("");
  const [savedPapers, setSavedPapers] = useState([]);
  const [usage, setUsage] = useState(null);
  const [sourceFilter, setSourceFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("all");
  const [yearFrom, setYearFrom] = useState("");
  const [yearTo, setYearTo] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [viewSaved, setViewSaved] = useState(true);

  useEffect(() => {
    if (!project) return;
    (async () => {
      const papers = await DB.savedPapers.getAll(project.id);
      setSavedPapers(papers);
      const u = await DB.aiUsage.canSearch(project.id);
      setUsage(u);
    })();
  }, [project]);

  async function savePaper(paper) {
    const exists = await DB.savedPapers.exists(project.id, paper.title);
    if (exists) { alert('Artigo já salvo!'); return; }
    await DB.savedPapers.add(project.id, paper);
    const papers = await DB.savedPapers.getAll(project.id);
    setSavedPapers(papers);
  }

  async function removePaper(id) {
    await DB.savedPapers.remove(id);
    setSavedPapers(prev => prev.filter(p => p.id !== id));
  }

  const currentYear = new Date().getFullYear();
  const years = Array.from({length: 30}, (_, i) => currentYear - i);

  return (
    <div className="pesquisa-area">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <div className="mono-label">Pesquisa Acadêmica</div>
        {usage && (
          <div style={{fontFamily:"var(--font-mono)",fontSize:".75rem",color:"var(--muted)"}}>
            {usage.remaining}/{usage.limit} buscas restantes
          </div>
        )}
      </div>

      <div className="search-bar-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{color:"var(--muted)",flexShrink:0}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar artigos acadêmicos…" value={query} onChange={e=>setQuery(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') { /* future: trigger search */ } }}/>
        <button className="search-btn">Buscar →</button>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <button className={`filter-btn ${showFilters?"active":""}`} onClick={() => setShowFilters(!showFilters)}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros
        </button>
        {SOURCES.filter(s => s.id !== "all").map(s => (
          <button key={s.id} className={`filter-btn ${sourceFilter===s.id?"active":""}`}
            onClick={() => setSourceFilter(sourceFilter===s.id?"all":s.id)}>{s.label}</button>
        ))}
      </div>

      {showFilters && (
        <div className="card" style={{marginBottom:16,padding:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
            <div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",textTransform:"uppercase",letterSpacing:".1em",color:"var(--muted)",marginBottom:6}}>Tipo de publicação</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {TYPES.map(t => (
                  <button key={t.id} className={`filter-btn ${typeFilter===t.id?"active":""}`}
                    onClick={() => setTypeFilter(t.id)} style={{fontSize:".75rem",padding:"4px 10px"}}>{t.label}</button>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",textTransform:"uppercase",letterSpacing:".1em",color:"var(--muted)",marginBottom:6}}>Ano de publicação</div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <select className="year-select" value={yearFrom} onChange={e=>setYearFrom(e.target.value)}>
                  <option value="">De</option>
                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
                <span style={{color:"var(--muted)"}}>—</span>
                <select className="year-select" value={yearTo} onChange={e=>setYearTo(e.target.value)}>
                  <option value="">Até</option>
                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",textTransform:"uppercase",letterSpacing:".1em",color:"var(--muted)",marginBottom:6}}>Ordenar por</div>
              <select className="year-select" style={{width:"100%"}}>
                <option>Relevância</option>
                <option>Mais recente</option>
                <option>Mais citado</option>
              </select>
            </div>
          </div>
        </div>
      )}

      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div className="mono-label">Artigos salvos ({savedPapers.length})</div>
        </div>
        {savedPapers.length === 0 && <div style={{color:"var(--muted)",fontSize:".875rem",padding:16,textAlign:"center",background:"var(--bg-2)",borderRadius:12,border:"1px dashed var(--line)"}}>Nenhum artigo salvo ainda. Faça uma busca para encontrar artigos.</div>}
        {savedPapers.map(p => (
          <div key={p.id} className="article-card">
            <div style={{fontWeight:600,fontSize:".9375rem",marginBottom:4}}>{p.title}</div>
            <div style={{fontSize:".8125rem",color:"var(--muted)",marginBottom:4}}>{p.authors} · {p.year}</div>
            {p.abstract && <div style={{fontSize:".8125rem",color:"var(--ink-2)",lineHeight:1.5,marginBottom:8}}>{p.abstract}</div>}
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {p.source && <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)",background:"var(--bg-2)",padding:"2px 8px",borderRadius:4}}>{p.source}</span>}
              {p.citations > 0 && <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{p.citations} citações</span>}
              {p.url && <a href={p.url} target="_blank" className="btn btn-ghost btn-sm" style={{marginLeft:"auto",fontSize:".6875rem"}}>Abrir</a>}
              <button className="btn btn-ghost btn-sm" style={{color:"var(--rose)",fontSize:".6875rem"}} onClick={() => removePaper(p.id)}>Remover</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OrientadorMode({ project, user, userData, conversations, activeConv, setActiveConv, onNewConv }) {
  const [msgs, setMsgs] = useState([{ role:"ai", text:"Olá! Sou seu Orientador Virtual. Posso ajudar com estruturação, revisão e preparação para a qualificação. Como posso ajudar?" }]);
  const [input, setInput] = useState("");
  const bottomRef = useRef(null);
  useEffect(() => { if(bottomRef.current) bottomRef.current.scrollTop = bottomRef.current.scrollHeight; }, [msgs]);

  function send() {
    if (!input.trim()) return;
    setMsgs(prev=>[...prev,{role:"user",text:input}]);
    setInput("");
    setTimeout(() => setMsgs(prev=>[...prev,{role:"ai",text:"Esta funcionalidade requer integração com a API de IA. Quando configurada, poderei ajudar com estruturação do TCC, revisão de texto, sugestões de referências e preparação para qualificação."}]), 500);
  }

  const userInitials = getInitials(userData?.name || 'U');

  return (
    <div className="chat-area">
      <div className="chat-messages" ref={bottomRef}>
        {msgs.map((m,i)=>(
          <div key={i} className={`msg ${m.role}`}>
            {m.role==="ai" && <div className="av av-sm c1" style={{background:"var(--grad)",flexShrink:0,fontWeight:700,color:"white"}}>OV</div>}
            <div className="bubble">{m.text}</div>
            {m.role==="user" && <div className="av av-sm c1" style={{flexShrink:0}}>{userInitials}</div>}
          </div>
        ))}
      </div>
      <div className="chat-inputbar">
        <div className="chat-input-wrap">
          <textarea rows={1} placeholder="Converse com seu orientador virtual…" value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
          <button className="send-btn" onClick={send}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

function AIPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [mode, setMode] = useState("pesquisa");
  const [conversations, setConversations] = useState([
    { id: 1, title: "Nova conversa", date: new Date().toLocaleDateString('pt-BR'), active: true }
  ]);
  const [activeConv, setActiveConv] = useState(1);

  function createNewConv() {
    const newId = Date.now();
    const newConv = { id: newId, title: "Nova conversa", date: new Date().toLocaleDateString('pt-BR'), active: true };
    setConversations(prev => prev.map(c => ({...c, active: false})).concat([newConv]));
    setActiveConv(newId);
  }

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  return (
    <div className="app-layout">
      <Sidebar active="ai" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area" style={{overflow:"hidden"}}>
        <Topbar page="I.A." user={user}/>
        <div className="ai-root">
          {mode === "orientador" && (
            <div className="conv-sidebar">
              <div className="conv-sidebar-head">
                <button className="btn btn-violet btn-sm" style={{width:"100%"}} onClick={createNewConv}>
                  + Nova conversa
                </button>
              </div>
              <div className="conv-list">
                {conversations.map(c => (
                  <div key={c.id} className={`conv-item ${activeConv===c.id?"active":""}`} onClick={() => setActiveConv(c.id)}>
                    <div className="conv-title">{c.title}</div>
                    <div className="conv-date">{c.date}</div>
                  </div>
                ))}
              </div>
              <div style={{padding:"10px 12px",borderTop:"1px solid var(--line)",fontSize:".6875rem",color:"var(--muted)",fontFamily:"var(--font-mono)",textAlign:"center"}}>
                Histórico de conversas
              </div>
            </div>
          )}

          <div className="ai-main">
            <div className="mode-tabs">
              <div className={`mode-tab ${mode==="orientador"?"active":""}`} onClick={()=>setMode("orientador")}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5"/></svg>
                Orientador Virtual
              </div>
              <div className={`mode-tab ${mode==="pesquisa"?"active":""}`} onClick={()=>setMode("pesquisa")}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Pesquisa Acadêmica
              </div>
            </div>
            {mode==="pesquisa"
              ? <PesquisaMode project={project} user={user}/>
              : <OrientadorMode project={project} user={user} userData={userData}
                  conversations={conversations} activeConv={activeConv} setActiveConv={setActiveConv} onNewConv={createNewConv}/>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AIPage/>);
</script>
</body>
</html>
