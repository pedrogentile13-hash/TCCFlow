<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function PriorityDot({ p }) {
  const colors = { alta:"var(--rose)", média:"var(--amber)", baixa:"var(--emerald)" };
  return <span style={{width:7,height:7,borderRadius:"50%",background:colors[p]||"var(--muted)",display:"inline-block",flexShrink:0}}></span>;
}

function Dashboard() {
  const { user, userData, project, subscription, teamMembers, loading } = useTCCData();
  const [tasks, setTasks] = useState([]);
  const [shown, setShown] = useState(false);
  const [orientador, setOrientador] = useState(null);

  useEffect(() => {
    if (!project) return;
    (async () => {
      try {
        const { data } = await _supa.from('tasks').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
        setTasks(data || []);

        const oriData = await DB.orientador.getProjectOrientador(project.id);
        console.log("Dashboard orientador loaded:", oriData);
        if (oriData) {
          const userData = oriData.users || oriData;
          if (userData && userData.id) {
            setOrientador(userData);
          }
        }
      } catch(e) { console.error(e); }
    })();
  }, [project]);

  useEffect(() => { if (!loading) setTimeout(() => setShown(true), 50); }, [loading]);

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  const userName = userData?.name || user?.displayName || 'Usuário';
  const firstName = userName.split(' ')[0];
  const myTasks = tasks.filter(t => t.assigned_to === user?.uid || (t.assigned_to_list && t.assigned_to_list.includes(user?.uid)));
  const todayTasks = myTasks.filter(t => t.status !== 'done');
  const doneTasks = tasks.filter(t => t.status === 'done');
  const totalTasks = tasks.length;
  const progress = totalTasks > 0 ? Math.round(doneTasks.length / totalTasks * 100) : 0;

  async function toggleTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const newStatus = task.status === 'done' ? 'todo' : 'done';
    await _supa.from('tasks').update({ status: newStatus }).eq('id', taskId);
    setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
  }

  const statusLabel = (s) => s === 'todo' ? 'A fazer' : s === 'progress' ? 'Em andamento' : 'Concluída';

  return (
    <div className="app-layout">
      <Sidebar active="dashboard" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Dashboard" user={user}/>
        <div className="page-content">

          <div className={`reveal ${shown?"in":""}`} style={{marginBottom:28}}>
            <div style={{background:"var(--grad)",borderRadius:16,padding:"24px 28px",color:"white",position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",right:-40,top:-40,width:220,height:220,borderRadius:"50%",background:"rgba(255,255,255,.08)"}}></div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:"0.6875rem",textTransform:"uppercase",letterSpacing:"0.12em",opacity:.8,marginBottom:6}}>Bem-vindo de volta 👋</div>
              <h2 style={{fontFamily:"var(--font-display)",fontSize:"1.75rem",fontWeight:400,margin:"0 0 4px",letterSpacing:"-0.02em"}}>Bom dia, <em>{firstName}!</em></h2>
              {project && <p style={{margin:0,opacity:.85,fontSize:"0.9375rem"}}>{project.name}</p>}
              {project?.code && (
                <div style={{display:"flex",alignItems:"center",gap:16,marginTop:16}}>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:"0.75rem",opacity:.8}}>Código de entrada:</div>
                  <div style={{background:"rgba(255,255,255,.2)",padding:"4px 12px",borderRadius:6,fontFamily:"var(--font-mono)",fontSize:"0.875rem",fontWeight:600,letterSpacing:"0.08em"}}>{project.code}</div>
                </div>
              )}
            </div>
          </div>

          <div className={`stat-grid reveal ${shown?"in":""} d1`}>
            <div className="stat-card">
              <div className="stat-label">Membros</div>
              <div className="stat-value">{teamMembers.length}</div>
              <div className="stat-sub">de {subscription?.seats || 1} no plano</div>
              <div className="stat-icon">👥</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Minhas Tarefas</div>
              <div className="stat-value">{todayTasks.length}</div>
              <div className="stat-sub">pendentes</div>
              <div className="stat-icon">📋</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Concluídas</div>
              <div className="stat-value">{doneTasks.length}</div>
              <div className="stat-sub">de {totalTasks} total</div>
              <div className="stat-icon">✅</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Progresso</div>
              <div className="stat-value">{progress}%</div>
              <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}></div></div>
              <div className="stat-icon">📈</div>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:16}} className={`page-grid reveal ${shown?"in":""} d2`}>
            <div className="card">
              <div className="card-title" style={{justifyContent:"space-between"}}>
                <span style={{display:"flex",alignItems:"center",gap:8}}>
                  <span className="ct-icon">📋</span> Minhas Tarefas
                </span>
                <a href="tasks.html" className="btn btn-ghost btn-sm">Ver todas</a>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {todayTasks.length === 0 && <div style={{color:"var(--muted)",fontSize:"0.875rem",padding:12}}>Nenhuma tarefa pendente</div>}
                {todayTasks.slice(0,5).map(t => (
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:10,background:"var(--bg-2)",border:"1px solid var(--line)"}}>
                    <PriorityDot p={t.due_date && new Date(t.due_date) < new Date() ? "alta" : "média"}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"0.875rem",fontWeight:500,marginBottom:2}}>{t.title}</div>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        <span className="tag tag-cyan">{statusLabel(t.status)}</span>
                        {t.due_date && <span style={{fontFamily:"var(--font-mono)",fontSize:"0.6875rem",color:"var(--muted)"}}>Vence {new Date(t.due_date).toLocaleDateString('pt-BR')}</span>}
                      </div>
                    </div>
                    <button onClick={() => toggleTask(t.id)} style={{width:22,height:22,borderRadius:6,border:"1.5px solid var(--line)",background:"var(--paper)",cursor:"pointer",flexShrink:0,transition:"all .2s"}}
                      onMouseEnter={e=>{e.currentTarget.style.background="var(--emerald)";e.currentTarget.style.borderColor="var(--emerald)"}}
                      onMouseLeave={e=>{e.currentTarget.style.background="var(--paper)";e.currentTarget.style.borderColor="var(--line)"}}></button>
                  </div>
                ))}
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {orientador && (
                <div className="card" style={{borderColor:"var(--emerald)",background:"linear-gradient(135deg,rgba(16,185,129,.04),rgba(6,182,212,.04))"}}>
                  <div className="card-title" style={{justifyContent:"space-between"}}>
                    <span style={{display:"flex",alignItems:"center",gap:8}}>
                      <span className="ct-icon">🎓</span> Orientador
                    </span>
                    <a href="orientador-feedback.html" className="btn btn-ghost btn-sm">Ver detalhes</a>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div className="av av-sm c1" style={{background:"var(--emerald)"}}>{getInitials(orientador.name)}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"0.8125rem",fontWeight:600,color:"var(--ink)"}}>{orientador.name || 'Orientador'}</div>
                      <div style={{fontFamily:"var(--font-mono)",fontSize:"0.625rem",color:"var(--muted)"}}>{orientador.email}</div>
                    </div>
                  </div>
                </div>
              )}
              <div className="card">
                <div className="card-title" style={{justifyContent:"space-between"}}>
                  <span style={{display:"flex",alignItems:"center",gap:8}}>
                    <span className="ct-icon">👥</span> Equipe
                  </span>
                  <a href="team.html" className="btn btn-ghost btn-sm">Gerenciar</a>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {teamMembers.filter(m => m.role !== 'orientador').map((m, i) => (
                    <div key={m.id} style={{display:"flex",alignItems:"center",gap:10}}>
                      <div className={`av av-sm c${(i%4)+1}`}>{getInitials(m.name)}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:"0.8125rem",fontWeight:500}}>{m.name || m.email}</div>
                        <div style={{fontFamily:"var(--font-mono)",fontSize:"0.625rem",color:"var(--muted)"}}>Estudante</div>
                      </div>
                    </div>
                  ))}
                  {teamMembers.filter(m => m.role !== 'orientador').length === 0 && <div style={{color:"var(--muted)",fontSize:"0.8125rem"}}>Nenhum membro ainda</div>}
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard/>);
</script>
</body>
</html>
