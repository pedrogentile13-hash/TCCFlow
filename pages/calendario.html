<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .liquid-bg .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
        .blob-1 { width: 500px; height: 500px; background: rgba(139,92,246,0.12); top: -100px; right: -100px; animation: drift1 25s infinite ease-in-out; }
        .blob-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.10); bottom: -80px; left: -80px; animation: drift2 30s infinite ease-in-out; }
        .blob-3 { width: 300px; height: 300px; background: rgba(16,185,129,0.08); top: 50%; left: 50%; animation: drift3 20s infinite ease-in-out; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-150px,100px) scale(1.1)} 66%{transform:translate(80px,-60px) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(120px,-80px) scale(0.95)} 66%{transform:translate(-60px,60px) scale(1.1)} }
        @keyframes drift3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 33%{transform:translate(-40%,-60%) scale(1.15)} 66%{transform:translate(-60%,-40%) scale(0.9)} }
        .calendar-day:hover { background: rgba(139,92,246,0.05); }
        .calendar-day.today { border: 2px solid #8b5cf6; }
        .calendar-day.has-session { position: relative; }
        .calendar-day.has-session::after {
            content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; border-radius: 50%; background: #8b5cf6;
        }
        .calendar-day.has-completed::after { background: #10b981; }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased">

    <!-- Liquid Grass Background -->
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <a href="dashboard.html" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-900">TCC<span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-cyan-500">Flow</span></span>
                </a>
                <div class="hidden lg:flex items-center bg-slate-100 rounded-full p-1">
                    <a href="dashboard.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">Dashboard</a>
                    <a href="projeto.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">Projeto</a>
                    <a href="organizacao.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">Tarefas</a>
                    <a href="ia.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">I.A.</a>
                    <a href="calendario.html" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-violet-600 shadow-sm">Calendário</a>
                    <a href="equipe.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">Equipe</a>
                    <a href="google.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-white/50 transition">Google</a>
                </div>
                <div class="flex items-center gap-2">
                    <span class="hidden sm:block text-sm text-slate-500" id="userName"></span>
                    <a href="admin.html" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                        <i class="fa-solid fa-gear text-sm"></i>
                    </a>
                    <button id="logoutBtn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 transition">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                    <button id="mobileNavBtn" class="lg:hidden w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                        <i class="fa-solid fa-bars text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobileNav" class="hidden lg:hidden px-4 pb-3 space-y-1 border-t border-slate-100">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">Dashboard</a>
            <a href="projeto.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">Projeto</a>
            <a href="organizacao.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">Tarefas</a>
            <a href="ia.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">I.A.</a>
            <a href="calendario.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-violet-600 bg-violet-50">Calendário</a>
            <a href="equipe.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">Equipe</a>
            <a href="google.html" class="block px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-violet-50 hover:text-violet-600">Google</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 pt-16 min-h-screen pb-12">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <div class="mb-8">
                <h1 class="text-3xl font-bold">Calendário</h1>
                <p class="text-slate-500 mt-1">Visualize e organize as suas metas de estudo</p>
            </div>

            <!-- Calendar Navigation -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-6 shadow-sm">
                <div class="flex items-center justify-between mb-6">
                    <button id="prevMonth" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center hover:bg-slate-200 transition">
                        <i class="fa-solid fa-chevron-left text-sm text-slate-600"></i>
                    </button>
                    <h2 id="monthTitle" class="text-xl font-bold"></h2>
                    <button id="nextMonth" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center hover:bg-slate-200 transition">
                        <i class="fa-solid fa-chevron-right text-sm text-slate-600"></i>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-1 mb-2">
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Dom</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Seg</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Ter</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Qua</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Qui</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Sex</div>
                    <div class="text-center text-xs font-semibold text-slate-400 py-2">Sáb</div>
                </div>

                <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
            </div>

            <!-- Goals Section -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold">
                        <i class="fa-solid fa-bullseye mr-2 text-emerald-600"></i>Metas
                    </h2>
                    <button id="addGoalBtn" class="bg-gradient-to-r from-violet-600 to-cyan-500 hover:shadow-lg hover:shadow-violet-500/25 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
                        <i class="fa-solid fa-plus mr-1"></i> Nova Meta
                    </button>
                </div>

                <div id="goalForm" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Meta</label>
                            <input type="text" id="goalTitle" placeholder="Ex: Terminar capítulo 5"
                                class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Prazo</label>
                            <input type="date" id="goalDeadline"
                                class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button id="saveGoal" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
                            <i class="fa-solid fa-check mr-1"></i> Salvar
                        </button>
                        <button id="cancelGoal" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-4 py-2 rounded-xl transition">
                            Cancelar
                        </button>
                    </div>
                </div>

                <div id="goalsList" class="space-y-3">
                    <div class="text-center py-6 text-slate-400">
                        <i class="fa-solid fa-flag text-2xl mb-2 block"></i>
                        <p class="text-sm">Nenhuma meta definida.</p>
                    </div>
                </div>
            </div>

            <!-- Day sessions panel -->
            <div id="dayPanel" class="hidden bg-white border border-slate-200 rounded-2xl p-6 mt-6 shadow-sm">
                <h3 class="text-lg font-bold mb-4" id="dayPanelTitle">Sessões do dia</h3>
                <div id="daySessionsList" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script>
        // ========== Auth Check ==========
        let currentUserId = null;

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUserId = user.uid;
            document.getElementById('userName').textContent = user.displayName || 'Usuário';
            renderCalendar();
            renderGoals();
        });

        // ========== Mobile Nav ==========
        document.getElementById('mobileNavBtn').addEventListener('click', () => {
            document.getElementById('mobileNav').classList.toggle('hidden');
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = '../index.html';
        });

        // ========== Calendar ==========
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
            'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        function getSessions() {
            return JSON.parse(localStorage.getItem('tccflow_sessions') || '[]').filter(s => s.userId === currentUserId);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('monthTitle');
            title.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();
            const sessions = getSessions();

            let html = '';
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="p-2 sm:p-3"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const daySessions = sessions.filter(s => s.date === dateStr);
                const isToday = day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
                const hasSession = daySessions.length > 0;
                const allCompleted = hasSession && daySessions.every(s => s.completed);

                let classes = 'calendar-day rounded-xl p-2 sm:p-3 text-center cursor-pointer transition';
                if (isToday) classes += ' today';
                if (hasSession && allCompleted) classes += ' has-session has-completed';
                else if (hasSession) classes += ' has-session';

                html += `<div class="${classes}" onclick="showDaySessions('${dateStr}', ${day})">
                    <span class="text-sm font-medium ${isToday ? 'text-violet-600' : 'text-slate-700'}">${day}</span>
                    ${hasSession ? `<div class="text-[10px] text-slate-400 mt-1 hidden sm:block">${daySessions.length} sessão${daySessions.length > 1 ? 'ões' : ''}</div>` : ''}
                </div>`;
            }

            grid.innerHTML = html;
        }

        window.showDaySessions = function(dateStr, day) {
            const sessions = getSessions().filter(s => s.date === dateStr);
            const panel = document.getElementById('dayPanel');
            const list = document.getElementById('daySessionsList');
            const title = document.getElementById('dayPanelTitle');
            title.textContent = `Sessões de ${day} de ${monthNames[currentMonth]}`;

            if (sessions.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Nenhuma sessão neste dia.</p>';
            } else {
                list.innerHTML = sessions.map(s => `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between">
                        <div>
                            <span class="text-sm font-semibold">${escapeHtml(s.subject)}</span>
                            <span class="text-xs text-slate-400 ml-2">${escapeHtml(s.topic || '')}</span>
                            ${s.time ? `<span class="text-xs text-slate-400 ml-2"><i class="fa-regular fa-clock mr-1"></i>${s.time}</span>` : ''}
                        </div>
                        <span class="text-xs px-2 py-1 rounded-lg ${s.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${s.completed ? 'Concluída' : 'Pendente'}
                        </span>
                    </div>
                `).join('');
            }
            panel.classList.remove('hidden');
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });

        // ========== Goals ==========
        const GOALS_KEY = 'tccflow_goals';

        function getGoals() {
            return JSON.parse(localStorage.getItem(GOALS_KEY) || '[]').filter(g => g.userId === currentUserId);
        }

        function saveGoals(goals) {
            const allGoals = JSON.parse(localStorage.getItem(GOALS_KEY) || '[]').filter(g => g.userId !== currentUserId);
            localStorage.setItem(GOALS_KEY, JSON.stringify([...allGoals, ...goals]));
        }

        function renderGoals() {
            const goals = getGoals();
            const list = document.getElementById('goalsList');

            if (goals.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-400">
                    <i class="fa-solid fa-flag text-2xl mb-2 block"></i>
                    <p class="text-sm">Nenhuma meta definida.</p>
                </div>`;
                return;
            }

            goals.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

            list.innerHTML = goals.map(goal => {
                const isOverdue = new Date(goal.deadline) < new Date() && !goal.completed;
                return `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex items-center justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold ${goal.completed ? 'line-through opacity-60' : ''}">${escapeHtml(goal.title)}</h4>
                        <p class="text-xs text-slate-400 mt-1">
                            <i class="fa-regular fa-calendar mr-1"></i>Prazo: ${new Date(goal.deadline + 'T00:00:00').toLocaleDateString('pt-BR')}
                            ${isOverdue ? '<span class="text-red-500 ml-2">Atrasada</span>' : ''}
                        </p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleGoal('${goal.id}')" class="${goal.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-violet-100 text-violet-700'} text-xs font-medium px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid ${goal.completed ? 'fa-rotate-left' : 'fa-check'}"></i>
                        </button>
                        <button onclick="deleteGoal('${goal.id}')" class="bg-red-100 text-red-600 text-xs font-medium px-3 py-1.5 rounded-lg transition hover:bg-red-200">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('addGoalBtn').addEventListener('click', () => {
            document.getElementById('goalForm').classList.toggle('hidden');
        });
        document.getElementById('cancelGoal').addEventListener('click', () => {
            document.getElementById('goalForm').classList.add('hidden');
        });

        document.getElementById('saveGoal').addEventListener('click', () => {
            const title = document.getElementById('goalTitle').value.trim();
            const deadline = document.getElementById('goalDeadline').value;
            if (!title || !deadline) { alert('Preencha a meta e o prazo.'); return; }

            const goals = getGoals();
            goals.push({
                id: Date.now().toString(), userId: currentUserId,
                title, deadline, completed: false,
                createdAt: new Date().toISOString()
            });
            saveGoals(goals);
            document.getElementById('goalTitle').value = '';
            document.getElementById('goalDeadline').value = '';
            document.getElementById('goalForm').classList.add('hidden');
            renderGoals();
        });

        window.toggleGoal = function(id) {
            const goals = getGoals();
            const goal = goals.find(g => g.id === id);
            if (goal) { goal.completed = !goal.completed; saveGoals(goals); renderGoals(); }
        };

        window.deleteGoal = function(id) {
            if (!confirm('Eliminar esta meta?')) return;
            const goals = getGoals().filter(g => g.id !== id);
            saveGoals(goals);
            renderGoals();
        };
    </script>
</body>
</html>
