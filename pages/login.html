<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WX7MD9CL9"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4278555972399416">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="../js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        :root {
            --violet: #7c3aed;
            --violet-2: #8b5cf6;
            --cyan: #06b6d4;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0a0818;
            --bg-2: #120f24;
            --paper: #15112a;
            --ink: #f5f3ff;
            --ink-2: #d8d3f0;
            --muted: #9189ad;
            --line: #251f40;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background .4s, color .4s;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Grid background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .3;
            z-index: 0;
            pointer-events: none;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Main */
        .auth-main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 0;
            z-index: 2;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: var(--shadow);
        }

        @media (max-width: 640px) {
            .auth-card { padding: 32px 24px; }
            .container { padding: 0 16px; }
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 32px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--violet); }
        .back-link i { font-size: 0.75rem; }

        /* Header */
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            background: var(--grad);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .auth-logo img {
            width: 32px;
            height: 32px;
            filter: brightness(0) invert(1);
        }

        .auth-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 400;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .auth-header p {
            font-size: 0.9375rem;
            color: var(--ink-2);
            margin: 0;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--ink);
        }

        .form-group label i {
            color: var(--violet);
            font-size: 0.75rem;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1.5px solid var(--line);
            background: var(--bg-2);
            border-radius: 12px;
            font-size: 0.9375rem;
            color: var(--ink);
            transition: all .2s;
        }

        .form-group input::placeholder { color: var(--muted); }

        .form-group input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.875rem;
            transition: color .2s;
        }

        .password-toggle:hover { color: var(--violet); }

        .form-group.password-group {
            position: relative;
        }

        .form-group.password-group input { padding-right: 40px; }

        /* Error message */
        .error-msg {
            display: none;
            background: rgba(239, 68, 68, .08);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .error-msg.show { display: flex; align-items: center; gap: 10px; }

        /* Submit button */
        .btn-submit {
            padding: 14px 24px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(124, 58, 237, .4);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--muted);
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }

        /* Google button */
        .btn-google {
            padding: 12px 20px;
            background: var(--bg-2);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--ink-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all .2s;
        }

        .btn-google:hover { border-color: var(--violet); color: var(--ink); }
        .btn-google:disabled { opacity: .6; cursor: not-allowed; }

        .btn-google svg { opacity: .4; }

        .btn-google .badge {
            margin-left: auto;
            background: var(--line);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Links */
        .auth-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        .auth-link {
            font-size: 0.875rem;
            color: var(--muted);
            transition: color .2s;
        }

        .auth-link:hover { color: var(--violet); }

        .auth-link strong {
            font-weight: 600;
            color: var(--violet);
        }

        .auth-link-signup {
            text-align: center;
            font-size: 0.875rem;
        }

        .auth-link-signup a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .auth-link-signup a:hover { color: var(--violet-2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="auth-main">
        <div class="container">
            <div class="auth-card">
                <!-- Back -->
                <a href="../index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar ao inicio
                </a>

                <!-- Header -->
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="../favicon.png" alt="TCCFlow">
                    </div>
                    <h1>Entrar</h1>
                    <p>Acesse sua conta e continue seu TCC</p>
                </div>

                <!-- Form -->
                <div class="error-msg" id="errorMsg">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText"></span>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>
                            <i class="fa-solid fa-envelope"></i>
                            Email
                        </label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group password-group">
                        <label>
                            <i class="fa-solid fa-lock"></i>
                            Senha
                        </label>
                        <input type="password" id="password" placeholder="Sua senha" required>
                        <button type="button" class="password-toggle" onclick="togglePass()">
                            <i id="passIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Entrar</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">ou</div>

                <!-- Google -->
                <button type="button" id="googleLoginBtn" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 48 48" style="opacity:.6"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    <span>Entrar com Google</span>
                    <div class="badge">Em breve</div>
                </button>

                <!-- Links -->
                <div class="auth-links">
                    <a href="recuperar-senha.html" class="auth-link">
                        <i class="fa-solid fa-question-circle" style="margin-right: 4px;"></i>
                        Esqueceu a senha?
                    </a>
                    <a href="login-codigo.html" class="auth-link">
                        <i class="fa-solid fa-envelope" style="margin-right: 4px;"></i>
                        Entrar com código por email
                    </a>
                </div>

                <!-- Signup -->
                <div class="auth-link-signup">
                    Não tem conta? <a href="cadastro.html">Criar agora</a>
                </div>

                <!-- Footer -->
                <div class="auth-footer">
                    &copy; 2026 TCCFlow. Todos os direitos reservados.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (p.type === 'password') { p.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { p.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const storedRedirect = (() => { try { return localStorage.getItem('tccflow_oauth_redirect'); } catch(e) { return null; } })();
        const redirectTarget = urlParams.get('redirect') || storedRedirect || 'dashboard.html';
        try { localStorage.removeItem('tccflow_oauth_redirect'); } catch(e) {}

        auth.onAuthStateChanged(user => {
            if (window._processingOAuth) return;
            if (user) {
                _supa.from('users').select('id, role').eq('id', user.uid).maybeSingle().then(({ data }) => {
                    if (!data) {
                        _supa.from('users').upsert({
                            id: user.uid,
                            name: user.displayName || 'Usuario',
                            email: user.email,
                            role: 'student',
                            created_at: new Date().toISOString()
                        }, { onConflict: 'id', ignoreDuplicates: true }).then(() => {
                            window.location.href = redirectTarget;
                        });
                    } else {
                        window.location.href = redirectTarget;
                    }
                }).catch(() => {
                    window.location.href = redirectTarget;
                });
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Entrando...</span>';

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                let msg = 'Erro ao fazer login.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Email ou senha incorretos.';
                else if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Entrar</span>';
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorMsg.classList.remove('show');

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };
                await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider(), { redirectTo: '/pages/' + redirectTarget });
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao entrar com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Dominio nao autorizado. Adicione este dominio nas configuracoes do Supabase Auth.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
