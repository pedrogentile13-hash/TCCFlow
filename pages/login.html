<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4278555972399416">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="../js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        :root {
            --violet: #7c3aed;
            --violet-2: #8b5cf6;
            --violet-dk: #6d28d9;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --line-2: #d9d4c4;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --radius-lg: 28px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        }

        [data-theme="dark"] {
            --bg: #0a0818;
            --bg-2: #120f24;
            --paper: #15112a;
            --ink: #f5f3ff;
            --ink-2: #d8d3f0;
            --muted: #9189ad;
            --line: #251f40;
            --line-2: #1e1938;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background .4s, color .4s;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Grid background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .35;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ Nav ============ */
        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid transparent;
            transition: border-color .3s;
        }

        .nav.scrolled { border-bottom-color: var(--line); }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.0625rem;
            letter-spacing: -0.01em;
        }

        .brand img { width: 28px; height: 28px; }

        .brand .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--violet);
            margin-left: 2px;
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: transform .25s cubic-bezier(.2,.9,.3,1.2), background .2s, color .2s, box-shadow .25s;
            white-space: nowrap;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--ink);
            color: var(--bg);
            box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 6px 20px -8px rgba(15,13,30,.35);
        }
        .btn-primary:hover {
            background: var(--violet);
            box-shadow: 0 6px 24px -6px rgba(124,58,237,.5);
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            padding: 10px 16px;
        }
        .btn-ghost:hover { background: var(--bg-2); }

        .btn-active {
            background: var(--bg-2);
            color: var(--violet);
            padding: 10px 16px;
            font-weight: 600;
        }

        /* ============ Main content ============ */
        .auth-main {
            position: relative;
            z-index: 2;
            max-width: 440px;
            margin: 0 auto;
            padding: 120px 32px 60px;
        }

        /* Eyebrow */
        .eyebrow {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: currentColor;
            opacity: .5;
        }

        /* Title */
        .auth-title {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 8px;
        }

        .auth-subtitle {
            font-size: 0.9375rem;
            color: var(--ink-2);
            margin: 0;
            line-height: 1.5;
        }

        /* Dashed separator */
        .sep {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 32px 0;
        }

        /* Divider with text */
        .divider-text {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
        }

        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            border-top: 1px dashed var(--line);
        }

        .divider-text span {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: lowercase;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink);
        }

        .form-group label i {
            color: var(--violet);
            font-size: 0.75rem;
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            font-size: 0.9375rem;
            color: var(--ink);
            transition: all .2s;
        }

        .form-group input::placeholder { color: var(--muted); }

        .form-group input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        .form-group.password-group {
            position: relative;
        }

        .form-group.password-group input { padding-right: 44px; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.875rem;
            transition: color .2s;
        }

        .password-toggle:hover { color: var(--violet); }

        /* Error message */
        .error-box {
            display: none;
            padding: 14px 18px;
            border-left: 3px solid #ef4444;
            background: rgba(239,68,68,.06);
            color: #dc2626;
            font-size: 0.875rem;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }

        .error-box.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Submit button */
        .btn-submit {
            padding: 16px 24px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(124, 58, 237, .4);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Google button */
        .btn-google {
            padding: 14px 20px;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--ink-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all .2s;
        }

        .btn-google:hover { border-color: var(--violet); color: var(--ink); }
        .btn-google:disabled { opacity: .6; cursor: not-allowed; }
        .btn-google svg { opacity: .4; }

        .btn-google .badge {
            margin-left: auto;
            background: var(--line);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Links */
        .auth-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .auth-link {
            font-size: 0.875rem;
            color: var(--muted);
            transition: color .2s;
        }

        .auth-link:hover { color: var(--violet); }

        .auth-link-signup {
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .auth-link-signup a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .auth-link-signup a:hover { color: var(--violet-2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding-top: 48px;
            padding-bottom: 24px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* ============ Responsive ============ */
        @media (max-width: 640px) {
            .auth-main { padding: 100px 16px 40px; }
            .nav-inner { padding: 0 16px; height: 56px; }
            .brand { font-size: 0.9375rem; gap: 8px; }
            .auth-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <!-- Sticky Nav -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="../index.html" class="brand">
                <img src="../favicon.png" alt="TCCFlow">
                <span>TCCFlow<span class="dot"></span></span>
            </a>
            <div class="nav-cta">
                <span class="btn btn-active">Entrar</span>
                <a href="cadastro.html" class="btn btn-primary">Começar grátis</a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="auth-main">
        <div class="eyebrow">Acesso</div>

        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta e continue seu TCC</p>

        <hr class="sep">

        <!-- Error -->
        <div class="error-box" id="errorMsg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText"></span>
        </div>

        <!-- Form -->
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label>
                    <i class="fa-solid fa-envelope"></i>
                    Email
                </label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group password-group">
                <label>
                    <i class="fa-solid fa-lock"></i>
                    Senha
                </label>
                <input type="password" id="password" placeholder="Sua senha" required>
                <button type="button" class="password-toggle" onclick="togglePass()">
                    <i id="passIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Entrar</span>
            </button>
        </form>

        <!-- Divider with text -->
        <div class="divider-text">
            <span>ou</span>
        </div>

        <!-- Google -->
        <button type="button" id="googleLoginBtn" class="btn-google" disabled>
            <svg width="18" height="18" viewBox="0 0 48 48" style="opacity:.6"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Entrar com Google</span>
            <div class="badge">Em breve</div>
        </button>

        <hr class="sep">

        <!-- Links -->
        <div class="auth-links">
            <a href="recuperar-senha.html" class="auth-link">
                <i class="fa-solid fa-question-circle" style="margin-right: 4px;"></i>
                Esqueceu a senha?
            </a>
            <a href="login-codigo.html" class="auth-link">
                <i class="fa-solid fa-envelope" style="margin-right: 4px;"></i>
                Entrar com código por email
            </a>
            <div class="auth-link-signup">
                Não tem conta? <a href="cadastro.html">Criar agora</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            &copy; 2026 TCCFlow
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (p.type === 'password') { p.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { p.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const storedRedirect = (() => { try { return localStorage.getItem('tccflow_oauth_redirect'); } catch(e) { return null; } })();
        const redirectTarget = urlParams.get('redirect') || storedRedirect || 'dashboard.html';
        try { localStorage.removeItem('tccflow_oauth_redirect'); } catch(e) {}

        auth.onAuthStateChanged(user => {
            if (window._processingOAuth) return;
            if (user) {
                _supa.from('users').select('id, role').eq('id', user.uid).maybeSingle().then(({ data }) => {
                    if (!data) {
                        _supa.from('users').upsert({
                            id: user.uid,
                            name: user.displayName || 'Usuario',
                            email: user.email,
                            role: 'student',
                            created_at: new Date().toISOString()
                        }, { onConflict: 'id', ignoreDuplicates: true }).then(() => {
                            window.location.href = redirectTarget;
                        });
                    } else {
                        window.location.href = redirectTarget;
                    }
                }).catch(() => {
                    window.location.href = redirectTarget;
                });
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Entrando...</span>';

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                let msg = 'Erro ao fazer login.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Email ou senha incorretos.';
                else if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Entrar</span>';
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorMsg.classList.remove('show');

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };
                await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider(), { redirectTo: '/pages/' + redirectTarget });
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao entrar com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Dominio nao autorizado. Adicione este dominio nas configuracoes do Supabase Auth.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
        });

        // Nav scroll border
        window.addEventListener('scroll', () => {
            document.querySelector('.nav').classList.toggle('scrolled', window.scrollY > 8);
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
