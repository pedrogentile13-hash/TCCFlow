<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .liquid-bg .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
        .blob-1 { width: 500px; height: 500px; background: rgba(139,92,246,0.12); top: -100px; right: -100px; animation: drift1 25s infinite ease-in-out; }
        .blob-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.10); bottom: -80px; left: -80px; animation: drift2 30s infinite ease-in-out; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-150px,100px) scale(1.1)} 66%{transform:translate(80px,-60px) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(120px,-80px) scale(0.95)} 66%{transform:translate(-60px,60px) scale(1.1)} }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao início
        </a>

        <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                    <i class="fa-solid fa-right-to-bracket text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold">Entrar</h1>
                <p class="text-sm text-slate-500 mt-2">Acesse sua conta do TCCFlow</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">
                        <i class="fa-solid fa-envelope mr-1 text-violet-600"></i> Email
                    </label>
                    <input type="email" id="email" required placeholder="seu@email.com"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">
                        <i class="fa-solid fa-lock mr-1 text-violet-600"></i> Senha
                    </label>
                    <input type="password" id="password" required placeholder="Sua senha"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>

                <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar
                </button>

                <!-- Google Login -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-slate-400">ou</span></div>
                </div>

                <button type="button" disabled
                    class="w-full bg-slate-100 border border-slate-200 text-slate-400 font-medium py-3 rounded-xl flex items-center justify-center gap-3 cursor-not-allowed relative">
                    <svg width="18" height="18" viewBox="0 0 48 48" class="opacity-40"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Entrar com Google
                    <span class="text-[10px] font-bold uppercase bg-amber-500 text-white px-2 py-0.5 rounded-full">Em breve</span>
                </button>
            </form>

            <div class="flex flex-col items-center gap-2 mt-6">
                <a href="recuperar-senha.html" class="text-sm text-slate-400 hover:text-violet-600 transition">Esqueceu a senha?</a>
                <a href="login-codigo.html" class="text-sm text-violet-600 hover:underline font-medium"><i class="fa-solid fa-envelope mr-1"></i>Entrar com código por email</a>
                <p class="text-sm text-slate-500">
                    Não tem conta? <a href="cadastro.html" class="text-violet-600 hover:underline font-medium">Criar conta</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Entrando...';

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase não configurado. Edite js/supabase-init.js' };
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                let msg = 'Erro ao fazer login.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Email ou senha incorretos.';
                else if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
                else if (err.message) msg = err.message;
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar';
            }
        });

        // ========== Google Login ==========
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            try {
                if (!isFirebaseConfigured()) throw { message: 'Supabase não configurado. Edite js/supabase-init.js' };

                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Create/update user doc in Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    await db.collection('users').doc(user.uid).set({
                        name: user.displayName || 'Usuário',
                        email: user.email,
                        projectId: null,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                window.location.href = 'dashboard.html';
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao entrar com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Domínio não autorizado. Adicione este domínio nas configurações do Supabase Auth.';
                else if (err.message) msg = err.message;
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
