<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TCCFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="absolute w-[500px] h-[500px] bg-violet-500 rounded-full filter blur-[140px] opacity-10 -top-40 -left-40 pointer-events-none"></div>
    <div class="absolute w-[500px] h-[500px] bg-cyan-500 rounded-full filter blur-[140px] opacity-10 -bottom-40 -right-40 pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao inicio
        </a>

        <div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50 dark:shadow-none">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                    <i class="fa-solid fa-right-to-bracket text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold">Entrar</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Acesse sua conta do TCCFlow</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-envelope mr-1 text-violet-600 dark:text-violet-400"></i> Email
                    </label>
                    <input type="email" id="email" required placeholder="seu@email.com"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-lock mr-1 text-violet-600 dark:text-violet-400"></i> Senha
                    </label>
                    <input type="password" id="password" required placeholder="Sua senha"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>

                <div id="errorMsg" class="hidden bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-sm rounded-xl px-4 py-3"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Nao tem conta? <a href="cadastro.html" class="text-violet-600 dark:text-violet-400 hover:underline font-medium">Criar conta</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Entrando...';

            try {
                if (!isFirebaseConfigured()) throw { message: 'Firebase nao configurado. Edite js/firebase-init.js' };
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                let msg = 'Erro ao fazer login.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Email ou senha incorretos.';
                else if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
                else if (err.message) msg = err.message;
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar';
            }
        });
    </script>
</body>
</html>
