<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Projeto — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const DATES = [
  { label:"Entrega do Projeto",      date:"15 mai 2026", color:"var(--violet)", done:false },
  { label:"Qualificação",            date:"20 jun 2026", color:"var(--cyan)",   done:false },
  { label:"Entrega Final",           date:"15 set 2026", color:"var(--amber)",  done:false },
  { label:"Defesa do TCC",           date:"10 out 2026", color:"var(--emerald)",done:false },
];

function InfoField({ label, value, wide }) {
  return (
    <div style={{ gridColumn: wide ? "span 2" : "span 1" }}>
      <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--muted)", marginBottom:6 }}>{label}</div>
      <div style={{ fontSize:"0.9375rem", color:"var(--ink)", lineHeight:1.5, padding:"10px 14px", background:"var(--bg-2)", borderRadius:9, border:"1px solid var(--line)" }}>{value}</div>
    </div>
  );
}

function ProjectPage() {
  const [shown, setShown] = useState(false);
  useEffect(() => { setTimeout(() => setShown(true), 50); }, []);
  const [editMode, setEditMode] = useState(false);

  return (
    <div className="app-layout">
      <Sidebar active="project"/>
      <div className="main-area">
        <Topbar page="Projeto" actions={
          <button className={`btn ${editMode?"btn-violet":"btn-ghost"} btn-sm`} onClick={() => setEditMode(e => !e)}>
            {editMode ? "Salvar alterações" : "Editar projeto"}
          </button>
        }/>
        <div className="page-content">

          <div className={`reveal ${shown?"in":""}`} style={{ marginBottom:24 }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:16, flexWrap:"wrap" }}>
              <div>
                <div className="mono-label" style={{ marginBottom:8 }}>Trabalho de Conclusão de Curso</div>
                <h1 style={{ fontFamily:"var(--font-display)", fontSize:"1.875rem", fontWeight:400, letterSpacing:"-.02em", lineHeight:1.15, marginBottom:8 }}>
                  Impacto das Redes Sociais no<br/><em style={{ fontStyle:"italic", color:"var(--violet)" }}>Desempenho Acadêmico</em>
                </h1>
                <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                  <span className="tag tag-violet">Pesquisa Quantitativa</span>
                  <span className="tag tag-cyan">Em andamento</span>
                  <span className="tag tag-amber">34% concluído</span>
                </div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div className="mono-label" style={{ marginBottom:4 }}>Código de entrada</div>
                <div style={{ fontFamily:"var(--font-mono)", fontSize:"1.125rem", fontWeight:700, color:"var(--violet)", background:"rgba(124,58,237,.08)", padding:"8px 16px", borderRadius:9, border:"1px dashed rgba(124,58,237,.3)" }}>TCC-2026-A4F7</div>
              </div>
            </div>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 320px", gap:16 }}>
            <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

              <div className={`card reveal ${shown?"in":""} d1`}>
                <div className="card-title"><span className="ct-icon">📋</span> Informações Gerais</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                  <InfoField label="Instituição" value="Universidade Federal de São Paulo — UNIFESP"/>
                  <InfoField label="Curso / Turma" value="Ciências da Computação — 8º Semestre"/>
                  <InfoField label="Tipo do Trabalho" value="Monografia de Graduação"/>
                  <InfoField label="Metodologia" value="Pesquisa Quantitativa com Survey Online"/>
                </div>
              </div>

              <div className={`card reveal ${shown?"in":""} d2`}>
                <div className="card-title"><span className="ct-icon">🎯</span> Objetivos</div>
                <div style={{ marginBottom:16 }}>
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--muted)", marginBottom:8 }}>Objetivo Geral</div>
                  <div style={{ fontSize:"0.9375rem", lineHeight:1.6, color:"var(--ink-2)", padding:"12px 14px", background:"var(--bg-2)", borderRadius:9, border:"1px solid var(--line)" }}>
                    Investigar a correlação entre o tempo de uso de plataformas de redes sociais e o desempenho acadêmico de estudantes do ensino superior, identificando padrões de impacto positivo e negativo.
                  </div>
                </div>
                <div>
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--muted)", marginBottom:8 }}>Objetivos Específicos</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                    {[
                      "Mapear o perfil de uso das principais redes sociais entre estudantes universitários",
                      "Correlacionar tempo de uso com índice de rendimento acadêmico (IRA)",
                      "Identificar quais plataformas têm maior impacto (positivo/negativo) nos estudos",
                      "Propor diretrizes para uso consciente de redes sociais durante a graduação"
                    ].map((obj, i) => (
                      <div key={i} style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"9px 12px", background:"var(--bg-2)", borderRadius:8, border:"1px solid var(--line)", fontSize:"0.875rem", color:"var(--ink-2)" }}>
                        <span style={{ width:20, height:20, borderRadius:6, background:"var(--grad)", color:"white", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"0.625rem", fontWeight:700, flexShrink:0 }}>{i+1}</span>
                        {obj}
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className={`card reveal ${shown?"in":""} d3`}>
                <div className="card-title"><span className="ct-icon">👨‍🏫</span> Orientação</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                  <div style={{ padding:"14px", background:"var(--bg-2)", borderRadius:10, border:"1px solid var(--line)" }}>
                    <div className="mono-label" style={{ marginBottom:8 }}>Orientador</div>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div className="av av-md c1" style={{ flexShrink:0 }}>RS</div>
                      <div>
                        <div style={{ fontWeight:600, fontSize:"0.9375rem" }}>Prof. Dr. Ricardo Silva</div>
                        <div style={{ fontSize:"0.8125rem", color:"var(--muted)" }}>Sistemas de Informação</div>
                        <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--violet)", marginTop:2 }}>r.silva@unifesp.br</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ padding:"14px", background:"var(--bg-2)", borderRadius:10, border:"1px solid var(--line)" }}>
                    <div className="mono-label" style={{ marginBottom:8 }}>Professor Responsável</div>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div className="av av-md c2" style={{ flexShrink:0 }}>MC</div>
                      <div>
                        <div style={{ fontWeight:600, fontSize:"0.9375rem" }}>Profa. Dra. Maria Costa</div>
                        <div style={{ fontSize:"0.8125rem", color:"var(--muted)" }}>Metodologia Científica</div>
                        <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--violet)", marginTop:2 }}>m.costa@unifesp.br</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
              <div className={`card reveal ${shown?"in":""} d1`}>
                <div className="card-title"><span className="ct-icon">⏱</span> Prazo &amp; Datas</div>
                <div style={{ textAlign:"center", padding:"16px 0", marginBottom:12 }}>
                  <div className="mono-label" style={{ marginBottom:4 }}>Dias até a defesa</div>
                  <div style={{ fontFamily:"var(--font-display)", fontSize:"3rem", lineHeight:1, letterSpacing:"-.03em", color:"var(--violet)" }}>168</div>
                  <div style={{ fontSize:"0.8125rem", color:"var(--muted)", marginTop:4 }}>10 de outubro de 2026</div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {DATES.map((d, i) => (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:8, background:"var(--bg-2)", border:"1px solid var(--line)" }}>
                      <span style={{ width:8, height:8, borderRadius:"50%", background:d.color, flexShrink:0 }}></span>
                      <span style={{ flex:1, fontSize:"0.8125rem" }}>{d.label}</span>
                      <span style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--muted)" }}>{d.date}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className={`card reveal ${shown?"in":""} d2`}>
                <div className="card-title"><span className="ct-icon">📈</span> Progresso Geral</div>
                {[
                  { label:"Pesquisa bibliográfica", pct:70, color:"var(--cyan)" },
                  { label:"Referencial teórico",    pct:45, color:"var(--violet)" },
                  { label:"Metodologia",            pct:30, color:"var(--amber)" },
                  { label:"Coleta de dados",        pct:10, color:"var(--emerald)" },
                  { label:"Análise & Resultados",   pct:0,  color:"var(--rose)" },
                ].map((item, i) => (
                  <div key={i} style={{ marginBottom:12 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                      <span style={{ fontSize:"0.8125rem", color:"var(--ink-2)" }}>{item.label}</span>
                      <span style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--muted)" }}>{item.pct}%</span>
                    </div>
                    <div className="progress-bar"><div className="progress-fill" style={{ width:`${item.pct}%`, background:item.color }}></div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ProjectPage/>);
</script>
</body>
</html>
