<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe - TCCFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-200/80 dark:border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <a href="dashboard.html" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
                    </div>
                    <span class="text-lg font-bold">TCC<span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-cyan-500">Flow</span></span>
                </a>
                <div class="hidden lg:flex items-center gap-1">
                    <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10 transition">Dashboard</a>
                    <a href="organizacao.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10 transition">Organização</a>
                    <a href="pesquisa.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10 transition">Pesquisa</a>
                    <a href="calendario.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10 transition">Calendário</a>
                    <a href="equipe.html" class="px-3 py-2 rounded-lg text-sm font-medium text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-500/10">Equipe</a>
                    <a href="google.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10 transition">Google</a>
                </div>
                <div class="flex items-center gap-2">
                    <span class="hidden sm:block text-sm text-slate-500 dark:text-slate-400" id="userName"></span>
                    <a href="admin.html" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition">
                        <i class="fa-solid fa-gear text-sm"></i>
                    </a>
                    <button id="logoutBtn" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-16 min-h-screen pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">Gerenciar Equipe</h1>
                <p class="text-slate-500 dark:text-slate-400">Invite membros e organize seu grupo de TCC</p>
            </div>

            <!-- Add Member Card -->
            <div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl p-6 mb-8 shadow-sm">
                <h2 class="text-lg font-bold mb-4">Convidar Membro</h2>
                <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">Compartilhe este código com seu grupo para que entrem no projeto:</p>
                <div class="flex items-center gap-3 p-4 bg-violet-50 dark:bg-violet-500/10 rounded-xl border border-violet-200 dark:border-violet-500/20">
                    <code class="text-lg font-bold text-violet-700 dark:text-violet-300 flex-1" id="projectCode">Carregando...</code>
                    <button onclick="copyCode()" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        <i class="fa-solid fa-copy mr-1"></i>Copiar
                    </button>
                </div>
            </div>

            <!-- Team Members -->
            <div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl p-6 shadow-sm">
                <h2 class="text-lg font-bold mb-6">Membros da Equipe</h2>
                <div id="membersList" class="space-y-3">
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 block"></i>
                        <p>Carregando membros...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script>
        let currentUser = null;
        let projectId = null;

        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.displayName || 'Usuário';

            if (isFirebaseConfigured()) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        projectId = userDoc.data().projectId;
                        const projectDoc = await db.collection('projects').doc(projectId).get();
                        const project = projectDoc.data();
                        document.getElementById('projectCode').textContent = project.code;
                        loadMembers();
                    }
                } catch (err) {
                    console.log('Error:', err.message);
                }
            }
        });

        function copyCode() {
            const code = document.getElementById('projectCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Código copiado!');
            });
        }

        async function loadMembers() {
            if (!projectId || !isFirebaseConfigured()) return;

            try {
                const projectDoc = await db.collection('projects').doc(projectId).get();
                const project = projectDoc.data();
                const membersList = document.getElementById('membersList');

                if (project.members.length === 0) {
                    membersList.innerHTML = '<p class="text-center text-slate-500">Nenhum membro ainda</p>';
                    return;
                }

                const html = project.members.map(uid => {
                    return `
                        <div class="flex items-center justify-between p-4 rounded-xl hover:bg-slate-50 dark:hover:bg-white/5 border border-slate-200 dark:border-white/5">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-full flex items-center justify-center text-white font-bold text-sm">
                                    <i class="fa-solid fa-user text-xs"></i>
                                </div>
                                <div>
                                    <p class="font-medium" id="name-${uid}">Carregando...</p>
                                    <p class="text-xs text-slate-500" id="email-${uid}"></p>
                                </div>
                            </div>
                            <span class="text-xs px-3 py-1 rounded-full bg-violet-100 dark:bg-violet-500/20 text-violet-700 dark:text-violet-300">
                                ${uid === currentUser.uid ? 'Você' : 'Membro'}
                            </span>
                        </div>`;
                }).join('');

                membersList.innerHTML = html;

                // Load user names
                for (const uid of project.members) {
                    try {
                        const userDoc = await db.collection('users').doc(uid).get();
                        if (userDoc.exists) {
                            const data = userDoc.data();
                            document.getElementById(`name-${uid}`).textContent = data.name || 'Sem nome';
                            document.getElementById(`email-${uid}`).textContent = data.email;
                        }
                    } catch (err) {
                        console.log('Error loading user:', err);
                    }
                }
            } catch (err) {
                console.log('Error loading members:', err);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
