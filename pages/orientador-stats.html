<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Orientador - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .stat-bar { height: 6px; background: linear-gradient(90deg, #10b981, #06b6d4); border-radius: 3px; }
    </style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white min-h-screen">
    <nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-emerald-200/80 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <a href="orientador-painel.html" class="flex items-center gap-2.5">
                    <span class="text-lg font-bold">Dashboard <span class="text-emerald-600">Orientador</span></span>
                </a>
                <div class="flex items-center gap-2">
                    <a href="orientador-painel.html" class="text-sm text-slate-600 dark:text-slate-400 hover:text-emerald-600">← Voltar</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 pt-20 min-h-screen pb-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">Dashboard de Estatísticas</h1>
                <p class="text-slate-600 dark:text-slate-400">Acompanhe suas atividades como orientador</p>
            </div>

            <!-- KPI Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-slate-500 dark:text-slate-400">Projetos Ativos</span>
                        <i class="fa-solid fa-folder-open text-emerald-600 text-lg"></i>
                    </div>
                    <div class="text-3xl font-bold" id="activeProjects">0</div>
                </div>

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-slate-500 dark:text-slate-400">Total de Comentários</span>
                        <i class="fa-solid fa-comments text-cyan-600 text-lg"></i>
                    </div>
                    <div class="text-3xl font-bold" id="totalComments">0</div>
                </div>

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-slate-500 dark:text-slate-400">Alunos Orientados</span>
                        <i class="fa-solid fa-users text-violet-600 text-lg"></i>
                    </div>
                    <div class="text-3xl font-bold" id="totalStudents">0</div>
                </div>

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-slate-500 dark:text-slate-400">Relatórios Gerados</span>
                        <i class="fa-solid fa-file-pdf text-rose-600 text-lg"></i>
                    </div>
                    <div class="text-3xl font-bold" id="totalReports">0</div>
                </div>
            </div>

            <!-- Projects Performance -->
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm mb-8">
                <h2 class="text-lg font-bold mb-6"><i class="fa-solid fa-chart-bar text-emerald-600 mr-2"></i>Performance por Projeto</h2>
                <div id="projectStats" class="space-y-4">
                    <p class="text-center py-8 text-slate-400">Carregando...</p>
                </div>
            </div>

            <!-- Comments by Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-lg font-bold mb-6"><i class="fa-solid fa-pie-chart text-cyan-600 mr-2"></i>Comentários por Seção</h2>
                    <div id="sectionStats" class="space-y-3">
                        <p class="text-center py-8 text-slate-400">Carregando...</p>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-lg font-bold mb-6"><i class="fa-solid fa-timeline text-violet-600 mr-2"></i>Atividade Recente</h2>
                    <div id="recentActivity" class="space-y-3">
                        <p class="text-center py-8 text-slate-400">Carregando...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script src="../js/db-service.js"></script>
    <script>
        let currentUser = null;

        auth.onAuthStateChanged(async user => {
            if (!user) { window.location.href = 'login.html?redirect=orientador-stats.html'; return; }

            // Beta gate
            try {
                const { data: ud } = await _supa.from('users').select('beta_tester').eq('id', user.uid).maybeSingle();
                if (!ud || ud.beta_tester !== true) {
                    document.querySelector('main').innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px"><div style="font-size:3rem;margin-bottom:16px">📊</div><h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px">Estatísticas em Beta</h2><p style="color:#64748b;margin-bottom:20px">Esta funcionalidade está disponível apenas para beta testers.</p><a href="dashboard.html" style="color:#7c3aed;font-weight:600">Voltar ao Dashboard</a></div>';
                    return;
                }
            } catch(e) { console.warn('Beta check failed:', e); }

            currentUser = user;
            await loadDashboardStats();

            // Refresh every 60 seconds
            setInterval(loadDashboardStats, 60000);
        });

        async function loadDashboardStats() {
            try {
                const stats = await DB.orientador.getOrientadorStats(currentUser.uid);

                let totalComments = 0;
                let totalStudents = 0;
                const sectionMap = {};

                // Process stats
                for (const stat of stats) {
                    totalComments += stat.total_comments || 0;
                    totalStudents += stat.students_count || 0;

                    (stat.sections_commented || []).forEach(section => {
                        sectionMap[section] = (sectionMap[section] || 0) + 1;
                    });
                }

                // Update KPIs
                document.getElementById('activeProjects').textContent = stats.length;
                document.getElementById('totalComments').textContent = totalComments;
                document.getElementById('totalStudents').textContent = totalStudents;

                // Get reports count
                const reports = await DB.orientador.getReports(currentUser.uid);
                document.getElementById('totalReports').textContent = reports.length;

                // Render project stats
                await renderProjectStats(stats);

                // Render section stats
                renderSectionStats(sectionMap);

                // Render recent activity
                renderRecentActivity(stats);

            } catch(err) {
                console.error('Error loading stats:', err);
            }
        }

        async function renderProjectStats(stats) {
            const el = document.getElementById('projectStats');
            if (stats.length === 0) {
                el.innerHTML = '<p class="text-center py-8 text-slate-400">Nenhum projeto vinculado</p>';
                return;
            }

            el.innerHTML = '';
            for (const stat of stats) {
                const { data: proj } = await _supa.from('projects').select('name').eq('id', stat.project_id).maybeSingle();
                const progress = stat.tasks_count > 0 ? Math.round((stat.tasks_completed / stat.tasks_count) * 100) : 0;

                el.innerHTML += `
                    <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <p class="font-bold text-sm">${proj?.name || 'Projeto'}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                    ${stat.total_comments} comentário(s) • ${stat.students_count} aluno(s) • ${progress}% de progresso
                                </p>
                            </div>
                            <span class="text-2xl font-bold text-emerald-600">${progress}%</span>
                        </div>
                        <div class="stat-bar"></div>
                    </div>`;
            }
        }

        function renderSectionStats(sectionMap) {
            const el = document.getElementById('sectionStats');
            const sections = [
                { id: 'geral', label: 'Geral', color: 'bg-slate-100 dark:bg-slate-700' },
                { id: 'introducao', label: 'Introdução', color: 'bg-violet-100 dark:bg-violet-900' },
                { id: 'metodologia', label: 'Metodologia', color: 'bg-cyan-100 dark:bg-cyan-900' },
                { id: 'resultados', label: 'Resultados', color: 'bg-emerald-100 dark:bg-emerald-900' },
                { id: 'conclusao', label: 'Conclusão', color: 'bg-amber-100 dark:bg-amber-900' },
                { id: 'referencias', label: 'Referências', color: 'bg-pink-100 dark:bg-pink-900' },
                { id: 'formatacao', label: 'Formatação', color: 'bg-indigo-100 dark:bg-indigo-900' }
            ];

            el.innerHTML = '';
            for (const section of sections) {
                const count = sectionMap[section.id] || 0;
                el.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-lg ${section.color}">
                        <span class="text-sm font-medium">${section.label}</span>
                        <span class="text-lg font-bold">${count}</span>
                    </div>`;
            }
        }

        function renderRecentActivity(stats) {
            const el = document.getElementById('recentActivity');
            const recent = stats.slice(0, 5).filter(s => s.last_comment_at);

            if (recent.length === 0) {
                el.innerHTML = '<p class="text-center py-8 text-slate-400">Nenhuma atividade recente</p>';
                return;
            }

            el.innerHTML = '';
            for (const activity of recent) {
                const date = new Date(activity.last_comment_at).toLocaleString('pt-BR');
                el.innerHTML += `
                    <div class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-comment text-emerald-600"></i>
                        <div class="text-sm">
                            <p class="font-medium">Comentário adicionado</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400">${date}</p>
                        </div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
