<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tarefas — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
    .col{background:var(--bg-2);border-radius:14px;padding:12px;}
    .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
    .col-title{font-size:.8125rem;font-weight:600;display:flex;align-items:center;gap:7px;}
    .col-dot{width:8px;height:8px;border-radius:50%;}
    .col-count{font-family:var(--font-mono);font-size:.6875rem;color:var(--muted);background:var(--paper);padding:2px 7px;border-radius:999px;border:1px solid var(--line);}
    .task-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;transition:transform .2s,box-shadow .2s;}
    .task-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
    .task-title{font-size:.875rem;font-weight:500;line-height:1.35;margin-bottom:9px;}
    .task-meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:.6875rem;color:var(--muted);}
    .add-task{width:100%;padding:8px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;font-size:.8125rem;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s;margin-top:4px;}
    .add-task:hover{border-color:var(--violet);color:var(--violet);}
    .priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;}
    .modal{background:var(--paper);border-radius:16px;padding:28px;width:420px;max-width:90vw;box-shadow:var(--shadow);}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const COLS = [
  { key:"todo", label:"A fazer", dot:"#94a3b8" },
  { key:"progress", label:"Em andamento", dot:"var(--blue)" },
  { key:"done", label:"Concluído", dot:"var(--emerald)" },
];

function TasksPage() {
  const { user, userData, project, subscription, teamMembers, loading } = useTCCData();
  const [tasks, setTasks] = useState([]);
  const [view, setView] = useState("kanban");
  const [showModal, setShowModal] = useState(false);
  const [newTitle, setNewTitle] = useState("");
  const [newDue, setNewDue] = useState("");

  useEffect(() => {
    if (!project) return;
    loadTasks();
  }, [project]);

  async function loadTasks() {
    const { data } = await _supa.from('tasks').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
    setTasks(data || []);
  }

  async function addTask() {
    if (!newTitle.trim() || !project) return;
    await _supa.from('tasks').insert({
      project_id: project.id,
      title: newTitle,
      status: 'todo',
      due_date: newDue || null,
      assigned_to: user.uid,
      created_at: new Date().toISOString()
    });
    setNewTitle(""); setNewDue(""); setShowModal(false);
    loadTasks();
  }

  async function moveTask(taskId, newStatus) {
    await _supa.from('tasks').update({ status: newStatus }).eq('id', taskId);
    setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
  }

  async function deleteTask(taskId) {
    if (!confirm('Excluir tarefa?')) return;
    await _supa.from('tasks').delete().eq('id', taskId);
    setTasks(prev => prev.filter(t => t.id !== taskId));
  }

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  const totalTasks = tasks.length;
  const doneTasks = tasks.filter(t => t.status === 'done').length;
  const nextStatus = { todo: 'progress', progress: 'done', done: 'todo' };

  const getMember = (id) => teamMembers.find(m => m.id === id);

  return (
    <div className="app-layout">
      <Sidebar active="tasks" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Tarefas" user={user} actions={
          <button className="btn btn-violet btn-sm" onClick={() => setShowModal(true)}>+ Nova tarefa</button>
        }/>
        <div className="page-content">

          <div style={{ display:"flex", alignItems:"center", gap:20, marginBottom:20, flexWrap:"wrap" }}>
            <h1 style={{ fontFamily:"var(--font-display)", fontSize:"1.75rem", fontWeight:400, letterSpacing:"-.02em" }}>
              Quadro de <em style={{ fontStyle:"italic", color:"var(--violet)" }}>tarefas</em>
            </h1>
            <div style={{ display:"flex", gap:16, marginLeft:"auto", alignItems:"center" }}>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.75rem", color:"var(--muted)" }}>{doneTasks}/{totalTasks} concluídas</div>
              {totalTasks > 0 && <div style={{ width:120 }}><div className="progress-bar"><div className="progress-fill" style={{ width:`${doneTasks/totalTasks*100}%` }}></div></div></div>}
              <div style={{ display:"flex", gap:4 }}>
                {[["kanban","⊞ Kanban"],["list","≡ Lista"]].map(([v,l]) => (
                  <button key={v} className={`btn btn-sm ${view===v?"btn-primary":"btn-ghost"}`} onClick={() => setView(v)}>{l}</button>
                ))}
              </div>
            </div>
          </div>

          {view === "kanban" ? (
            <div className="kanban">
              {COLS.map(col => {
                const colTasks = tasks.filter(t => t.status === col.key);
                return (
                  <div key={col.key} className="col">
                    <div className="col-head">
                      <div className="col-title"><span className="col-dot" style={{ background:col.dot }}></span>{col.label}</div>
                      <span className="col-count">{colTasks.length}</span>
                    </div>
                    {colTasks.map(t => {
                      const assignee = getMember(t.assigned_to);
                      return (
                        <div key={t.id} className="task-card">
                          <div className="task-title">{t.title}</div>
                          <div className="task-meta">
                            <div style={{display:"flex",alignItems:"center",gap:5}}>
                              <span className="priority-dot" style={{background:t.due_date && new Date(t.due_date)<new Date()?"var(--rose)":"var(--muted)"}}></span>
                              {t.due_date && <span>{new Date(t.due_date).toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}</span>}
                            </div>
                            <div style={{display:"flex",gap:4}}>
                              <button style={{fontSize:".6rem",cursor:"pointer",background:"none",border:"none",color:"var(--violet)"}} onClick={()=>moveTask(t.id, nextStatus[col.key])}>→</button>
                              <button style={{fontSize:".6rem",cursor:"pointer",background:"none",border:"none",color:"var(--rose)"}} onClick={()=>deleteTask(t.id)}>✕</button>
                            </div>
                          </div>
                          {assignee && <div style={{marginTop:6,fontSize:".6875rem",color:"var(--muted)"}}>{assignee.name}</div>}
                        </div>
                      );
                    })}
                    <button className="add-task" onClick={() => setShowModal(true)}>+ Adicionar tarefa</button>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="card">
              {tasks.length === 0 && <div style={{padding:20,color:"var(--muted)",textAlign:"center"}}>Nenhuma tarefa criada</div>}
              {tasks.map((t,i) => (
                <div key={t.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 8px", borderBottom:i<tasks.length-1?"1px solid var(--line)":"none" }}>
                  <span className="priority-dot" style={{ background:t.status==="done"?"var(--emerald)":t.status==="progress"?"var(--amber)":"var(--muted)" }}></span>
                  <div style={{ flex:1,fontSize:"0.875rem",fontWeight:500 }}>{t.title}</div>
                  <span className="tag tag-cyan">{t.status==="todo"?"A fazer":t.status==="progress"?"Em andamento":"Concluída"}</span>
                  {t.due_date && <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{new Date(t.due_date).toLocaleDateString('pt-BR')}</span>}
                  <button className="btn btn-ghost btn-sm" onClick={()=>moveTask(t.id, nextStatus[t.status])}>→</button>
                </div>
              ))}
            </div>
          )}

          {showModal && (
            <div className="modal-overlay" onClick={() => setShowModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{fontFamily:"var(--font-display)",fontSize:"1.25rem",marginBottom:16}}>Nova tarefa</h3>
                <div className="field"><label>Título</label><input type="text" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Ex: Revisar referencial teórico" autoFocus/></div>
                <div className="field"><label>Data de entrega</label><input type="date" value={newDue} onChange={e=>setNewDue(e.target.value)}/></div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button className="btn btn-ghost" onClick={() => setShowModal(false)}>Cancelar</button>
                  <button className="btn btn-violet" onClick={addTask}>Criar tarefa</button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TasksPage/>);
</script>
</body>
</html>
