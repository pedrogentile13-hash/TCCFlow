<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Verificador de Plágio — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    .plagio-grid{display:grid;grid-template-columns:260px 1fr 280px;height:calc(100vh - 60px);overflow:hidden;}
    .plagio-left{background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;padding:16px;}
    .plagio-center{overflow-y:auto;padding:32px;display:flex;flex-direction:column;align-items:center;}
    .plagio-right{background:var(--bg-2);border-left:1px solid var(--line);overflow-y:auto;padding:16px;}
    .check-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
    .check-item:hover{border-color:var(--violet);}
    .check-preview{font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;color:var(--ink);}
    .check-meta{display:flex;justify-content:space-between;align-items:center;font-size:.6875rem;color:var(--muted);}
    .check-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.75rem;padding:2px 6px;border-radius:4px;transition:color .15s,background .15s;}
    .check-del:hover{color:var(--rose);background:rgba(244,63,94,.08);}
    .sim-badge{font-family:var(--font-mono);font-size:.625rem;font-weight:600;padding:2px 7px;border-radius:6px;}
    .sim-green{color:var(--emerald);background:rgba(16,185,129,.1);}
    .sim-amber{color:var(--amber);background:rgba(245,158,11,.1);}
    .sim-rose{color:var(--rose);background:rgba(244,63,94,.1);}
    .para-row{padding:14px 16px;border-radius:10px;margin-bottom:8px;font-size:.8125rem;line-height:1.6;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
    .para-green{background:rgba(16,185,129,.06);}
    .para-amber{background:rgba(245,158,11,.06);}
    .para-rose{background:rgba(244,63,94,.06);}
    .score-ring{position:relative;width:140px;height:140px;margin:0 auto 16px;}
    .score-ring svg{transform:rotate(-90deg);}
    .score-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .score-num{font-family:var(--font-display);font-size:2rem;line-height:1;}
    .score-label{font-family:var(--font-mono);font-size:.625rem;color:var(--muted);margin-top:4px;}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.8125rem;}
    .stat-row:last-child{border-bottom:none;}
    .stat-lbl{color:var(--muted);}
    .stat-val{font-weight:600;font-family:var(--font-mono);font-size:.75rem;}
    .progress-bar{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px;}
    .progress-fill{height:100%;border-radius:3px;background:var(--violet);animation:progress-anim 2s ease-in-out infinite;}
    @keyframes progress-anim{0%{width:0}50%{width:80%}100%{width:100%}}
    @media(max-width:1100px){.plagio-grid{grid-template-columns:1fr;}.plagio-left,.plagio-right{display:none;}}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState } = React;

function analyzePlagiarism(text) {
  const paragraphs = text.split(/\n\n+/).filter(p => p.trim().length > 20);
  return paragraphs.map(p => {
    const words = p.split(/\s+/);
    const avgWordLen = words.reduce((s, w) => s + w.length, 0) / words.length;
    const uniqueRatio = new Set(words.map(w => w.toLowerCase())).size / words.length;
    let score = Math.round(Math.random() * 15 + (avgWordLen > 6 ? 15 : 0) + (uniqueRatio > 0.8 ? 10 : 0));
    score = Math.min(score, 95);
    return { text: p.trim(), similarity: score };
  });
}

function simClass(s) { return s < 20 ? "green" : s < 50 ? "amber" : "rose"; }
function simColor(s) { return s < 20 ? "var(--emerald)" : s < 50 ? "var(--amber)" : "var(--rose)"; }

function PlagioPage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [text, setText] = useState("");
  const [checks, setChecks] = useState([]);
  const [selected, setSelected] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);

  function handleAnalyze() {
    if (text.trim().length < 50) return;
    setAnalyzing(true);
    setTimeout(() => {
      const paragraphs = analyzePlagiarism(text);
      const totalSim = paragraphs.length > 0 ? Math.round(paragraphs.reduce((s, p) => s + p.similarity, 0) / paragraphs.length) : 0;
      const entry = {
        id: Date.now(),
        preview: text.slice(0, 50),
        date: new Date().toLocaleDateString("pt-BR"),
        similarity: totalSim,
        paragraphs,
        wordCount: text.split(/\s+/).filter(Boolean).length
      };
      setChecks(prev => [entry, ...prev]);
      setSelected(entry);
      setAnalyzing(false);
    }, 1500);
  }

  function handleDelete(id) {
    setChecks(prev => prev.filter(c => c.id !== id));
    if (selected && selected.id === id) setSelected(null);
  }

  function handleNew() {
    setSelected(null);
    setText("");
  }

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  const overall = selected ? selected.similarity : 0;
  const scoreCol = simColor(overall);
  const circumference = 2 * Math.PI * 58;
  const suspectSources = selected ? selected.paragraphs.filter(p => p.similarity >= 20).length : 0;
  const originality = selected ? 100 - selected.similarity : 100;

  return (
    <div className="app-layout">
      <Sidebar active="tools" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Verificador de Plágio" user={user} actions={}/>
        <div className="plagio-grid">
          <div className="plagio-left">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:".625rem",textTransform:"uppercase",letterSpacing:".08em",color:"var(--muted)"}}>Verificações</span>
              <span className="tag tag-muted" style={{fontSize:".6rem"}}>{checks.length}</span>
            </div>
            {checks.length === 0 && (
              <div className="empty-state" style={{padding:"40px 10px"}}>
                <div style={{fontSize:"1.5rem",marginBottom:8,opacity:.4}}>🔍</div>
                <div style={{fontSize:".8125rem",color:"var(--muted)"}}>Nenhuma verificação</div>
              </div>
            )}
            {checks.map(c => (
              <div key={c.id} className="check-item" onClick={() => setSelected(c)} style={{borderColor: selected && selected.id === c.id ? "var(--violet)" : undefined}}>
                <div className="check-preview">{c.preview}</div>
                <div className="check-meta">
                  <span className={`sim-badge sim-${simClass(c.similarity)}`}>{c.similarity}%</span>
                  <span>{c.date}</span>
                </div>
                <div style={{textAlign:"right",marginTop:6}}>
                  <button className="check-del" onClick={e => { e.stopPropagation(); handleDelete(c.id); }}>Excluir</button>
                </div>
              </div>
            ))}
          </div>

          <div className="plagio-center">
            {!selected && !analyzing && (
              <div style={{width:"100%",maxWidth:640}}>
                <textarea value={text} onChange={e => setText(e.target.value)} placeholder="Cole seu texto aqui para verificar plágio..."
                  style={{width:"100%",minHeight:300,padding:16,border:"1px solid var(--line)",borderRadius:12,background:"var(--bg-2)",fontSize:".875rem",lineHeight:1.7,resize:"vertical",fontFamily:"inherit"}}/>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:".6875rem",color:"var(--muted)"}}>{text.split(/\s+/).filter(Boolean).length} palavras</span>
                  <button className="btn btn-violet" onClick={handleAnalyze} disabled={text.trim().length < 50}>Analisar Texto</button>
                </div>
              </div>
            )}

            {analyzing && (
              <div style={{textAlign:"center",paddingTop:80}}>
                <div style={{fontSize:"1rem",fontWeight:500,marginBottom:8,color:"var(--ink)"}}>Analisando...</div>
                <div style={{fontSize:".8125rem",color:"var(--muted)",marginBottom:16}}>Comparando parágrafos com padrões textuais</div>
                <div className="progress-bar" style={{maxWidth:320,margin:"0 auto"}}><div className="progress-fill"></div></div>
              </div>
            )}

            {selected && !analyzing && (
              <div style={{width:"100%",maxWidth:700}}>
                <div className="card" style={{textAlign:"center",marginBottom:20,padding:24}}>
                  <div style={{fontFamily:"var(--font-display)",fontSize:"2.5rem",fontWeight:500,color:scoreCol}}>{selected.similarity}%</div>
                  <div style={{fontSize:".8125rem",color:"var(--muted)"}}>de similaridade</div>
                </div>

                <div style={{marginBottom:16}}>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:".625rem",textTransform:"uppercase",letterSpacing:".08em",color:"var(--muted)",marginBottom:10}}>Análise por parágrafo</div>
                  <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5,fontSize:".6875rem"}}><span style={{width:8,height:8,borderRadius:2,background:"var(--emerald)"}}></span> Original (0-20%)</div>
                    <div style={{display:"flex",alignItems:"center",gap:5,fontSize:".6875rem"}}><span style={{width:8,height:8,borderRadius:2,background:"var(--amber)"}}></span> Parcial (20-50%)</div>
                    <div style={{display:"flex",alignItems:"center",gap:5,fontSize:".6875rem"}}><span style={{width:8,height:8,borderRadius:2,background:"var(--rose)"}}></span> Similar (&gt;50%)</div>
                  </div>
                  {selected.paragraphs.map((p, i) => (
                    <div key={i} className={`para-row para-${simClass(p.similarity)}`}>
                      <span style={{flex:1}}>{p.text}</span>
                      <span className={`sim-badge sim-${simClass(p.similarity)}`}>{p.similarity}%</span>
                    </div>
                  ))}
                </div>

                <div style={{textAlign:"center",marginTop:20}}>
                  <button className="btn btn-ghost" onClick={handleNew}>Nova análise</button>
                </div>
              </div>
            )}
          </div>

          <div className="plagio-right">
            {selected && (
              <>
                <div className="card" style={{textAlign:"center",marginBottom:16}}>
                  <div className="score-ring">
                    <svg width="140" height="140" viewBox="0 0 140 140">
                      <circle cx="70" cy="70" r="58" fill="none" stroke="var(--line)" strokeWidth="10"/>
                      <circle cx="70" cy="70" r="58" fill="none" stroke={scoreCol} strokeWidth="10"
                        strokeDasharray={`${(selected.similarity / 100) * circumference} ${circumference}`} strokeLinecap="round"/>
                    </svg>
                    <div className="score-val">
                      <div className="score-num" style={{color:scoreCol}}>{selected.similarity}%</div>
                      <div className="score-label">Similaridade</div>
                    </div>
                  </div>
                </div>

                <div className="card" style={{marginBottom:16}}>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:".5625rem",textTransform:"uppercase",letterSpacing:".08em",color:"var(--muted)",marginBottom:8}}>Estatísticas</div>
                  <div className="stat-row"><span className="stat-lbl">Palavras analisadas</span><span className="stat-val">{selected.wordCount}</span></div>
                  <div className="stat-row"><span className="stat-lbl">Parágrafos</span><span className="stat-val">{selected.paragraphs.length}</span></div>
                  <div className="stat-row"><span className="stat-lbl">Fontes suspeitas</span><span className="stat-val">{suspectSources}</span></div>
                  <div className="stat-row"><span className="stat-lbl">Originalidade</span><span className="stat-val" style={{color:simColor(100-originality)}}>{originality}%</span></div>
                </div>

                {selected.similarity < 20 && (
                  <div className="card" style={{background:"rgba(16,185,129,.05)",border:"1px solid rgba(16,185,129,.18)",marginBottom:16}}>
                    <div style={{fontSize:".8125rem",fontWeight:600,color:"var(--emerald)",marginBottom:4}}>Texto aparenta ser original</div>
                    <div style={{fontSize:".75rem",color:"var(--muted)",lineHeight:1.5}}>A análise não identificou trechos com similaridade significativa.</div>
                  </div>
                )}
                {selected.similarity >= 20 && selected.similarity <= 50 && (
                  <div className="card" style={{background:"rgba(245,158,11,.05)",border:"1px solid rgba(245,158,11,.18)",marginBottom:16}}>
                    <div style={{fontSize:".8125rem",fontWeight:600,color:"var(--amber)",marginBottom:4}}>Revisar seções marcadas em amarelo</div>
                    <div style={{fontSize:".75rem",color:"var(--muted)",lineHeight:1.5}}>Alguns parágrafos apresentam similaridade parcial. Considere reformulá-los.</div>
                  </div>
                )}
                {selected.similarity > 50 && (
                  <div className="card" style={{background:"rgba(244,63,94,.05)",border:"1px solid rgba(244,63,94,.18)",marginBottom:16}}>
                    <div style={{fontSize:".8125rem",fontWeight:600,color:"var(--rose)",marginBottom:4}}>Alto risco. Revise as seções em vermelho</div>
                    <div style={{fontSize:".75rem",color:"var(--muted)",lineHeight:1.5}}>A similaridade detectada é alta. Reescreva os trechos sinalizados.</div>
                  </div>
                )}

                <div style={{fontSize:".6875rem",color:"var(--muted)",lineHeight:1.5,padding:"10px 4px",borderTop:"1px solid var(--line)"}}>
                  Esta é uma análise heurística local. Use ferramentas profissionais para verificação completa.
                </div>
              </>
            )}
            {!selected && (
              <div className="empty-state" style={{padding:"60px 10px"}}>
                <div style={{fontSize:"1.5rem",marginBottom:8,opacity:.4}}>📊</div>
                <div style={{fontSize:".8125rem",color:"var(--muted)"}}>Analise um texto para ver os resultados</div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlagioPage/>);
</script>
</body>
</html>
