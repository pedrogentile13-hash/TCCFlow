<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4278555972399416">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .liquid-bg .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
        .blob-1 { width: 500px; height: 500px; background: rgba(139,92,246,0.12); top: -100px; right: -100px; animation: drift1 25s infinite ease-in-out; }
        .blob-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.10); bottom: -80px; left: -80px; animation: drift2 30s infinite ease-in-out; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-150px,100px) scale(1.1)} 66%{transform:translate(80px,-60px) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(120px,-80px) scale(0.95)} 66%{transform:translate(-60px,60px) scale(1.1)} }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao início
        </a>

        <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                    <i class="fa-solid fa-lock text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold">Nova Senha</h1>
                <p class="text-sm text-slate-500 mt-2">Digite sua nova senha</p>
            </div>

            <!-- Loading Section -->
            <div id="loadingSection" class="text-center py-8">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-violet-600 mb-4"></i>
                <p class="text-sm text-slate-500">Verificando link de recuperação...</p>
            </div>

            <!-- Form Section -->
            <div id="formSection" class="hidden">
                <form id="newPasswordForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">
                            <i class="fa-solid fa-lock mr-1 text-violet-600"></i> Nova senha
                        </label>
                        <input type="password" id="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">
                            <i class="fa-solid fa-lock mr-1 text-violet-600"></i> Confirmar senha
                        </label>
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Repita a nova senha"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                    </div>

                    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                        <i class="fa-solid fa-save mr-2"></i>Salvar nova senha
                    </button>
                </form>
            </div>

            <!-- Success Section -->
            <div id="successSection" class="hidden text-center py-8">
                <div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-check text-green-600 text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800 mb-2">Senha atualizada!</h2>
                <p class="text-sm text-slate-500 mb-6">Sua senha foi alterada com sucesso.</p>
                <a href="login.html"
                    class="inline-flex items-center gap-2 bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3 px-6 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Ir para o Login
                </a>
            </div>

            <!-- Error Section -->
            <div id="errorSection" class="hidden text-center py-8">
                <div class="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-xmark text-red-600 text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800 mb-2">Link inválido ou expirado</h2>
                <p class="text-sm text-slate-500 mb-6">O link de recuperação não é mais válido.</p>
                <a href="recuperar-senha.html"
                    class="inline-flex items-center gap-2 bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3 px-6 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Solicitar novo link
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('formSection').classList.remove('hidden');
                document.getElementById('loadingSection').classList.add('hidden');
            }
        });

        setTimeout(() => {
            if (!auth.currentUser) {
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('errorSection').classList.remove('hidden');
            }
        }, 3000);

        document.getElementById('newPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');

            if (password.length < 6) {
                errorMsg.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                errorMsg.classList.remove('hidden');
                return;
            }
            if (password !== confirm) {
                errorMsg.textContent = 'As senhas não coincidem.';
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Salvando...';

            try {
                const { error } = await _supa.auth.updateUser({ password: password });
                if (error) throw error;
                document.getElementById('formSection').classList.add('hidden');
                document.getElementById('successSection').classList.remove('hidden');
            } catch (err) {
                errorMsg.textContent = err.message || 'Erro ao atualizar senha.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save mr-2"></i>Salvar nova senha';
            }
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
