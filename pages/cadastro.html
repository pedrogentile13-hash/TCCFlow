    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .auth-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: linear-gradient(135deg, #f8f7ff 0%, #f0f4ff 25%, #f5f0ff 50%, #eef8ff 75%, #f8f7ff 100%);
        }
        .auth-bg .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; }
        .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(139,92,246,0.15), transparent 70%); top: -200px; right: -100px; animation: float1 20s infinite ease-in-out; }
        .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(6,182,212,0.12), transparent 70%); bottom: -150px; left: -100px; animation: float2 25s infinite ease-in-out; }
        .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(168,85,247,0.1), transparent 70%); top: 50%; left: 50%; animation: float3 15s infinite ease-in-out; }
        @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-80px,60px) scale(1.1)} }
        @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,-40px) scale(1.05)} }
        @keyframes float3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-45%,-55%) scale(1.15)} }

        .card-glass {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08), 0 0 0 1px rgba(139,92,246,0.05);
        }
        .input-modern {
            background: rgba(248,250,252,0.8);
            border: 1.5px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-modern:focus {
            background: white;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 30%, #06b6d4 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            box-shadow: 0 10px 25px -5px rgba(124,58,237,0.4);
            transform: translateY(-1px);
        }
        .divider-line { background: linear-gradient(90deg, transparent, #e2e8f0, transparent); height: 1px; }
        .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s; }
        .digit-input { transition: all 0.2s; }
        .digit-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); transform: scale(1.05); }
    </style>
</head>
<body class="text-slate-900 min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="relative z-10 w-full max-w-[440px] mx-4 my-8">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 transition-colors mb-6 group">
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            <span>Voltar ao inicio</span>
        </a>

        <div class="card-glass rounded-3xl p-8 sm:p-10">
            <!-- Step 1: Register Form -->
            <div id="step1">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-br from-violet-600 via-purple-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-violet-500/25 -rotate-3 hover:rotate-0 transition-transform duration-300">
                        <i class="fa-solid fa-user-plus text-white text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700">Criar Conta</h1>
                    <p class="text-sm text-slate-500 mt-2">Preencha os dados para comecar</p>
                </div>

                <form id="registerForm" class="space-y-4">
                    <!-- Nome -->
                    <div>
                        <label class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-user text-violet-500 text-xs"></i> Nome Completo
                        </label>
                        <input type="text" id="name" required placeholder="Seu nome completo"
                            class="input-modern w-full rounded-xl px-4 py-3.5 text-sm placeholder-slate-400 focus:outline-none">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-envelope text-violet-500 text-xs"></i> Email
                        </label>
                        <input type="email" id="email" required placeholder="seu@email.com"
                            class="input-modern w-full rounded-xl px-4 py-3.5 text-sm placeholder-slate-400 focus:outline-none">
                    </div>

                    <!-- Senha -->
                    <div>
                        <label class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-lock text-violet-500 text-xs"></i> Senha
                        </label>
                        <div class="relative">
                            <input type="password" id="password" required placeholder="Minimo 6 caracteres" minlength="6"
                                class="input-modern w-full rounded-xl px-4 py-3.5 text-sm placeholder-slate-400 focus:outline-none pr-12"
                                oninput="updateStrength(this.value)">
                            <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-violet-600 transition">
                                <i id="passIcon" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <div class="flex gap-1 mt-2">
                            <div id="str1" class="strength-bar flex-1 bg-slate-200"></div>
                            <div id="str2" class="strength-bar flex-1 bg-slate-200"></div>
                            <div id="str3" class="strength-bar flex-1 bg-slate-200"></div>
                            <div id="str4" class="strength-bar flex-1 bg-slate-200"></div>
                        </div>
                        <p id="strText" class="text-[11px] text-slate-400 mt-1"></p>
                    </div>

                    <!-- Codigo do Projeto -->
                    <div>
                        <label class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-key text-violet-500 text-xs"></i> Codigo do Projeto
                            <span class="text-xs font-normal text-slate-400">(opcional)</span>

                        <input type="text" id="projectCode" placeholder="Ex: TCC-ABCD (deixe vazio para criar novo)"
                            class="input-modern w-full rounded-xl px-4 py-3.5 text-sm placeholder-slate-400 focus:outline-none">
                        <p class="text-[11px] text-slate-400 mt-1.5">Se seu grupo ja tem um projeto, cole o codigo aqui</p>
                    </div>

                    <!-- Termos -->
                    <div class="flex items-start gap-3 bg-slate-50 p-3 rounded-xl">
                        <input type="checkbox" id="acceptTerms" required
                            class="w-4 h-4 mt-0.5 rounded border-slate-300 text-violet-600 focus:ring-violet-500 cursor-pointer shrink-0">
                        <label for="acceptTerms" class="text-xs text-slate-500 leading-relaxed cursor-pointer">
                            Li e concordo com os <a href="termos.html" target="_blank" class="text-violet-600 hover:underline font-semibold">Termos de Servico</a> e a <a href="privacidade.html" target="_blank" class="text-violet-600 hover:underline font-semibold">Politica de Privacidade</a>.
                        </label>
                    </div>

                    <!-- Error / Success -->
                    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                        <span id="errorText"></span>
                    </div>
                    <div id="successMsg" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-600 text-sm rounded-xl px-4 py-3"></div>

                    <!-- Submit -->
                    <button type="submit" id="submitBtn"
                        class="btn-gradient w-full text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 text-[15px]">
                        <i class="fa-solid fa-check"></i>
                        <span>Criar Conta</span>
                    </button>

                    <!-- Divider -->
                    <div class="flex items-center gap-4 my-2">
                        <div class="divider-line flex-1"></div>
                        <span class="text-xs text-slate-400 font-medium">ou</span>
                        <div class="divider-line flex-1"></div>
                    </div>

                    <!-- Google -->
                    <button type="button" id="googleSignupBtn"
                        class="w-full bg-white border-2 border-slate-200 text-slate-700 font-semibold py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-50 hover:border-slate-300 hover:shadow-lg transition-all duration-300 cursor-pointer">
                        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        Criar conta com Google
                    </button>
                </form>

                <p class="text-center text-sm text-slate-500 mt-6">
                    Ja tem conta? <a href="login.html" class="text-violet-600 hover:text-violet-700 font-bold transition-colors">Entrar</a>
                </p>
            </div>

            <!-- Step 2: OTP Verification -->
            <div id="step2" class="hidden">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-emerald-500/25">
                        <i class="fa-solid fa-envelope-circle-check text-white text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700">Confirme seu Email</h1>
                    <p class="text-sm text-slate-500 mt-2">Enviamos um codigo para <span id="sentEmail" class="font-bold text-violet-600"></span></p>
                </div>

                <form id="verifyForm" class="space-y-5">
                    <div class="flex justify-center gap-2">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-11 h-13 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-lg font-bold focus:outline-none" inputmode="numeric" pattern="[0-9]">
                    </div>

                    <div id="errorMsg2" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" id="verifyBtn"
                        class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-emerald-500/25 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i>
                        <span>Confirmar</span>
                    </button>
                </form>

                <div class="flex justify-center mt-4">
                    <button onclick="resendCode()" class="text-sm text-violet-600 hover:text-violet-700 font-semibold transition-colors">Reenviar codigo</button>
                </div>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">&copy; 2025 TCCFlow. Todos os direitos reservados.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (p.type === 'password') { p.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { p.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function updateStrength(val) {
            const bars = [document.getElementById('str1'), document.getElementById('str2'), document.getElementById('str3'), document.getElementById('str4')];
            const text = document.getElementById('strText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/[0-9!@#$%]/.test(val)) score++;

            const colors = ['bg-red-400', 'bg-amber-400', 'bg-cyan-400', 'bg-emerald-400'];
            const labels = ['Fraca', 'Razoavel', 'Boa', 'Forte'];
            bars.forEach((b, i) => {
                b.className = 'strength-bar flex-1 ' + (i < score ? colors[Math.min(score-1, 3)] : 'bg-slate-200');
            });
            text.textContent = val.length > 0 ? labels[Math.min(score-1, 3)] || '' : '';
        }

        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'TCC-';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const projectCode = document.getElementById('projectCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const successMsg = document.getElementById('successMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Criando...</span>';

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: name });

                let projectId = null;

                if (projectCode) {
                    const snap = await db.collection('projects').where('code', '==', projectCode).get();
                    if (snap.empty) throw { message: 'Codigo de projeto nao encontrado: ' + projectCode };
                    projectId = snap.docs[0].id;
                    await db.collection('projects').doc(projectId).update({
                        members: firebase.firestore.FieldValue.arrayUnion(cred.user.uid)
                    });
                } else {
                    const code = generateCode();
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC',
                        code: code,
                        ownerId: cred.user.uid,
                        members: [cred.user.uid],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    projectId = projectRef.id;
                }

                window._pendingSignup = {
                    uid: cred.user.uid,
                    name: name,
                    email: email,
                    projectId: projectId
                };
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.querySelector('.digit-input').focus();
            } catch (err) {
                let msg = 'Erro ao criar conta.';
                if (err.code === 'auth/email-already-in-use') msg = 'Este email ja esta em uso.';
                else if (err.code === 'auth/weak-password') msg = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                else if (err.code === 'permission-denied' || (err.message && err.message.includes('permission'))) msg = 'Erro de permissao no banco de dados.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Criar Conta</span>';
            }
        });

        // ========== Google Signup ==========
        document.getElementById('googleSignupBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorMsg.classList.add('hidden');

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    const code = generateCode();
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC',
                        code: code,
                        ownerId: user.uid,
                        members: [user.uid],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    await db.collection('users').doc(user.uid).set({
                        name: user.displayName || 'Usuario',
                        email: user.email,
                        projectId: projectRef.id,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                window.location.href = 'dashboard.html';
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao criar conta com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Dominio nao autorizado.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.remove('hidden');
            }
        });

        // ========== OTP Verification ==========
        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
            // Support paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                for (let j = 0; j < paste.length && (i + j) < digits.length; j++) {
                    digits[i + j].value = paste[j];
                }
                const next = Math.min(i + paste.length, digits.length - 1);
                digits[next].focus();
            });
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg2 = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                errorMsg2.textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg2.classList.remove('hidden');
                return;
            }

            errorMsg2.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Verificando...</span>';

            try {
                await auth.verifyOtp(window._pendingSignup.email, code);
                const s = window._pendingSignup;
                await db.collection('users').doc(s.uid).set({
                    name: s.name,
                    email: s.email,
                    projectId: s.projectId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg2.textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg2.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Confirmar</span>';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(window._pendingSignup.email);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }
    </script>
