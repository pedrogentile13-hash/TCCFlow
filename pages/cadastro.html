<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WX7MD9CL9"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4278555972399416">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="../js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        :root {
            --violet: #7c3aed;
            --violet-2: #8b5cf6;
            --violet-dk: #6d28d9;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --line-2: #d9d4c4;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --radius-lg: 28px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        }

        [data-theme="dark"] {
            --bg: #0a0818;
            --bg-2: #120f24;
            --paper: #15112a;
            --ink: #f5f3ff;
            --ink-2: #d8d3f0;
            --muted: #9189ad;
            --line: #251f40;
            --line-2: #1e1938;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background .4s, color .4s;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Grid background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .35;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ Nav ============ */
        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid transparent;
            transition: border-color .3s;
        }

        .nav.scrolled { border-bottom-color: var(--line); }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.0625rem;
            letter-spacing: -0.01em;
        }

        .brand img { width: 28px; height: 28px; }

        .brand .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--violet);
            margin-left: 2px;
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: transform .25s cubic-bezier(.2,.9,.3,1.2), background .2s, color .2s, box-shadow .25s;
            white-space: nowrap;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--ink);
            color: var(--bg);
            box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 6px 20px -8px rgba(15,13,30,.35);
        }
        .btn-primary:hover {
            background: var(--violet);
            box-shadow: 0 6px 24px -6px rgba(124,58,237,.5);
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            padding: 10px 16px;
        }
        .btn-ghost:hover { background: var(--bg-2); }

        .btn-active {
            background: var(--bg-2);
            color: var(--violet);
            padding: 10px 16px;
            font-weight: 600;
        }

        /* ============ Main content ============ */
        .auth-main {
            position: relative;
            z-index: 2;
            max-width: 440px;
            margin: 0 auto;
            padding: 120px 32px 60px;
        }

        /* Icon box */
        .icon-box {
            width: 56px;
            height: 56px;
            background: var(--grad);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            margin-bottom: 24px;
        }

        /* Eyebrow */
        .eyebrow {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: currentColor;
            opacity: .5;
        }

        /* Title */
        .auth-title {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 8px;
        }

        .auth-subtitle {
            font-size: 0.9375rem;
            color: var(--ink-2);
            margin: 0;
            line-height: 1.5;
        }

        /* Dashed separator */
        .sep {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 32px 0;
        }

        /* Divider with text */
        .divider-text {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
        }

        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            border-top: 1px dashed var(--line);
        }

        .divider-text span {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: lowercase;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink);
        }

        .form-group label i {
            color: var(--violet);
            font-size: 0.75rem;
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            font-size: 0.9375rem;
            color: var(--ink);
            transition: all .2s;
        }

        .form-group input::placeholder { color: var(--muted); }

        .form-group input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        .form-group.password-group {
            position: relative;
        }

        .form-group.password-group input { padding-right: 44px; }

        .form-helper {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.875rem;
            transition: color .2s;
        }

        .password-toggle:hover { color: var(--violet); }

        /* Strength bars */
        .strength-bars {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bars .bar {
            flex: 1;
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            transition: background .2s;
        }

        .strength-text {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Error message */
        .error-box {
            display: none;
            padding: 14px 18px;
            border-left: 3px solid #ef4444;
            background: rgba(239,68,68,.06);
            color: #dc2626;
            font-size: 0.875rem;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }

        .error-box.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Terms checkbox */
        .form-terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 18px;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.8125rem;
        }

        .form-terms input[type="checkbox"] {
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--violet);
            flex-shrink: 0;
        }

        .form-terms label {
            cursor: pointer;
            color: var(--ink-2);
            line-height: 1.5;
        }

        .form-terms a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .form-terms a:hover { color: var(--violet-2); }

        /* Submit button */
        .btn-submit {
            padding: 16px 24px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(124, 58, 237, .4);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Google button */
        .btn-google {
            padding: 14px 20px;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--ink-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all .2s;
        }

        .btn-google:hover { border-color: var(--violet); color: var(--ink); }
        .btn-google:disabled { opacity: .6; cursor: not-allowed; }
        .btn-google svg { opacity: .4; }

        .btn-google .badge {
            margin-left: auto;
            background: var(--line);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Links */
        .auth-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .auth-link-signup {
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .auth-link-signup a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .auth-link-signup a:hover { color: var(--violet-2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding-top: 48px;
            padding-bottom: 24px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* Steps */
        .step { display: none; }
        .step.active { display: block; }

        /* OTP inputs */
        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 32px 0;
        }

        .digit-input {
            width: 44px;
            height: 56px;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            color: var(--ink);
            font-family: var(--font-mono);
            transition: all .2s;
        }

        .digit-input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        /* Resend code button */
        .btn-resend {
            display: block;
            margin: 16px auto 0;
            color: var(--violet);
            font-size: 0.875rem;
            font-weight: 600;
            transition: color .2s;
        }

        .btn-resend:hover { color: var(--violet-2); }

        /* ============ Responsive ============ */
        @media (max-width: 480px) {
            .auth-main { padding: 100px 16px 40px; }
            .nav-inner { padding: 0 16px; height: 56px; }
            .brand { font-size: 0.9375rem; gap: 8px; }
            .auth-title { font-size: 2.5rem; }
            .otp-inputs { gap: 6px; }
            .digit-input { width: 38px; height: 48px; font-size: 1.25rem; border-radius: 10px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <!-- Sticky Nav -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="../index.html" class="brand">
                <img src="../favicon.png" alt="TCCFlow">
                <span>TCCFlow<span class="dot"></span></span>
            </a>
            <div class="nav-cta">
                <a href="login.html" class="btn btn-ghost">Entrar</a>
                <span class="btn btn-active">Começar grátis</span>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="auth-main">

        <!-- STEP 1: Register -->
        <div class="step active" id="step1">
            <div class="icon-box">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="eyebrow">&middot; Cadastro</div>

            <h1 class="auth-title">Criar conta</h1>
            <p class="auth-subtitle">Preencha os dados abaixo</p>

            <hr class="sep">

            <!-- Error -->
            <div class="error-box" id="errorMsg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <!-- Form -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-user"></i>
                        Nome Completo
                    </label>
                    <input type="text" id="name" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group password-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        Senha
                    </label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required oninput="updateStrength(this.value)">
                    <button type="button" class="password-toggle" onclick="togglePass()">
                        <i id="passIcon" class="fa-solid fa-eye"></i>
                    </button>
                    <div class="strength-bars">
                        <div class="bar" id="str1"></div>
                        <div class="bar" id="str2"></div>
                        <div class="bar" id="str3"></div>
                        <div class="bar" id="str4"></div>
                    </div>
                    <p class="strength-text" id="strText"></p>
                </div>

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-key"></i>
                        Código do Projeto
                    </label>
                    <input type="text" id="projectCode" placeholder="Ex: TCC-ABCD (opcional)">
                    <p class="form-helper">Se seu grupo já tem um projeto, cole o código aqui</p>
                </div>

                <div class="form-terms">
                    <input type="checkbox" id="acceptTerms" required>
                    <label for="acceptTerms">
                        Li e concordo com os <a href="termos.html" target="_blank">Termos de Serviço</a> e a <a href="privacidade.html" target="_blank">Política de Privacidade</a>.
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-check"></i>
                    <span>Criar Conta</span>
                </button>
            </form>

            <!-- Divider with text -->
            <div class="divider-text">
                <span>ou</span>
            </div>

            <!-- Google -->
            <button type="button" id="googleSignupBtn" class="btn-google" disabled>
                <svg width="18" height="18" viewBox="0 0 48 48" style="opacity:.6"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                <span>Criar com Google</span>
                <div class="badge">Em breve</div>
            </button>

            <hr class="sep">

            <!-- Links -->
            <div class="auth-links">
                <div class="auth-link-signup">
                    Já tem conta? <a href="login.html">Entrar</a>
                </div>
            </div>

            <!-- Footer -->
            <div class="auth-footer" id="globalFooter">
                &copy; 2026 TCCFlow
            </div>
        </div>

        <!-- STEP 2: OTP Verification -->
        <div class="step" id="step2">
            <div class="eyebrow">Verificação</div>

            <h1 class="auth-title">Confirme seu Email</h1>
            <p class="auth-subtitle">Enviamos um código para <strong id="sentEmail" style="color: var(--violet);"></strong></p>

            <hr class="sep">

            <!-- Error -->
            <div class="error-box" id="errorMsg2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText2"></span>
            </div>

            <form class="auth-form" id="verifyForm">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                </div>

                <button type="submit" class="btn-submit" id="verifyBtn">
                    <i class="fa-solid fa-check"></i>
                    <span>Confirmar</span>
                </button>
            </form>

            <button type="button" class="btn-resend" onclick="resendCode()">Reenviar código</button>

            <!-- Footer -->
            <div class="auth-footer">
                &copy; 2026 TCCFlow
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (p.type === 'password') { p.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { p.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function updateStrength(val) {
            const bars = ['str1', 'str2', 'str3', 'str4'].map(id => document.getElementById(id));
            const text = document.getElementById('strText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/[0-9!@#$%]/.test(val)) score++;

            const colors = ['bg-red-400', 'bg-amber-400', 'bg-cyan-400', 'bg-emerald-400'];
            const hexColors = ['#f87171', '#fbbf24', '#06b6d4', '#10b981'];
            const labels = ['Fraca', 'Razoavel', 'Boa', 'Forte'];
            bars.forEach((b, i) => {
                b.style.background = i < score ? hexColors[Math.min(score-1, 3)] : 'var(--line)';
            });
            text.textContent = val.length > 0 ? labels[Math.min(score-1, 3)] || '' : '';
        }

        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'TCC-';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = 'student';
            const projectCode = document.getElementById('projectCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Criando...</span>';

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: name });

                let newProjectId = null;

                if (projectCode) {
                    const { data: projects, error: findErr } = await _supa.from('projects').select('*').eq('code', projectCode);
                    if (findErr) throw findErr;
                    if (!projects || projects.length === 0) throw { message: 'Codigo de projeto nao encontrado: ' + projectCode };
                    const proj = projects[0];
                    newProjectId = proj.id;

                    try {
                        const existingMembers = proj.members || [];
                        if (!existingMembers.includes(cred.user.uid)) {
                            await _supa.from('projects').update({ members: [...new Set([...existingMembers, cred.user.uid])] }).eq('id', proj.id);
                        }
                    } catch(e) { console.log('Could not update members:', e); }
                } else {
                    const code = generateCode();
                    const { data: newProj, error: createErr } = await _supa.from('projects').insert({
                        name: 'Meu TCC',
                        code: code,
                        owner_id: cred.user.uid,
                        members: [cred.user.uid],
                        created_at: new Date().toISOString()
                    }).select().maybeSingle();
                    if (createErr) throw createErr;
                    newProjectId = newProj.id;
                }

                window._pendingSignup = {
                    uid: cred.user.uid,
                    name: name,
                    email: email,
                    projectId: newProjectId,
                    role: role
                };
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                document.querySelector('.digit-input').focus();
            } catch (err) {
                let msg = 'Erro ao criar conta.';
                if (err.code === 'auth/email-already-in-use') msg = 'Este email ja esta em uso.';
                else if (err.code === 'auth/weak-password') msg = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                else if (err.code === 'permission-denied' || (err.message && err.message.includes('permission'))) msg = 'Erro de permissao no banco de dados.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Criar Conta</span>';
            }
        });

        document.getElementById('googleSignupBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorMsg.classList.remove('show');

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao criar conta com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Dominio nao autorizado.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
        });

        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                for (let j = 0; j < paste.length && (i + j) < digits.length; j++) {
                    digits[i + j].value = paste[j];
                }
                const next = Math.min(i + paste.length, digits.length - 1);
                digits[next].focus();
            });
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg2 = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                document.getElementById('errorText2').textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg2.classList.add('show');
                return;
            }

            errorMsg2.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Verificando...</span>';

            try {
                await auth.verifyOtp(window._pendingSignup.email, code);
                const s = window._pendingSignup;
                await _supa.from('users').upsert({
                    id: s.uid,
                    name: s.name,
                    email: s.email,
                    project_id: s.projectId,
                    role: s.role,
                    created_at: new Date().toISOString()
                });

                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('errorText2').textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg2.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Confirmar</span>';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(window._pendingSignup.email);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }

        // Nav scroll border
        window.addEventListener('scroll', () => {
            document.querySelector('.nav').classList.toggle('scrolled', window.scrollY > 8);
        });
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
