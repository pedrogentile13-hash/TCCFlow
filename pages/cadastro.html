<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        :root {
            --violet: #7c3aed;
            --violet-2: #8b5cf6;
            --cyan: #06b6d4;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0a0818;
            --bg-2: #120f24;
            --paper: #15112a;
            --ink: #f5f3ff;
            --ink-2: #d8d3f0;
            --muted: #9189ad;
            --line: #251f40;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background .4s, color .4s;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Grid background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .3;
            z-index: 0;
            pointer-events: none;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Main */
        .auth-main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 0;
            z-index: 2;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: var(--shadow);
        }

        @media (max-width: 640px) {
            .auth-card { padding: 32px 24px; }
            .container { padding: 0 16px; }
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 32px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--violet); }
        .back-link i { font-size: 0.75rem; }

        /* Header */
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            background: var(--grad);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .auth-logo img {
            width: 32px;
            height: 32px;
            filter: brightness(0) invert(1);
        }

        .auth-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 400;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .auth-header p {
            font-size: 0.9375rem;
            color: var(--ink-2);
            margin: 0;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--ink);
        }

        .form-group label i {
            color: var(--violet);
            font-size: 0.75rem;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1.5px solid var(--line);
            background: var(--bg-2);
            border-radius: 12px;
            font-size: 0.9375rem;
            color: var(--ink);
            transition: all .2s;
        }

        .form-group input::placeholder { color: var(--muted); }

        .form-group input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.875rem;
            transition: color .2s;
        }

        .password-toggle:hover { color: var(--violet); }

        .form-group.password-group {
            position: relative;
        }

        .form-group.password-group input { padding-right: 40px; }

        /* Error message */
        .error-msg {
            display: none;
            background: rgba(239, 68, 68, .08);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .error-msg.show { display: flex; align-items: center; gap: 10px; }

        /* Success message */
        .success-msg {
            display: none;
            background: rgba(34, 197, 94, .08);
            border: 1px solid rgba(34, 197, 94, .2);
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .success-msg.show { display: flex; align-items: center; gap: 10px; }

        /* Submit button */
        .btn-submit {
            padding: 14px 24px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(124, 58, 237, .4);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--muted);
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }

        /* Google button */
        .btn-google {
            padding: 12px 20px;
            background: var(--bg-2);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--ink-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all .2s;
        }

        .btn-google:hover { border-color: var(--violet); color: var(--ink); }
        .btn-google:disabled { opacity: .6; cursor: not-allowed; }

        .btn-google svg { opacity: .4; }

        .btn-google .badge {
            margin-left: auto;
            background: var(--line);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Terms checkbox */
        .form-terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-2);
            border-radius: 12px;
            font-size: 0.8125rem;
        }

        .form-terms input {
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--violet);
        }

        .form-terms label {
            cursor: pointer;
            color: var(--ink-2);
        }

        .form-terms a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .form-terms a:hover { color: var(--violet-2); }

        /* OTP inputs */
        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 24px 0;
        }

        .digit-input {
            width: 44px;
            height: 56px;
            border: 1.5px solid var(--line);
            background: var(--bg-2);
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            color: var(--ink);
            font-family: var(--font-body);
            transition: all .2s;
        }

        .digit-input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        /* Links */
        .auth-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        .auth-link {
            font-size: 0.875rem;
            color: var(--muted);
            transition: color .2s;
        }

        .auth-link:hover { color: var(--violet); }

        .auth-link strong {
            font-weight: 600;
            color: var(--violet);
        }

        .auth-link-signup {
            text-align: center;
            font-size: 0.875rem;
        }

        .auth-link-signup a {
            color: var(--violet);
            font-weight: 600;
            transition: color .2s;
        }

        .auth-link-signup a:hover { color: var(--violet-2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* Steps */
        .step { display: none; }
        .step.active { display: block; }

        /* Resend code button */
        .btn-resend {
            display: block;
            margin: 16px auto 0;
            color: var(--violet);
            font-size: 0.875rem;
            font-weight: 600;
            transition: color .2s;
        }

        .btn-resend:hover { color: var(--violet-2); }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="auth-main">
        <div class="container">
            <div class="auth-card">
                <!-- Back -->
                <a href="../index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar ao inicio
                </a>

                <!-- STEP 1: Register -->
                <div class="step active" id="step1">
                    <!-- Header -->
                    <div class="auth-header">
                        <div class="auth-logo">
                            <img src="../favicon.png" alt="TCCFlow">
                        </div>
                        <h1>Criar Conta</h1>
                        <p>Junte-se ao TCCFlow e comece seu TCC</p>
                    </div>

                    <!-- Form -->
                    <div class="error-msg" id="errorMsg">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="errorText"></span>
                    </div>

                    <form class="auth-form" id="registerForm">
                        <div class="form-group">
                            <label>
                                <i class="fa-solid fa-user"></i>
                                Nome Completo
                            </label>
                            <input type="text" id="name" placeholder="Seu nome completo" required>
                        </div>

                        <div class="form-group">
                            <label>
                                <i class="fa-solid fa-envelope"></i>
                                Email
                            </label>
                            <input type="email" id="email" placeholder="seu@email.com" required>
                        </div>

                        <div class="form-group password-group">
                            <label>
                                <i class="fa-solid fa-lock"></i>
                                Senha
                            </label>
                            <input type="password" id="password" placeholder="Minimo 6 caracteres" minlength="6" required oninput="updateStrength(this.value)">
                            <button type="button" class="password-toggle" onclick="togglePass()">
                                <i id="passIcon" class="fa-solid fa-eye"></i>
                            </button>
                            <div style="display: flex; gap: 4px; margin-top: 8px;">
                                <div id="str1" style="flex: 1; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                                <div id="str2" style="flex: 1; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                                <div id="str3" style="flex: 1; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                                <div id="str4" style="flex: 1; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                            </div>
                            <p id="strText" style="font-size: 0.75rem; color: var(--muted); margin-top: 4px; margin-bottom: 0;"></p>
                        </div>

                        <div class="form-group">
                            <label>
                                <i class="fa-solid fa-key"></i>
                                Código do Projeto
                            </label>
                            <input type="text" id="projectCode" placeholder="Ex: TCC-ABCD (opcional)">
                            <p style="font-size: 0.75rem; color: var(--muted); margin-top: 4px; margin-bottom: 0;">Se seu grupo já tem um projeto, cole o código aqui</p>
                        </div>

                        <div class="form-terms">
                            <input type="checkbox" id="acceptTerms" required>
                            <label for="acceptTerms">
                                Li e concordo com os <a href="termos.html" target="_blank">Termos de Serviço</a> e a <a href="privacidade.html" target="_blank">Política de Privacidade</a>.
                            </label>
                        </div>

                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fa-solid fa-check"></i>
                            <span>Criar Conta</span>
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="divider">ou</div>

                    <!-- Google -->
                    <button type="button" id="googleSignupBtn" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 48 48" style="opacity:.6"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        <span>Criar com Google</span>
                        <div class="badge">Em breve</div>
                    </button>

                    <!-- Links -->
                    <div class="auth-link-signup" style="margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line);">
                        Já tem conta? <a href="login.html">Entrar</a>
                    </div>
                </div>

                <!-- STEP 2: OTP Verification -->
                <div class="step" id="step2">
                    <div class="auth-header">
                        <div class="auth-logo">
                            <i class="fa-solid fa-check" style="color: white; font-size: 28px;"></i>
                        </div>
                        <h1>Confirme seu Email</h1>
                        <p>Enviamos um código para <strong id="sentEmail" style="color: var(--violet);"></strong></p>
                    </div>

                    <div class="error-msg" id="errorMsg2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="errorText2"></span>
                    </div>

                    <form class="auth-form" id="verifyForm" style="margin-bottom: 0;">
                        <div class="otp-inputs">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                            <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        </div>

                        <button type="submit" class="btn-submit" id="verifyBtn" style="margin-top: 0;">
                            <i class="fa-solid fa-check"></i>
                            <span>Confirmar</span>
                        </button>
                    </form>

                    <button type="button" class="btn-resend" onclick="resendCode()">Reenviar código</button>

                    <div class="auth-footer" style="margin-top: 32px;">
                        &copy; 2026 TCCFlow. Todos os direitos reservados.
                    </div>
                </div>

                <!-- Global Footer -->
                <div class="auth-footer" id="globalFooter">
                    &copy; 2026 TCCFlow. Todos os direitos reservados.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (p.type === 'password') { p.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { p.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function updateStrength(val) {
            const bars = ['str1', 'str2', 'str3', 'str4'].map(id => document.getElementById(id));
            const text = document.getElementById('strText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/[0-9!@#$%]/.test(val)) score++;

            const colors = ['bg-red-400', 'bg-amber-400', 'bg-cyan-400', 'bg-emerald-400'];
            const hexColors = ['#f87171', '#fbbf24', '#06b6d4', '#10b981'];
            const labels = ['Fraca', 'Razoavel', 'Boa', 'Forte'];
            bars.forEach((b, i) => {
                b.style.background = i < score ? hexColors[Math.min(score-1, 3)] : '#e2e8f0';
            });
            text.textContent = val.length > 0 ? labels[Math.min(score-1, 3)] || '' : '';
        }

        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'TCC-';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = 'student';
            const projectCode = document.getElementById('projectCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Criando...</span>';

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: name });

                let newProjectId = null;

                if (projectCode) {
                    const { data: projects, error: findErr } = await _supa.from('projects').select('*').eq('code', projectCode);
                    if (findErr) throw findErr;
                    if (!projects || projects.length === 0) throw { message: 'Codigo de projeto nao encontrado: ' + projectCode };
                    const proj = projects[0];
                    newProjectId = proj.id;

                    try {
                        const existingMembers = proj.members || [];
                        if (!existingMembers.includes(cred.user.uid)) {
                            await _supa.from('projects').update({ members: [...new Set([...existingMembers, cred.user.uid])] }).eq('id', proj.id);
                        }
                    } catch(e) { console.log('Could not update members:', e); }
                } else {
                    const code = generateCode();
                    const { data: newProj, error: createErr } = await _supa.from('projects').insert({
                        name: 'Meu TCC',
                        code: code,
                        owner_id: cred.user.uid,
                        members: [cred.user.uid],
                        created_at: new Date().toISOString()
                    }).select().maybeSingle();
                    if (createErr) throw createErr;
                    newProjectId = newProj.id;
                }

                window._pendingSignup = {
                    uid: cred.user.uid,
                    name: name,
                    email: email,
                    projectId: newProjectId,
                    role: role
                };
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                document.getElementById('globalFooter').style.display = 'none';
                document.querySelector('.digit-input').focus();
            } catch (err) {
                let msg = 'Erro ao criar conta.';
                if (err.code === 'auth/email-already-in-use') msg = 'Este email ja esta em uso.';
                else if (err.code === 'auth/weak-password') msg = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                else if (err.code === 'permission-denied' || (err.message && err.message.includes('permission'))) msg = 'Erro de permissao no banco de dados.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Criar Conta</span>';
            }
        });

        document.getElementById('googleSignupBtn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorMsg.classList.remove('show');

            try {
                if (!document.getElementById('acceptTerms').checked) {
                    throw { message: 'Voce precisa aceitar os Termos de Servico e a Politica de Privacidade.' };
                }
                if (!isFirebaseConfigured()) throw { message: 'Supabase nao configurado.' };

                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user') return;
                let msg = 'Erro ao criar conta com Google.';
                if (err.code === 'auth/unauthorized-domain') msg = 'Dominio nao autorizado.';
                else if (err.message) msg = err.message;
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
        });

        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                for (let j = 0; j < paste.length && (i + j) < digits.length; j++) {
                    digits[i + j].value = paste[j];
                }
                const next = Math.min(i + paste.length, digits.length - 1);
                digits[next].focus();
            });
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg2 = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                document.getElementById('errorText2').textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg2.classList.add('show');
                return;
            }

            errorMsg2.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Verificando...</span>';

            try {
                await auth.verifyOtp(window._pendingSignup.email, code);
                const s = window._pendingSignup;
                await _supa.from('users').upsert({
                    id: s.uid,
                    name: s.name,
                    email: s.email,
                    project_id: s.projectId,
                    role: s.role,
                    created_at: new Date().toISOString()
                });

                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('errorText2').textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg2.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Confirmar</span>';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(window._pendingSignup.email);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
