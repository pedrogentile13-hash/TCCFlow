<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TCCFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="absolute w-[500px] h-[500px] bg-violet-500 rounded-full filter blur-[140px] opacity-10 -top-40 -left-40 pointer-events-none"></div>
    <div class="absolute w-[500px] h-[500px] bg-cyan-500 rounded-full filter blur-[140px] opacity-10 -bottom-40 -right-40 pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao inicio
        </a>

        <div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50 dark:shadow-none">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                    <i class="fa-solid fa-user-plus text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold">Criar Conta</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Preencha os dados para comecar</p>
            </div>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-user mr-1 text-violet-600 dark:text-violet-400"></i> Nome Completo
                    </label>
                    <input type="text" id="name" required placeholder="Seu nome completo"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-envelope mr-1 text-violet-600 dark:text-violet-400"></i> Email
                    </label>
                    <input type="email" id="email" required placeholder="seu@email.com"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-lock mr-1 text-violet-600 dark:text-violet-400"></i> Senha
                    </label>
                    <input type="password" id="password" required placeholder="Minimo 6 caracteres" minlength="6"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                        <i class="fa-solid fa-key mr-1 text-violet-600 dark:text-violet-400"></i> Codigo do Projeto (opcional)
                    </label>
                    <input type="text" id="projectCode" placeholder="Ex: TCC-ABCD (deixe vazio para criar novo)"
                        class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                    <p class="text-xs text-slate-400 mt-1">Se seu grupo ja tem um projeto, cole o codigo aqui para entrar</p>
                </div>

                <div id="errorMsg" class="hidden bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-sm rounded-xl px-4 py-3"></div>
                <div id="successMsg" class="hidden bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-sm rounded-xl px-4 py-3"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                    <i class="fa-solid fa-check mr-2"></i>Criar Conta
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Ja tem conta? <a href="login.html" class="text-violet-600 dark:text-violet-400 hover:underline font-medium">Entrar</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'TCC-';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const projectCode = document.getElementById('projectCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Criando...';

            try {
                if (!isFirebaseConfigured()) throw { message: 'Firebase nao configurado. Edite js/firebase-init.js' };

                console.log('[TCCFlow] Passo 1: Criando usuario no Auth...');
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                console.log('[TCCFlow] Passo 1 OK - UID:', cred.user.uid);

                await cred.user.updateProfile({ displayName: name });
                console.log('[TCCFlow] Passo 2: Nome atualizado');

                let projectId = null;

                if (projectCode) {
                    console.log('[TCCFlow] Passo 3: Buscando projeto com codigo:', projectCode);
                    const snap = await db.collection('projects').where('code', '==', projectCode).get();
                    if (snap.empty) {
                        throw { message: 'Codigo de projeto nao encontrado: ' + projectCode };
                    }
                    projectId = snap.docs[0].id;
                    await db.collection('projects').doc(projectId).update({
                        members: firebase.firestore.FieldValue.arrayUnion(cred.user.uid)
                    });
                    console.log('[TCCFlow] Passo 3 OK - Entrou no projeto:', projectId);
                } else {
                    console.log('[TCCFlow] Passo 3: Criando novo projeto...');
                    const code = generateCode();
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC',
                        code: code,
                        ownerId: cred.user.uid,
                        members: [cred.user.uid],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    projectId = projectRef.id;
                    console.log('[TCCFlow] Passo 3 OK - Projeto criado:', projectId, 'Codigo:', code);
                }

                console.log('[TCCFlow] Passo 4: Salvando perfil no Firestore...');
                await db.collection('users').doc(cred.user.uid).set({
                    name: name,
                    email: email,
                    projectId: projectId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('[TCCFlow] Passo 4 OK - Perfil salvo!');

                successMsg.textContent = 'Conta criada com sucesso! Codigo do projeto gerado. Redirecionando...';
                successMsg.classList.remove('hidden');

                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            } catch (err) {
                console.error('[TCCFlow] ERRO:', err);
                let msg = 'Erro ao criar conta.';
                if (err.code === 'auth/email-already-in-use') msg = 'Este email ja esta em uso.';
                else if (err.code === 'auth/weak-password') msg = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                else if (err.code === 'permission-denied' || (err.message && err.message.includes('permission'))) msg = 'Erro de permissao no Firestore. Verifique as Security Rules no Firebase Console.';
                else if (err.code === 'not-found' || (err.message && err.message.includes('NOT_FOUND'))) msg = 'Firestore Database nao encontrado. Crie o banco no Firebase Console.';
                else if (err.message) msg = err.message;
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Criar Conta';
            }
        });
    </script>
</body>
</html>
