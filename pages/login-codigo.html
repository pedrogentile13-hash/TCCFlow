    <link rel="stylesheet" href="../css/dark.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --violet: #7c3aed;
            --cyan: #06b6d4;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Grid background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .3;
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 32px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--violet); }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--grad);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .logo-icon i { color: #fff; font-size: 1.25rem; }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--muted);
        }
        .card-subtitle .highlight {
            font-weight: 500;
            color: var(--violet);
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--ink-2);
            margin-bottom: 8px;
        }
        .form-label i { margin-right: 4px; color: var(--violet); }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--line);
            background: var(--bg-2);
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 0.875rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: var(--muted); }
        .form-input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(124,58,237,.12);
        }

        .error-msg {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.2);
            color: #dc2626;
            font-size: 0.875rem;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .error-msg.show { display: flex; }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 24px;
            background: var(--grad);
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -6px rgba(124,58,237,.35);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .form-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }
        .form-footer a {
            font-size: 0.875rem;
            color: var(--violet);
            text-decoration: none;
            font-weight: 500;
        }
        .form-footer a:hover { text-decoration: underline; }
        .form-footer .secondary-link {
            color: var(--muted);
            font-weight: 400;
            transition: color 0.2s;
        }
        .form-footer .secondary-link:hover {
            color: var(--violet);
            text-decoration: none;
        }

        /* OTP digit inputs */
        .otp-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .digit-input {
            width: 44px;
            height: 56px;
            background: var(--bg-2);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            text-align: center;
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .digit-input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(124,58,237,.12);
        }

        .hidden { display: none; }

        .page-footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="page-wrapper">
        <a href="../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao inicio
        </a>

        <div class="card">

            <!-- Step 1: Email Input -->
            <div id="step1">
                <div class="card-header">
                    <div class="logo-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <h1 class="card-title">Entrar com Codigo</h1>
                    <p class="card-subtitle">Enviaremos um codigo de acesso para seu email</p>
                </div>

                <form id="emailForm">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fa-solid fa-envelope"></i> Email
                        </label>
                        <input type="email" id="email" required placeholder="seu@email.com" class="form-input">
                    </div>

                    <div id="errorMsg" class="error-msg"></div>

                    <button type="submit" id="submitBtn" class="btn-primary">
                        <i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>Enviar codigo
                    </button>
                </form>

                <div class="form-footer">
                    <a href="login.html"><i class="fa-solid fa-lock" style="margin-right:4px"></i>Entrar com senha</a>
                </div>
            </div>

            <!-- Step 2: Code Verification -->
            <div id="step2" class="hidden">
                <div class="card-header">
                    <div class="logo-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h1 class="card-title">Digite o Codigo</h1>
                    <p class="card-subtitle">Enviamos um codigo para <span id="sentEmail" class="highlight"></span></p>
                </div>

                <form id="verifyForm">
                    <div class="otp-row">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    </div>

                    <div id="errorMsg2" class="error-msg"></div>

                    <button type="submit" id="verifyBtn" class="btn-primary">
                        <i class="fa-solid fa-check" style="margin-right:8px"></i>Verificar
                    </button>
                </form>

                <div class="form-footer">
                    <a href="javascript:void(0)" onclick="resendCode()"><i class="fa-solid fa-rotate-right" style="margin-right:4px"></i>Reenviar codigo</a>
                    <a href="javascript:void(0)" onclick="backToEmail()" class="secondary-link">Usar outro email</a>
                </div>
            </div>

        </div>

        <div class="page-footer">&copy; 2025 TCCFlow. Todos os direitos reservados.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        let currentEmail = '';

        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>Enviando...';

            try {
                await auth.sendOtp(email);
                currentEmail = email;
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.querySelector('#step2 input').focus();
            } catch (err) {
                errorMsg.textContent = err.message || 'Erro ao enviar codigo.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>Enviar codigo';
            }
        });

        // Auto-advance digit inputs
        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                errorMsg.textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>Verificando...';

            try {
                const result = await auth.verifyOtp(currentEmail, code);
                // Auto-create user doc if new
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    const projCode = 'TCC-' + Array.from({length: 4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC', code: projCode, ownerId: result.user.uid,
                        members: [result.user.uid], createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await db.collection('users').doc(result.user.uid).set({
                        name: result.user.displayName || 'Usuario', email: currentEmail,
                        projectId: projectRef.id, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check" style="margin-right:8px"></i>Verificar';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(currentEmail);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }

        function backToEmail() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>Enviar codigo';
        }
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
