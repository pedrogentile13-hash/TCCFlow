<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4278555972399416" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4278555972399416">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar com Codigo - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="../js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        :root {
            --violet: #7c3aed;
            --violet-2: #8b5cf6;
            --violet-dk: #6d28d9;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --bg: #fafaf7;
            --bg-2: #f3f2ec;
            --paper: #ffffff;
            --ink: #0f0d1e;
            --ink-2: #2a2540;
            --muted: #6b6480;
            --line: #e7e3d8;
            --line-2: #d9d4c4;
            --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            --radius: 18px;
            --radius-lg: 28px;
            --shadow: 0 10px 30px -12px rgba(15,13,30,.12), 0 4px 12px -6px rgba(15,13,30,.08);
            --font-display: "Instrument Serif", Georgia, serif;
            --font-body: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        }

        [data-theme="dark"] {
            --bg: #0a0818;
            --bg-2: #120f24;
            --paper: #15112a;
            --ink: #f5f3ff;
            --ink-2: #d8d3f0;
            --muted: #9189ad;
            --line: #251f40;
            --line-2: #1e1938;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background .4s, color .4s;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Grid background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 72px 72px;
            opacity: .35;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ Nav ============ */
        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid transparent;
            transition: border-color .3s;
        }

        .nav.scrolled { border-bottom-color: var(--line); }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.0625rem;
            letter-spacing: -0.01em;
        }

        .brand img { width: 28px; height: 28px; }

        .brand .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--violet);
            margin-left: 2px;
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: transform .25s cubic-bezier(.2,.9,.3,1.2), background .2s, color .2s, box-shadow .25s;
            white-space: nowrap;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--ink);
            color: var(--bg);
            box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 6px 20px -8px rgba(15,13,30,.35);
        }
        .btn-primary:hover {
            background: var(--violet);
            box-shadow: 0 6px 24px -6px rgba(124,58,237,.5);
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            padding: 10px 16px;
        }
        .btn-ghost:hover { background: var(--bg-2); }

        .btn-active {
            background: var(--bg-2);
            color: var(--violet);
            padding: 10px 16px;
            font-weight: 600;
        }

        /* ============ Main content ============ */
        .auth-main {
            position: relative;
            z-index: 2;
            max-width: 440px;
            margin: 0 auto;
            padding: 120px 32px 60px;
        }

        /* Icon box */
        .icon-box {
            width: 56px;
            height: 56px;
            background: var(--grad);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            margin-bottom: 24px;
        }

        /* Eyebrow */
        .eyebrow {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: currentColor;
            opacity: .5;
        }

        /* Title */
        .auth-title {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 8px;
        }

        .auth-subtitle {
            font-size: 0.9375rem;
            color: var(--ink-2);
            margin: 0;
            line-height: 1.5;
        }

        .auth-subtitle .highlight {
            font-weight: 500;
            color: var(--violet);
        }

        /* Dashed separator */
        .sep {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 32px 0;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink);
        }

        .form-group label i {
            color: var(--violet);
            font-size: 0.75rem;
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            font-size: 0.9375rem;
            color: var(--ink);
            transition: all .2s;
        }

        .form-group input::placeholder { color: var(--muted); }

        .form-group input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        /* Error message */
        .error-box {
            display: none;
            padding: 14px 18px;
            border-left: 3px solid #ef4444;
            background: rgba(239,68,68,.06);
            color: #dc2626;
            font-size: 0.875rem;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }

        .error-box.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Submit button */
        .btn-submit {
            padding: 16px 24px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(124, 58, 237, .4);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* OTP digit inputs */
        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 32px 0;
        }

        .digit-input {
            width: 44px;
            height: 56px;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            color: var(--ink);
            font-family: var(--font-mono);
            transition: all .2s;
        }

        .digit-input:focus {
            outline: none;
            background: var(--paper);
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, .08);
        }

        /* Resend code button */
        .btn-resend {
            display: block;
            margin: 16px auto 0;
            color: var(--violet);
            font-size: 0.875rem;
            font-weight: 600;
            transition: color .2s;
        }

        .btn-resend:hover { color: var(--violet-2); }

        .btn-secondary {
            color: var(--muted);
            font-weight: 400;
        }

        .btn-secondary:hover {
            color: var(--violet);
        }

        /* Links */
        .auth-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .auth-link {
            font-size: 0.875rem;
            color: var(--violet);
            transition: color .2s;
        }

        .auth-link:hover { color: var(--violet-2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding-top: 48px;
            padding-bottom: 24px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* Steps */
        .step { display: none; }
        .step.active { display: block; }

        /* ============ Responsive ============ */
        @media (max-width: 480px) {
            .auth-main { padding: 100px 16px 40px; }
            .nav-inner { padding: 0 16px; height: 56px; }
            .brand { font-size: 0.9375rem; gap: 8px; }
            .auth-title { font-size: 2.5rem; }
            .otp-inputs { gap: 6px; }
            .digit-input { width: 38px; height: 48px; font-size: 1.25rem; border-radius: 10px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <!-- Sticky Nav -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="../index.html" class="brand">
                <img src="../favicon.png" alt="TCCFlow">
                <span>TCCFlow<span class="dot"></span></span>
            </a>
            <div class="nav-cta">
                <a href="login.html" class="btn btn-ghost">Entrar com senha</a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="auth-main">

        <!-- STEP 1: Email Input -->
        <div class="step active" id="step1">
            <div class="icon-box">
                <i class="fa-solid fa-key"></i>
            </div>

            <div class="eyebrow">&middot; Verificação</div>

            <h1 class="auth-title">Entrar com código</h1>
            <p class="auth-subtitle">Insira seu email e código</p>

            <hr class="sep">

            <!-- Error -->
            <div class="error-box" id="errorMsg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <!-- Form -->
            <form class="auth-form" id="emailForm">
                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Enviar código</span>
                </button>
            </form>

            <hr class="sep">

            <!-- Links -->
            <div class="auth-links">
                <a href="login.html" class="auth-link">
                    <i class="fa-solid fa-lock" style="margin-right: 4px;"></i>
                    Entrar com senha
                </a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                &copy; 2026 TCCFlow
            </div>
        </div>

        <!-- STEP 2: Code Verification -->
        <div class="step" id="step2">
            <div class="icon-box">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div class="eyebrow">&middot; Verificação</div>

            <h1 class="auth-title">Digite o código</h1>
            <p class="auth-subtitle">Enviamos um código para <strong id="sentEmail" style="color: var(--violet);"></strong></p>

            <hr class="sep">

            <!-- Error -->
            <div class="error-box" id="errorMsg2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText2"></span>
            </div>

            <form class="auth-form" id="verifyForm">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" class="digit-input" inputmode="numeric" pattern="[0-9]">
                </div>

                <button type="submit" class="btn-submit" id="verifyBtn">
                    <i class="fa-solid fa-check"></i>
                    <span>Verificar</span>
                </button>
            </form>

            <button type="button" class="btn-resend" onclick="resendCode()">Reenviar código</button>

            <hr class="sep">

            <div class="auth-links">
                <a href="javascript:void(0)" onclick="backToEmail()" class="auth-link btn-secondary">Usar outro email</a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                &copy; 2026 TCCFlow
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        let currentEmail = '';

        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>Enviando...';

            try {
                await auth.sendOtp(email);
                currentEmail = email;
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.querySelector('#step2 input').focus();
            } catch (err) {
                errorMsg.textContent = err.message || 'Erro ao enviar codigo.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>Enviar codigo';
            }
        });

        // Auto-advance digit inputs
        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
        });

        // Paste support for OTP
        digits[0].addEventListener('paste', (e) => {
            e.preventDefault();
            const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (paste.length === digits.length && /^\d+$/.test(paste)) {
                digits.forEach((input, i) => { input.value = paste[i]; });
                digits[digits.length - 1].focus();
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                errorMsg.textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>Verificando...';

            try {
                const result = await auth.verifyOtp(currentEmail, code);
                // Auto-create user doc if new
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    const projCode = 'TCC-' + Array.from({length: 4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC', code: projCode, ownerId: result.user.uid,
                        members: [result.user.uid], createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await db.collection('users').doc(result.user.uid).set({
                        name: result.user.displayName || 'Usuario', email: currentEmail,
                        projectId: projectRef.id, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check" style="margin-right:8px"></i>Verificar';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(currentEmail);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }

        function backToEmail() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>Enviar codigo';
        }
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
