<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar com Codigo - TCCFlow</title>
    <script src="../js/darkmode.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dark.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .liquid-bg .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
        .blob-1 { width: 500px; height: 500px; background: rgba(139,92,246,0.12); top: -100px; right: -100px; animation: drift1 25s infinite ease-in-out; }
        .blob-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.10); bottom: -80px; left: -80px; animation: drift2 30s infinite ease-in-out; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-150px,100px) scale(1.1)} 66%{transform:translate(80px,-60px) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(120px,-80px) scale(0.95)} 66%{transform:translate(-60px,60px) scale(1.1)} }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased flex items-center justify-center relative overflow-hidden">

    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-violet-600 transition mb-8">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao inicio
        </a>

        <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/50">

            <!-- Step 1: Email Input -->
            <div id="step1">
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-envelope text-white text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Entrar com Codigo</h1>
                    <p class="text-sm text-slate-500 mt-2">Enviaremos um codigo de acesso para seu email</p>
                </div>

                <form id="emailForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">
                            <i class="fa-solid fa-envelope mr-1 text-violet-600"></i> Email
                        </label>
                        <input type="email" id="email" required placeholder="seu@email.com"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
                    </div>

                    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                        <i class="fa-solid fa-paper-plane mr-2"></i>Enviar codigo
                    </button>
                </form>

                <div class="flex flex-col items-center gap-2 mt-6">
                    <a href="login.html" class="text-sm text-violet-600 hover:underline font-medium"><i class="fa-solid fa-lock mr-1"></i>Entrar com senha</a>
                </div>
            </div>

            <!-- Step 2: Code Verification -->
            <div id="step2" class="hidden">
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-gradient-to-br from-violet-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-shield-halved text-white text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Digite o Codigo</h1>
                    <p class="text-sm text-slate-500 mt-2">Enviamos um codigo para <span id="sentEmail" class="font-medium text-violet-600"></span></p>
                </div>

                <form id="verifyForm" class="space-y-5">
                    <div class="flex justify-center gap-1.5">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                        <input type="text" maxlength="1" class="digit-input w-10 h-12 bg-slate-50 border border-slate-200 rounded-lg text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition" inputmode="numeric" pattern="[0-9]">
                    </div>

                    <div id="errorMsg2" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" id="verifyBtn"
                        class="w-full bg-gradient-to-r from-violet-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl transition hover:shadow-lg hover:shadow-violet-500/25">
                        <i class="fa-solid fa-check mr-2"></i>Verificar
                    </button>
                </form>

                <div class="flex flex-col items-center gap-2 mt-6">
                    <a href="javascript:void(0)" onclick="resendCode()" class="text-sm text-violet-600 hover:underline font-medium"><i class="fa-solid fa-rotate-right mr-1"></i>Reenviar codigo</a>
                    <a href="javascript:void(0)" onclick="backToEmail()" class="text-sm text-slate-400 hover:text-violet-600 transition">Usar outro email</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });

        let currentEmail = '';

        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Enviando...';

            try {
                await auth.sendOtp(email);
                currentEmail = email;
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.querySelector('#step2 input').focus();
            } catch (err) {
                errorMsg.textContent = err.message || 'Erro ao enviar codigo.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Enviar codigo';
            }
        });

        // Auto-advance digit inputs
        const digits = document.querySelectorAll('.digit-input');
        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) digits[i - 1].focus();
            });
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = Array.from(digits).map(d => d.value).join('');
            const errorMsg = document.getElementById('errorMsg2');
            const btn = document.getElementById('verifyBtn');

            if (code.length < 8) {
                errorMsg.textContent = 'Digite o codigo completo de 8 digitos.';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Verificando...';

            try {
                const result = await auth.verifyOtp(currentEmail, code);
                // Auto-create user doc if new
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    const projCode = 'TCC-' + Array.from({length: 4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
                    const projectRef = await db.collection('projects').add({
                        name: 'Meu TCC', code: projCode, ownerId: result.user.uid,
                        members: [result.user.uid], createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await db.collection('users').doc(result.user.uid).set({
                        name: result.user.displayName || 'Usuário', email: currentEmail,
                        projectId: projectRef.id, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = 'Codigo invalido ou expirado. Tente novamente.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Verificar';
            }
        });

        async function resendCode() {
            try {
                await auth.sendOtp(currentEmail);
                alert('Novo codigo enviado!');
            } catch (err) {
                alert('Erro ao reenviar: ' + (err.message || 'Tente novamente'));
            }
        }

        function backToEmail() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Enviar codigo';
        }
    </script>
    <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
