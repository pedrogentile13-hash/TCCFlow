<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Pagamento Confirmado — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
</head>
<body><div id="root"><div class="app-splash"><div class="splash-logo"><img src="../assets/logo.png" alt=""/></div><div class="splash-name">TCC<em>Flow</em></div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function PagamentoSucesso() {
  const [status, setStatus] = useState('loading');
  const [message, setMessage] = useState('Processando seu pagamento...');

  useEffect(() => {
    setTimeout(() => {
      setStatus('success');
      setMessage('Parabéns! Seu pagamento foi confirmado.');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 3000);
    }, 2000);
  }, []);

  return (
    <div style={{
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      height: '100vh',
      background: 'var(--paper)',
      flexDirection: 'column',
      gap: 24,
      padding: 20
    }}>
      {status === 'loading' ? (
        <>
          <div style={{
            width: 60,
            height: 60,
            border: '4px solid var(--line)',
            borderTop: '4px solid var(--violet)',
            borderRadius: '50%',
            animation: 'spin 1s linear infinite'
          }}></div>
          <p style={{ color: 'var(--muted)', fontSize: '1rem' }}>
            {message}
          </p>
        </>
      ) : (
        <>
          <div style={{
            width: 80,
            height: 80,
            background: 'var(--emerald)',
            borderRadius: '50%',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            color: 'white',
            fontSize: '2.5rem'
          }}>
            ✓
          </div>
          <h1 style={{
            fontFamily: 'var(--font-display)',
            fontSize: '2rem',
            fontWeight: 400,
            color: 'var(--ink)',
            margin: 0,
            textAlign: 'center'
          }}>
            {message}
          </h1>
          <p style={{
            color: 'var(--muted)',
            fontSize: '0.9375rem',
            textAlign: 'center',
            maxWidth: '40ch'
          }}>
            Você será redirecionado para o dashboard em alguns segundos...
          </p>
          <a href="dashboard.html" className="btn btn-primary" style={{ marginTop: 24 }}>
            Ir para Dashboard
          </a>
        </>
      )}

      <style>{`
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PagamentoSucesso/>);
</script>
</body>
</html>
