<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Configurações — Painel do Orientador</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    body,html,#root{width:100%;height:100%;margin:0;padding:0}
    .ori-layout{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden;width:100%}
    .ori-sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0;overflow:hidden;height:100vh;width:240px}
    .ori-sidebar-header{padding:20px 16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
    .ori-sidebar-logo{width:36px;height:36px;border-radius:10px}
    .ori-sidebar-brand{font-family:var(--font-display);font-size:1.15rem;color:var(--ink)}
    .ori-sidebar-brand span{color:var(--emerald)}
    .ori-sidebar-badge{font-family:var(--font-mono);font-size:.55rem;background:var(--emerald);color:#fff;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.08em}
    .ori-nav{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
    .ori-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85rem;color:var(--muted);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--font-body)}
    .ori-nav-item:hover{background:var(--line);color:var(--ink)}
    .ori-nav-item.active{background:var(--emerald);color:#fff;font-weight:600}
    .ori-nav-item i{width:18px;text-align:center;font-size:.8rem}
    .ori-nav-divider{height:1px;background:var(--line);margin:8px 4px}
    .ori-sidebar-footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
    .ori-sidebar-footer .avatar{width:32px;height:32px;border-radius:50%;background:var(--emerald);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
    .ori-sidebar-footer .user-info{flex:1;min-width:0}
    .ori-sidebar-footer .user-name{font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ori-sidebar-footer .user-role{font-size:.65rem;color:var(--muted);font-family:var(--font-mono)}
    .ori-main{overflow-y:auto;padding:0;background:var(--paper)}
    .ori-topbar{padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:10}
    .ori-topbar h1{font-family:var(--font-display);font-size:1.4rem;color:var(--ink)}
    .ori-topbar-actions{display:flex;align-items:center;gap:8px}
    .ori-content{padding:28px;max-width:1200px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .card-title{font-family:var(--font-display);font-size:1.1rem;color:var(--ink);margin-bottom:16px}
    .tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.65rem;padding:3px 8px;border-radius:6px;font-weight:600}
    .tag-emerald{background:color-mix(in srgb,var(--emerald) 15%,transparent);color:var(--emerald)}
    .tag-muted{background:var(--bg-2);color:var(--muted)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:all .15s;font-family:var(--font-body)}
    .btn:hover{border-color:var(--muted)}
    .btn-emerald{background:var(--emerald);color:#fff;border-color:var(--emerald)}
    .btn-emerald:hover{opacity:.9;border-color:var(--emerald)}
    .btn-sm{padding:5px 10px;font-size:.72rem}
    .btn-ghost{background:transparent;border-color:transparent}
    .btn-ghost:hover{background:var(--bg-2)}
    .btn-rose{background:var(--rose);color:#fff;border-color:var(--rose)}
    .btn-rose:hover{opacity:.9;border-color:var(--rose)}
    .field{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:.85rem;background:var(--paper);color:var(--ink);font-family:var(--font-body);outline:none;transition:border .15s}
    .field:focus{border-color:var(--emerald)}
    .field-label{font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;display:block}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
    .settings-row:last-child{border-bottom:none}
    .settings-row .row-info{flex:1}
    .settings-row .row-label{font-weight:500;font-size:.9rem;margin-bottom:2px}
    .settings-row .row-desc{font-size:.8rem;color:var(--muted)}
    .toggle-switch{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
    .toggle-switch.on{background:var(--emerald)}
    .toggle-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .25s}
    .toggle-switch.on::after{transform:translateX(18px)}
    .avatar-upload{position:relative;cursor:pointer;display:inline-block}
    .avatar-upload:hover .avatar-overlay{opacity:1}
    .avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;color:white;font-size:.6rem;font-weight:600}
    .avatar-img{width:64px;height:64px;border-radius:50%;object-fit:cover}
    .section-title{font-family:var(--font-display);font-size:1.3rem;font-weight:400;margin-bottom:4px}
    .section-sub{font-size:.85rem;color:var(--muted);margin-bottom:20px}
    .delete-zone{background:rgba(244,63,94,.04);border:1.5px solid rgba(244,63,94,.2);border-radius:var(--radius);padding:20px}
    @media(max-width:768px){
      .ori-layout{grid-template-columns:1fr}
      .ori-sidebar{position:fixed;left:-260px;top:0;width:260px;z-index:200;transition:left .3s;height:100vh}
      .ori-sidebar.open{left:0}
      .mobile-menu-btn{display:flex!important}
    }
    @media(min-width:769px){.mobile-menu-btn{display:none!important}}
  </style>
</head>
<body>
  <div id="root"><div class="app-splash"><div class="splash-logo"><img src="../assets/logo.png" alt=""/></div><div class="splash-name">TCC<em>Flow</em></div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-init.js"></script>
  <script src="../js/db-service.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ──── Auth Hook ──── */
    function useOrientadorAuth() {
      const [user, setUser] = useState(null);
      const [userData, setUserData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        auth.onAuthStateChanged(async u => {
          if (!u) { window.location.href = 'orientador-painel.html'; return; }
          try {
            const { data: ud } = await _supa.from('users').select('*').eq('id', u.uid).maybeSingle();
            setUserData(ud);
          } catch(e) { console.warn(e); }
          setUser(u);
          setLoading(false);
        });
      }, []);

      return { user, userData, loading };
    }

    /* ──── Simple Sidebar ──── */
    function SettingsSidebar({ user }) {
      return (
        <>
          <aside className="ori-sidebar">
            <div className="ori-sidebar-header">
              <img src="../assets/logo.png" className="ori-sidebar-logo" alt=""/>
              <span className="ori-sidebar-brand">TCC<span>Flow</span></span>
              <span className="ori-sidebar-badge">Orientador</span>
            </div>
            <nav className="ori-nav">
              <a href="orientador-painel.html" className="ori-nav-item" style={{textDecoration:'none',color:'inherit'}}>
                <i className="fa-solid fa-arrow-left"/> Voltar
              </a>
            </nav>
            <div className="ori-sidebar-footer">
              <div className="avatar">{(user?.displayName || 'O')[0].toUpperCase()}</div>
              <div className="user-info">
                <div className="user-name">{user?.displayName || 'Orientador'}</div>
                <div className="user-role">orientador</div>
              </div>
            </div>
          </aside>
        </>
      );
    }

    /* ──── Perfil Section ──── */
    function ProfileSection({ user, userData, onPhotoChange }) {
      const [name, setName] = useState(userData?.name || '');
      const [email] = useState(user?.email || '');
      const [uploading, setUploading] = useState(false);
      const [saving, setSaving] = useState(false);
      const fileRef = useRef(null);
      const photoUrl = userData?.photo_url || null;

      async function handlePhotoUpload(e) {
        const file = e.target.files?.[0];
        if (!file || !user) return;
        if (file.size > 2 * 1024 * 1024) { alert('Máximo 2MB'); return; }
        if (!file.type.startsWith('image/')) { alert('Selecione uma imagem válida'); return; }

        setUploading(true);
        try {
          const ext = file.name.split('.').pop();
          const path = `${user.uid}/avatar.${ext}`;
          await _supa.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
          const { data: urlData } = _supa.storage.from('avatars').getPublicUrl(path);
          const publicUrl = urlData.publicUrl + '?t=' + Date.now();
          await _supa.from('users').update({ photo_url: publicUrl }).eq('id', user.uid);
          if (onPhotoChange) onPhotoChange(publicUrl);
          alert('Foto atualizada!');
        } catch(err) {
          alert('Erro: ' + err.message);
        }
        setUploading(false);
      }

      async function handleSaveName() {
        if (!user || !name.trim()) return;
        setSaving(true);
        try {
          await _supa.from('users').update({ name: name.trim() }).eq('id', user.uid);
          alert('Nome atualizado!');
        } catch(err) {
          alert('Erro: ' + err.message);
        }
        setSaving(false);
      }

      return (
        <div className="card">
          <div className="card-title">Perfil</div>
          <div style={{display:'flex',gap:20,alignItems:'flex-start',marginBottom:24}}>
            <div className="avatar-upload" onClick={() => fileRef.current?.click()}>
              {photoUrl ? (
                <img src={photoUrl} className="avatar-img" alt="Avatar"/>
              ) : (
                <div style={{width:64,height:64,borderRadius:'50%',background:'var(--emerald)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.25rem',fontWeight:700}}>
                  {(user?.displayName || '?')[0].toUpperCase()}
                </div>
              )}
              <div className="avatar-overlay">{uploading ? '...' : 'Trocar'}</div>
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoUpload}/>
            </div>
            <div>
              <div style={{fontWeight:600,fontSize:'1rem',color:'var(--ink)'}}>{name || user?.displayName || 'Orientador'}</div>
              <div style={{color:'var(--muted)',fontSize:'.875rem',marginTop:4}}>{email}</div>
              <span className="tag tag-emerald" style={{marginTop:10}}>Orientador</span>
            </div>
          </div>

          <div style={{display:'flex',gap:12,flexDirection:'column'}}>
            <div>
              <label className="field-label">Nome Completo</label>
              <div style={{display:'flex',gap:10}}>
                <input className="field" type="text" value={name} onChange={e => setName(e.target.value)} style={{flex:1}}/>
                <button className="btn btn-emerald" onClick={handleSaveName} disabled={saving}>
                  {saving ? 'Salvando...' : 'Salvar'}
                </button>
              </div>
            </div>
            <div>
              <label className="field-label">Email</label>
              <input className="field" type="email" value={email} disabled style={{background:'var(--bg-2)',cursor:'not-allowed'}}/>
            </div>
          </div>
        </div>
      );
    }

    /* ──── Notificações Section ──── */
    function NotificationsSection({ user, userData }) {
      const [emailNotif, setEmailNotif] = useState(userData?.notif_email ?? true);
      const [saving, setSaving] = useState(false);

      async function toggleEmailNotif() {
        setSaving(true);
        try {
          await _supa.from('users').update({ notif_email: !emailNotif }).eq('id', user.uid);
          setEmailNotif(!emailNotif);
        } catch(err) {
          alert('Erro: ' + err.message);
        }
        setSaving(false);
      }

      return (
        <div className="card">
          <div className="card-title">Notificações</div>
          <div className="settings-row">
            <div className="row-info">
              <div className="row-label">Notificações por Email</div>
              <div className="row-desc">Receba alertas de novos comentários e feedback</div>
            </div>
            <div className={`toggle-switch ${emailNotif ? 'on' : ''}`} onClick={toggleEmailNotif}/>
          </div>
          <div className="settings-row">
            <div className="row-info">
              <div className="row-label">Resumo Semanal</div>
              <div className="row-desc">Receba estatísticas de seus projetos</div>
            </div>
            <div className={`toggle-switch on`} style={{cursor:'not-allowed',opacity:.5}}/>
          </div>
        </div>
      );
    }

    /* ──── Segurança Section ──── */
    function SecuritySection({ user }) {
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [changing, setChanging] = useState(false);

      async function handleChangePassword() {
        if (!newPass || !confirmPass) { alert('Preencha os campos'); return; }
        if (newPass !== confirmPass) { alert('Senhas não conferem'); return; }
        if (newPass.length < 6) { alert('Mínimo 6 caracteres'); return; }

        setChanging(true);
        try {
          const { error } = await _supa.auth.updateUser({ password: newPass });
          if (error) throw error;
          alert('Senha alterada com sucesso!');
          setCurrentPass('');
          setNewPass('');
          setConfirmPass('');
        } catch(err) {
          alert('Erro: ' + err.message);
        }
        setChanging(false);
      }

      return (
        <div className="card">
          <div className="card-title">Segurança</div>
          <div style={{marginBottom:20}}>
            <label className="field-label">Nova Senha</label>
            <input className="field" type="password" placeholder="••••••" value={newPass} onChange={e => setNewPass(e.target.value)} style={{marginBottom:10}}/>
            <input className="field" type="password" placeholder="Confirme a senha" value={confirmPass} onChange={e => setConfirmPass(e.target.value)}/>
          </div>
          <button className="btn btn-emerald" onClick={handleChangePassword} disabled={changing}>
            {changing ? 'Alterando...' : 'Alterar Senha'}
          </button>
        </div>
      );
    }

    /* ──── Main App ──── */
    function SettingsApp() {
      const { user, userData, loading } = useOrientadorAuth();
      const [photoUrl, setPhotoUrl] = useState(userData?.photo_url);
      const [mobileOpen, setMobileOpen] = useState(false);

      if (loading || !user) return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',gap:10,color:'var(--muted)'}}>
          <i className="fa-solid fa-spinner fa-spin"/> Carregando...
        </div>
      );

      return (
        <div className="ori-layout">
          <SettingsSidebar user={user}/>
          <div className="ori-main">
            <div className="ori-topbar">
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <button className="mobile-menu-btn btn btn-sm btn-ghost" onClick={() => setMobileOpen(!mobileOpen)}>
                  <i className="fa-solid fa-bars"/>
                </button>
                <h1>Configurações</h1>
              </div>
            </div>

            <div className="ori-content">
              <div style={{marginBottom:32}}>
                <div className="section-title">Configurações da Conta</div>
                <div className="section-sub">Gerencie suas informações e preferências</div>
              </div>

              <ProfileSection user={user} userData={userData} onPhotoChange={setPhotoUrl}/>
              <NotificationsSection user={user} userData={userData}/>
              <SecuritySection user={user}/>

              <div className="card" style={{marginTop:32,borderColor:'rgba(244,63,94,.3)'}}>
                <div className="card-title" style={{color:'var(--rose)'}}>Sair da Conta</div>
                <p style={{color:'var(--muted)',fontSize:'.85rem',marginBottom:16}}>Você será desconectado de todas as sessões.</p>
                <button className="btn btn-ghost" onClick={async () => {
                  if (confirm('Tem certeza que deseja sair?')) {
                    await auth.signOut();
                    window.location.href = '../index.html';
                  }
                }} style={{color:'var(--rose)',borderColor:'rgba(244,63,94,.3)'}}>
                  <i className="fa-solid fa-right-from-bracket"/> Sair da Conta
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SettingsApp/>);
  </script>
  <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
