<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/landing.css" />
  <style>
    .signup-container { max-width: 420px; margin: 0 auto; padding: 60px 32px; }
    .signup-form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px; }
    .signup-form h1 { font-family: var(--font-display); font-size: 2rem; margin: 0 0 8px; }
    .signup-form p { color: var(--ink-2); margin: 0 0 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; font-size: inherit; }
    .form-group input:focus { outline: none; border-color: var(--violet); background: var(--bg); }
    .btn-signup { width: 100%; padding: 12px; background: var(--ink); color: var(--bg); border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-signup:hover { background: var(--violet); }
    .signup-footer { text-align: center; margin-top: 24px; color: var(--ink-2); font-size: 0.875rem; }
    .signup-footer a { color: var(--violet); text-decoration: none; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <img src="../assets/logo.png" alt="TCCFlow" />
        <span>TCCFlow<span class="dot"/></span>
      </div>
      <div class="nav-cta">
        <a href="login.html" class="btn btn-ghost">Entrar</a>
      </div>
    </div>
  </nav>

  <section style="padding: 80px 0; background: var(--bg);">
    <div class="signup-container">
      <div class="signup-form">
        <h1>Crie sua conta</h1>
        <p>Comece grátis e organize seu TCC em minutos.</p>

        <form>
          <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn-signup">Criar conta grátis</button>
        </form>

        <div class="signup-footer">
          Já tem conta? <a href="login.html">Faça login</a>
        </div>
      </div>
    </div>
  </section>

  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
