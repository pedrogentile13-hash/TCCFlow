<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Planos — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function PlansPage() {
  const { user, userData, subscription, loading } = useTCCData();
  const [processingPlan, setProcessingPlan] = useState(null);

  if (loading) {
    return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;
  }

  const currentPlan = subscription?.plan || "free";

  async function handleSelectPlan(planId, amount) {
    if (!user) {
      alert("Faça login para continuar");
      return;
    }

    if (planId === "free") {
      window.location.href = "dashboard.html";
      return;
    }

    if (planId === "inst") {
      window.location.href = "mailto:tccflow.contato@gmail.com";
      return;
    }

    setProcessingPlan(planId);

    try {
      console.log("Iniciando assinatura:", { userId: user.uid, amount, planId });

      const response = await fetch("/.netlify/functions/create-preapproval", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: user.uid,
          userEmail: user.email,
          userName: userData?.name || user.displayName || "Usuário",
          seats: 1,
          planType: planId === "pro" ? "pro_annual" : "pro_monthly",
          amount: amount
        })
      });

      const data = await response.json();
      console.log("Resposta da API:", data);

      if (data.error) {
        alert("Erro: " + data.error);
        setProcessingPlan(null);
        return;
      }

      if (data.url) {
        console.log("Redirecionando para:", data.url);
        window.location.href = data.url;
      } else {
        alert("Erro ao processar pagamento. Tente novamente.");
        setProcessingPlan(null);
      }
    } catch (e) {
      console.error("Erro:", e);
      alert("Erro ao conectar ao servidor: " + e.message);
      setProcessingPlan(null);
    }
  }

  return (
    <div className="app-layout">
      <Sidebar active="plans" userData={userData} subscription={subscription} />
      <div className="main-area">
        <Topbar page="Planos" user={user} />
        <div className="page-content" style={{ maxWidth: "1000px", margin: "0 auto" }}>

          <div style={{ textAlign: "center", marginBottom: 60, paddingTop: 20 }}>
            <h1 style={{ fontFamily: "var(--font-display)", fontSize: "2.5rem", fontWeight: 400, letterSpacing: "-0.03em", marginBottom: 16, color: "var(--ink)" }}>
              Escolha seu plano
            </h1>
            <p style={{ fontSize: "1rem", color: "var(--muted)", marginBottom: 8 }}>
              Comece grátis. Atualize quando precisar.
            </p>
            {currentPlan !== "free" && (
              <div style={{ background: "rgba(16, 185, 129, 0.1)", color: "var(--emerald)", padding: "8px 16px", borderRadius: 8, display: "inline-block", fontSize: "0.875rem", fontWeight: 600, marginTop: 12 }}>
                ✓ Você está no plano <strong>{currentPlan === "pro" ? "Pro" : "Instituição"}</strong>
              </div>
            )}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 24 }}>

            {/* PLANO GRATUITO */}
            <div style={{
              background: "var(--paper)",
              border: "1.5px solid var(--line)",
              borderRadius: 16,
              padding: 32,
              display: "flex",
              flexDirection: "column",
              opacity: currentPlan === "free" ? 1 : 0.9
            }}>
              <div style={{ marginBottom: 24 }}>
                <h2 style={{ fontFamily: "var(--font-display)", fontSize: "1.75rem", fontWeight: 400, margin: "0 0 8px", color: "var(--ink)" }}>
                  Gratuito
                </h2>
                <p style={{ color: "var(--muted)", fontSize: "0.875rem", margin: 0 }}>
                  Para começar com o pé direito
                </p>
              </div>

              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: "2.5rem", fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>
                  R$ 0
                </div>
                <div style={{ fontSize: "0.875rem", color: "var(--muted)" }}>
                  para sempre
                </div>
              </div>

              <ul style={{ flex: 1, listStyle: "none", padding: 0, margin: "0 0 24px", fontSize: "0.875rem" }}>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Dashboard e Projeto</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Até 5 tarefas</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Calendário básico</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ 20 buscas I.A./mês</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Equipe: 1 integrante</li>
                <li style={{ padding: "8px 0", color: "var(--muted)", textDecoration: "line-through" }}>Suporte prioritário</li>
              </ul>

              {currentPlan === "free" ? (
                <button className="btn" style={{ width: "100%", justifyContent: "center", opacity: 0.6, cursor: "default" }}>
                  Seu plano atual
                </button>
              ) : (
                <button className="btn btn-ghost" style={{ width: "100%", justifyContent: "center" }} onClick={() => handleSelectPlan("free")}>
                  Usar grátis
                </button>
              )}
            </div>

            {/* PLANO PRO */}
            <div style={{
              background: "var(--paper)",
              border: "2px solid var(--violet)",
              borderRadius: 16,
              padding: 32,
              display: "flex",
              flexDirection: "column",
              position: "relative",
              transform: "scale(1.02)",
              boxShadow: "0 10px 40px rgba(124, 58, 237, 0.15)"
            }}>
              <div style={{ position: "absolute", top: 16, right: 16, background: "var(--violet)", color: "white", padding: "4px 12px", borderRadius: 999, fontSize: "0.6875rem", fontWeight: 600, textTransform: "uppercase" }}>
                Popular
              </div>

              <div style={{ marginBottom: 24 }}>
                <h2 style={{ fontFamily: "var(--font-display)", fontSize: "1.75rem", fontWeight: 400, margin: "0 0 8px", color: "var(--ink)" }}>
                  Pro
                </h2>
                <p style={{ color: "var(--muted)", fontSize: "0.875rem", margin: 0 }}>
                  Para equipes que levam a sério
                </p>
              </div>

              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: "2.5rem", fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>
                  R$ 124,90
                </div>
                <div style={{ fontSize: "0.875rem", color: "var(--muted)" }}>
                  por ano (R$ 10,41/mês)
                </div>
              </div>

              <ul style={{ flex: 1, listStyle: "none", padding: 0, margin: "0 0 24px", fontSize: "0.875rem" }}>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Tudo do Gratuito</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Até 8 membros</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Tarefas ilimitadas</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ 1.000 buscas I.A./mês</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Integração Google</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Todas as ferramentas PRO</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Suporte prioritário</li>
              </ul>

              {currentPlan === "pro" ? (
                <button className="btn" style={{ width: "100%", justifyContent: "center", opacity: 0.6, cursor: "default" }}>
                  Seu plano atual
                </button>
              ) : (
                <button
                  className="btn btn-primary"
                  style={{ width: "100%", justifyContent: "center" }}
                  onClick={() => handleSelectPlan("pro", 124.90)}
                  disabled={processingPlan === "pro"}
                >
                  {processingPlan === "pro" ? "Processando..." : "Assinar agora"}
                </button>
              )}
            </div>

            {/* PLANO INSTITUIÇÃO */}
            <div style={{
              background: "var(--paper)",
              border: "1.5px solid var(--line)",
              borderRadius: 16,
              padding: 32,
              display: "flex",
              flexDirection: "column",
              opacity: 0.9
            }}>
              <div style={{ marginBottom: 24 }}>
                <h2 style={{ fontFamily: "var(--font-display)", fontSize: "1.75rem", fontWeight: 400, margin: "0 0 8px", color: "var(--ink)" }}>
                  Instituição
                </h2>
                <p style={{ color: "var(--muted)", fontSize: "0.875rem", margin: 0 }}>
                  Para coordenadores e escolas
                </p>
              </div>

              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: "2.5rem", fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>
                  Customizado
                </div>
                <div style={{ fontSize: "0.875rem", color: "var(--muted)" }}>
                  Preço por volume
                </div>
              </div>

              <ul style={{ flex: 1, listStyle: "none", padding: 0, margin: "0 0 24px", fontSize: "0.875rem" }}>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Tudo do Pro</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Múltiplos grupos</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Painel do coordenador</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Relatórios de turma</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Integração com SIGAA</li>
                <li style={{ padding: "8px 0", color: "var(--ink)" }}>✓ Suporte dedicado</li>
              </ul>

              <button
                className="btn btn-ghost"
                style={{ width: "100%", justifyContent: "center" }}
                onClick={() => handleSelectPlan("inst")}
              >
                Falar com vendas
              </button>
            </div>
          </div>

          <div style={{ marginTop: 60, padding: "32px", background: "var(--bg-2)", borderRadius: 16, textAlign: "center" }}>
            <h3 style={{ fontFamily: "var(--font-display)", fontSize: "1.3rem", fontWeight: 400, marginBottom: 12, color: "var(--ink)" }}>
              Dúvidas?
            </h3>
            <p style={{ color: "var(--muted)", marginBottom: 16 }}>
              Não tem cartão de crédito? Sem problema! Testamos com Pix, boleto e cartão de débito.
            </p>
            <a href="mailto:tccflow.contato@gmail.com" className="btn btn-ghost">
              📧 Entre em contato conosco
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlansPage/>);
</script>
</body>
</html>
