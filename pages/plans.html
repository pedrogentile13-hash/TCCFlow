<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Planos — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .plan-card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s;}
    .plan-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
    .plan-card.featured{background:var(--ink);color:var(--bg);border-color:var(--ink);}
    .plan-card.current{border-color:var(--emerald);box-shadow:0 0 20px rgba(16,185,129,.15);}
    .plan-name{font-family:var(--font-display);font-size:1.75rem;font-weight:400;letter-spacing:-.01em;margin-bottom:4px;}
    .plan-sub{font-size:.875rem;color:var(--muted);min-height:40px;margin-bottom:20px;}
    .plan-card.featured .plan-sub{color:rgba(255,255,255,.6);}
    .plan-price{font-family:var(--font-display);font-size:3.25rem;line-height:1;letter-spacing:-.04em;margin-bottom:6px;}
    .plan-period{font-size:.875rem;color:var(--muted);margin-bottom:24px;}
    .plan-card.featured .plan-period{color:rgba(255,255,255,.55);}
    .plan-feats{list-style:none;flex:1;font-size:.875rem;margin:0 0 28px;}
    .plan-feats li{padding:9px 0 9px 22px;position:relative;border-top:1px dashed var(--line);color:var(--ink-2);}
    .plan-card.featured .plan-feats li{border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.85);}
    .plan-feats li:last-child{border-bottom:1px dashed var(--line);}
    .plan-card.featured .plan-feats li:last-child{border-color:rgba(255,255,255,.12);}
    .plan-feats li::before{content:"✓";position:absolute;left:0;top:9px;color:var(--violet);font-weight:700;}
    .plan-card.featured .plan-feats li::before{color:var(--cyan);}
    .plan-feats li.off{color:var(--muted);text-decoration:line-through;opacity:.5;}
    .plan-feats li.off::before{content:"–";}
    .popular-badge{position:absolute;top:16px;right:16px;background:var(--grad);color:white;font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:999px;font-weight:600;}
    .current-badge{position:absolute;top:16px;left:16px;background:var(--emerald);color:white;font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:999px;font-weight:600;}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const PLANS = [
  {
    id:"free", name:"Gratuito", sub:"Para começar com o pé direito.",
    monthly:0, yearly:0, featured:false,
    feats:["Dashboard e Projeto","Até 5 tarefas","Calendário básico","20 buscas I.A./mês","Equipe: 1 integrante"]
  },
  {
    id:"pro", name:"Pro", sub:"Para equipes que levam a sério.",featured:true,
    monthly:14.90, yearly:97,
    badge:"Mais popular",
    feats:["Tudo do Gratuito","Até 8 membros","Tarefas ilimitadas","1.000 buscas I.A./mês","Integração Google","Todas as ferramentas PRO","Suporte prioritário"]
  },
  {
    id:"inst", name:"Instituição", sub:"Para coordenadores.",
    monthly:null, yearly:null, featured:false,
    feats:["Tudo do Pro","Múltiplos grupos","Painel do coordenador","Relatórios de turma","Integração sistemas"]
  }
];

function PlansPage() {
  const { user, userData, subscription, loading } = useTCCData();
  const [billing, setBilling] = useState("yearly");
  const [upgrading, setUpgrading] = useState(false);

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--muted)"}}>Carregando...</div>;

  const currentPlan = subscription?.plan || "free";

  async function handleUpgrade() {
    setUpgrading(true);
    alert("Funcionalidade de upgrade será integrada com gateway de pagamento (Stripe/PagSeguro)");
    setUpgrading(false);
  }

  return (
    <div className="app-layout">
      <Sidebar active="plans" userData={userData} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Planos" user={user}/>
        <div className="page-content">
          <div style={{ textAlign:"center", marginBottom:8 }}>
            <div className="mono-label" style={{ marginBottom:12 }}>Escolha seu plano</div>
            <h1 style={{ fontFamily:"var(--font-display)", fontSize:"2.5rem", fontWeight:400, letterSpacing:"-.03em", marginBottom:8 }}>
              Invista no seu <em style={{ fontStyle:"italic", color:"var(--violet)" }}>TCC</em>
            </h1>
            <p style={{ color:"var(--muted)", fontSize:"0.9375rem", maxWidth:"48ch", margin:"0 auto 24px" }}>
              7 dias grátis para testar o Pro. Cancele quando quiser.
            </p>
            <div style={{ display:"inline-flex", background:"var(--bg-2)", border:"1px solid var(--line)", borderRadius:999, padding:4, marginBottom:40 }}>
              <button className={`btn btn-sm ${billing==="yearly"?"btn-primary":"btn-ghost"}`} style={{border:"none"}} onClick={() => setBilling("yearly")}>
                Anual <span style={{ fontFamily:"var(--font-mono)", fontSize:"0.625rem", background:"var(--emerald)", color:"white", padding:"1px 6px", borderRadius:999, marginLeft:4 }}>−35%</span>
              </button>
              <button className={`btn btn-sm ${billing==="monthly"?"btn-primary":"btn-ghost"}`} style={{border:"none"}} onClick={() => setBilling("monthly")}>Mensal</button>
            </div>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, maxWidth:960, margin:"0 auto" }}>
            {PLANS.map(p => {
              const isCurrent = currentPlan === p.id;
              return (
                <div key={p.id} className={`plan-card ${p.featured?"featured":""} ${isCurrent?"current":""}`} style={{position:"relative"}}>
                  {isCurrent && <div className="current-badge">✓ Seu plano</div>}
                  {p.badge && !isCurrent && <div className="popular-badge">{p.badge}</div>}
                  <div className="plan-name">{p.name}</div>
                  <div className="plan-sub">{p.sub}</div>
                  {p.monthly !== null ? (
                    <>
                      <div className="plan-price">
                        {p.monthly === 0 ? "R$ 0" : billing==="yearly"
                          ? `R$ ${(p.yearly/12).toFixed(0)}`
                          : `R$ ${p.monthly.toFixed(2).replace(".",",")}`}
                      </div>
                      <div className="plan-period">
                        {p.monthly === 0 ? "para sempre" : billing==="yearly" ? `/mês · R$ ${p.yearly}/ano` : `/mês`}
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="plan-price" style={{ fontSize:"2rem" }}>Consulte</div>
                      <div className="plan-period">preço personalizado</div>
                    </>
                  )}

                  <ul className="plan-feats">
                    {p.feats.map((f,i) => (
                      <li key={i}>{f}</li>
                    ))}
                  </ul>

                  {isCurrent ? (
                    <button className="btn btn-ghost" disabled style={{ width:"100%", justifyContent:"center", opacity:0.6 }}>Plano atual</button>
                  ) : p.id === "free" ? (
                    <a href="dashboard.html" className="btn btn-ghost" style={{ width:"100%", justifyContent:"center" }}>Usar grátis</a>
                  ) : p.id === "pro" ? (
                    <button className="btn btn-violet" style={{ width:"100%", justifyContent:"center" }} onClick={handleUpgrade} disabled={upgrading}>
                      {upgrading ? "Processando..." : "Testar 7 dias grátis"}
                    </button>
                  ) : (
                    <a href="mailto:contato.tccflow@gmail.com" className="btn btn-ghost" style={{ width:"100%", justifyContent:"center" }}>Falar com vendas</a>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlansPage/>);
</script>
</body>
</html>
