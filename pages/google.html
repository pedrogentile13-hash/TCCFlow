<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Google — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/darkmode.js"></script>
  <style>
    .g-action-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .25s,box-shadow .25s;text-decoration:none;color:inherit;}
    .g-action-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
    .g-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .g-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);cursor:pointer;transition:background .15s;}
    .g-file:hover{background:var(--paper);}
  </style>
</head>
<body><div id="root"><div class="app-splash"><div class="splash-logo"><img src="../assets/logo.png" alt=""/></div><div class="splash-name">TCC<em>Flow</em></div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-init.js"></script>
<script src="../js/db-service.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const QUICK_ACTIONS = [
  { icon:"📄", label:"Google Docs", desc:"Criar documento do TCC", href:"https://docs.google.com/document/create" },
  { icon:"📊", label:"Planilhas", desc:"Tabelas e dados da pesquisa", href:"https://sheets.google.com/create" },
  { icon:"📑", label:"Apresentações", desc:"Slides para a defesa", href:"https://slides.google.com/create" },
  { icon:"📅", label:"Google Agenda", desc:"Sincronizar calendário", href:"https://calendar.google.com" },
];

function GooglePage() {
  const { user, userData, project, subscription, loading } = useTCCData();
  const [links, setLinks] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [newLinkName, setNewLinkName] = useState("");
  const [newLinkUrl, setNewLinkUrl] = useState("");

  useEffect(() => {
    if (!project) return;
    (async () => {
      const ls = await DB.googleLinks.getAll(project.id);
      setLinks(ls || []);
    })();
  }, [project]);

  async function addLink() {
    if (!newLinkName.trim() || !newLinkUrl.trim() || !project) return;
    await DB.googleLinks.add(project.id, {
      name: newLinkName,
      url: newLinkUrl,
      type: newLinkUrl.includes("docs.google.com") ? "Docs" : newLinkUrl.includes("sheets.google.com") ? "Sheets" : newLinkUrl.includes("slides.google.com") ? "Slides" : "Link"
    });
    const ls = await DB.googleLinks.getAll(project.id);
    setLinks(ls);
    setNewLinkName("");
    setNewLinkUrl("");
    setShowModal(false);
  }

  async function removeLink(linkId) {
    await DB.googleLinks.remove(linkId);
    setLinks(prev => prev.filter(l => l.id !== linkId));
  }

  if (loading) return <AppSplash />;

  const googleEmail = user?.email || null;

  return (
    <div className="app-layout">
      <Sidebar active="google" userData={userData} project={project} subscription={subscription}/>
      <div className="main-area">
        <Topbar page="Google" user={user} actions={
          googleEmail && (
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:8, height:8, borderRadius:"50%", background:"var(--emerald)" }}></span>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--emerald)" }}>{googleEmail}</span>
            </div>
          )
        }/>
        <div className="page-content">
          {googleEmail && (
            <>
              {project && (
                <div style={{ background:"var(--grad)", borderRadius:16, padding:"20px 24px", color:"white", display:"flex", alignItems:"center", gap:20, marginBottom:20 }}>
                  <div style={{ fontSize:"2rem" }}>🗂</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontWeight:600, marginBottom:2 }}>Pasta do projeto</div>
                    <div style={{ fontSize:"0.8125rem", opacity:.8 }}>{project.name}</div>
                  </div>
                  <a href="https://drive.google.com" target="_blank" className="btn" style={{ background:"white", color:"var(--violet)", fontWeight:600, flexShrink:0 }}>Abrir Drive →</a>
                </div>
              )}

              <div className="page-grid" style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:16 }}>
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  <div className="card">
                    <div className="card-title"><span className="ct-icon">⚡</span> Ações rápidas</div>
                    <div className="g-actions-grid" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                      {QUICK_ACTIONS.map(a => (
                        <a key={a.label} href={a.href} target="_blank" className="g-action-card">
                          <div className="g-icon">{a.icon}</div>
                          <div>
                            <div style={{ fontWeight:600, fontSize:"0.9375rem" }}>{a.label}</div>
                            <div style={{ fontSize:"0.8125rem", color:"var(--muted)" }}>{a.desc}</div>
                          </div>
                        </a>
                      ))}
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-title" style={{ justifyContent:"space-between" }}>
                      <span style={{ display:"flex", alignItems:"center", gap:8 }}><span className="ct-icon">🔗</span> Links salvos</span>
                      <button className="btn btn-ghost btn-sm" onClick={() => setShowModal(true)}>+ Adicionar</button>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      {links.length === 0 && <div style={{color:"var(--muted)",fontSize:".875rem",padding:12}}>Nenhum link salvo</div>}
                      {links.map(f => (
                        <div key={f.id} className="g-file">
                          <span style={{ fontSize:"1.25rem" }}>🔗</span>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:"0.875rem", fontWeight:500 }}>{f.name}</div>
                            <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.625rem", color:"var(--muted)" }}>{f.type || "Link"}</div>
                          </div>
                          <a href={f.url} target="_blank" className="btn btn-ghost btn-sm">Abrir</a>
                          <button className="btn btn-ghost btn-sm" onClick={() => removeLink(f.id)} style={{color:"var(--rose)"}}>✕</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title"><span className="ct-icon">🔧</span> Serviços</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                    {[{icon:"🗂",label:"Drive",href:"https://drive.google.com"},{icon:"📧",label:"Gmail",href:"https://gmail.com"},{icon:"🔔",label:"Meet",href:"https://meet.google.com"},{icon:"📝",label:"Forms",href:"https://forms.google.com"}].map(s => (
                      <a key={s.label} href={s.href} target="_blank" style={{ textAlign:"center", padding:"16px", background:"var(--bg-2)", borderRadius:12, cursor:"pointer", textDecoration:"none", color:"inherit" }}>
                        <div style={{ fontSize:"1.5rem", marginBottom:6 }}>{s.icon}</div>
                        <div style={{ fontWeight:600, fontSize:"0.875rem" }}>{s.label}</div>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </>
          )}

          {showModal && (
            <div className="modal-overlay" onClick={() => setShowModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{fontFamily:"var(--font-display)",fontSize:"1.25rem",marginBottom:16}}>Adicionar link</h3>
                <div className="field"><label>Nome</label><input type="text" value={newLinkName} onChange={e=>setNewLinkName(e.target.value)} placeholder="Ex: Referências da pesquisa" autoFocus/></div>
                <div className="field"><label>URL</label><input type="url" value={newLinkUrl} onChange={e=>setNewLinkUrl(e.target.value)} placeholder="https://..."/></div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button className="btn btn-ghost" onClick={() => setShowModal(false)}>Cancelar</button>
                  <button className="btn btn-violet" onClick={addLink}>Adicionar link</button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GooglePage/>);
</script>
</body>
</html>
