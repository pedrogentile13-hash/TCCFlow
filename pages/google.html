<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Google — TCCFlow</title>
  <link rel="icon" href="../assets/logo.png"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    .g-action-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .25s,box-shadow .25s;text-decoration:none;color:inherit;}
    .g-action-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
    .g-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .g-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);cursor:pointer;transition:background .15s;}
    .g-file:hover{background:var(--paper);}
  </style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../src/sidebar.jsx"></script>
<script type="text/babel">
const { useState } = React;

const QUICK_ACTIONS = [
  { icon:"📄", label:"Google Docs", desc:"Criar documento do TCC" },
  { icon:"📊", label:"Planilhas", desc:"Tabelas e dados da pesquisa" },
  { icon:"📑", label:"Apresentações", desc:"Slides para a defesa" },
  { icon:"📅", label:"Google Agenda", desc:"Sincronizar calendário" },
];

const SAVED_LINKS = [
  { name:"TCC — Documento Principal", type:"Docs", icon:"📄", modified:"hoje" },
  { name:"Dados Survey — Planilha", type:"Sheets", icon:"📊", modified:"ontem" },
  { name:"Apresentação Qualificação", type:"Slides", icon:"📑", modified:"22 abr" },
];

function GooglePage() {
  const [connected, setConnected] = useState(true);

  return (
    <div className="app-layout">
      <Sidebar active="google"/>
      <div className="main-area">
        <Topbar page="Google" actions={
          connected && (
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:8, height:8, borderRadius:"50%", background:"var(--emerald)" }}></span>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:"0.6875rem", color:"var(--emerald)" }}>pedro@gmail.com</span>
            </div>
          )
        }/>
        <div className="page-content">
          {connected && (
            <>
              <div style={{ background:"var(--grad)", borderRadius:16, padding:"20px 24px", color:"white", display:"flex", alignItems:"center", gap:20, marginBottom:20 }}>
                <div style={{ fontSize:"2rem" }}>🗂</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:600, marginBottom:2 }}>Pasta compartilhada do TCC</div>
                  <div style={{ fontSize:"0.8125rem", opacity:.8 }}>drive.google.com/drive/folders/TCC-2026</div>
                </div>
                <button className="btn" style={{ background:"white", color:"var(--violet)", fontWeight:600, flexShrink:0 }}>Abrir Drive →</button>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:16 }}>
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  <div className="card">
                    <div className="card-title"><span className="ct-icon">⚡</span> Ações rápidas</div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                      {QUICK_ACTIONS.map(a => (
                        <div key={a.label} className="g-action-card">
                          <div className="g-icon">{a.icon}</div>
                          <div>
                            <div style={{ fontWeight:600, fontSize:"0.9375rem" }}>{a.label}</div>
                            <div style={{ fontSize:"0.8125rem", color:"var(--muted)" }}>{a.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-title" style={{ justifyContent:"space-between" }}>
                      <span style={{ display:"flex", alignItems:"center", gap:8 }}><span className="ct-icon">🔗</span> Links salvos</span>
                      <button className="btn btn-ghost btn-sm">+ Adicionar</button>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      {SAVED_LINKS.map((f,i) => (
                        <div key={i} className="g-file">
                          <span style={{ fontSize:"1.25rem" }}>{f.icon}</span>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:"0.875rem", fontWeight:500 }}>{f.name}</div>
                            <div style={{ fontFamily:"var(--font-mono)", fontSize:"0.625rem", color:"var(--muted)" }}>{f.type} · {f.modified}</div>
                          </div>
                          <button className="btn btn-ghost btn-sm">Abrir</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title"><span className="ct-icon">🔧</span> Serviços</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                    {[{icon:"🗂",label:"Drive"},{icon:"📧",label:"Gmail"},{icon:"🔔",label:"Meet"},{icon:"📝",label:"Forms"}].map(s => (
                      <div key={s.label} style={{ textAlign:"center", padding:"16px", background:"var(--bg-2)", borderRadius:12, cursor:"pointer" }}>
                        <div style={{ fontSize:"1.5rem", marginBottom:6 }}>{s.icon}</div>
                        <div style={{ fontWeight:600, fontSize:"0.875rem" }}>{s.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GooglePage/>);
</script>
</body>
</html>
