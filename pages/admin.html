<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definições - GentileOrganization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .glass-strong {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12);
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-link.active { background: rgba(59,130,246,0.15); color: #60a5fa; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen antialiased">

    <!-- Mobile header -->
    <header class="lg:hidden fixed top-0 w-full z-50 glass">
        <div class="flex items-center justify-between px-4 h-14">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-book-open text-xs"></i>
                </div>
                <span class="text-sm font-bold">Gentile<span class="text-blue-400">Org</span></span>
            </div>
            <button id="sidebarToggle" class="text-slate-300 hover:text-white">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 glass-strong z-40 transform -translate-x-full lg:translate-x-0 transition-transform">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-book-open text-sm"></i>
                </div>
                <div>
                    <span class="text-base font-bold block">Gentile<span class="text-blue-400">Org</span></span>
                    <span class="text-xs text-slate-500" id="sidebarUserName">Utilizador</span>
                </div>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white">
                    <i class="fa-solid fa-gauge w-5 text-center"></i> Dashboard
                </a>
                <a href="boletim.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i> Boletim
                </a>
                <a href="calendario.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i> Calendário
                </a>
                <a href="admin.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
                    <i class="fa-solid fa-gear w-5 text-center"></i> Definições
                </a>
                <a href="debug.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white">
                    <i class="fa-solid fa-bug w-5 text-center"></i> Debug
                </a>
            </nav>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6">
            <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 transition">
                <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Sair
            </button>
        </div>
    </aside>

    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

    <!-- Main Content -->
    <main class="lg:ml-64 pt-16 lg:pt-0 min-h-screen">
        <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">

            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold"><span class="gradient-text">Definições</span></h1>
                <p class="text-sm text-slate-400 mt-1">Gerencie o seu perfil e preferências</p>
            </div>

            <!-- Profile Card -->
            <div class="glass rounded-3xl p-6 sm:p-8 mb-6">
                <div class="flex items-center gap-5 mb-8">
                    <div class="w-20 h-20 bg-blue-600/20 rounded-2xl flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-user text-blue-400 text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold" id="profileName">Utilizador</h2>
                        <p class="text-sm text-slate-400" id="profileEmail">email@example.com</p>
                        <p class="text-xs text-slate-500 mt-1" id="profileDate">Membro desde ...</p>
                    </div>
                </div>

                <form id="profileForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">
                            <i class="fa-solid fa-user mr-1 text-blue-400"></i> Nome
                        </label>
                        <input type="text" id="editName" required
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">
                            <i class="fa-solid fa-envelope mr-1 text-blue-400"></i> Email
                        </label>
                        <input type="email" id="editEmail" required
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <div id="profileMsg" class="hidden text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/25 text-sm">
                        <i class="fa-solid fa-floppy-disk mr-2"></i>Salvar Alterações
                    </button>
                </form>
            </div>

            <!-- Change Password -->
            <div class="glass rounded-3xl p-6 sm:p-8 mb-6">
                <h3 class="text-lg font-bold mb-6">
                    <i class="fa-solid fa-key mr-2 text-amber-400"></i>Alterar Senha
                </h3>

                <form id="passwordForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Senha Atual</label>
                        <input type="password" id="currentPassword" required
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Nova Senha</label>
                        <input type="password" id="newPassword" required minlength="6"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Confirmar Nova Senha</label>
                        <input type="password" id="confirmNewPassword" required
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <div id="passwordMsg" class="hidden text-sm rounded-xl px-4 py-3"></div>

                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 font-semibold px-6 py-3 rounded-xl transition text-sm">
                        <i class="fa-solid fa-key mr-2"></i>Alterar Senha
                    </button>
                </form>
            </div>

            <!-- Danger Zone -->
            <div class="glass rounded-3xl p-6 sm:p-8 border border-red-500/10">
                <h3 class="text-lg font-bold text-red-400 mb-4">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i>Zona de Perigo
                </h3>
                <p class="text-sm text-slate-400 mb-6">Ações irreversíveis para a sua conta.</p>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button id="clearDataBtn" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 font-semibold px-5 py-2.5 rounded-xl transition text-sm border border-red-500/20">
                        <i class="fa-solid fa-broom mr-2"></i>Limpar Meus Dados
                    </button>
                    <button id="deleteAccountBtn" class="bg-red-600 hover:bg-red-500 font-semibold px-5 py-2.5 rounded-xl transition text-sm">
                        <i class="fa-solid fa-trash mr-2"></i>Eliminar Conta
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ========== Auth Check ==========
        const currentUser = JSON.parse(localStorage.getItem('gentile_current_user'));
        if (!currentUser) window.location.href = 'login.html';

        // ========== UI Setup ==========
        function loadProfile() {
            const users = JSON.parse(localStorage.getItem('gentile_users') || '[]');
            const user = users.find(u => u.id === currentUser.id);
            if (!user) return;

            document.getElementById('profileName').textContent = user.name;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('sidebarUserName').textContent = user.name;
            document.getElementById('editName').value = user.name;
            document.getElementById('editEmail').value = user.email;

            if (user.createdAt) {
                document.getElementById('profileDate').textContent = 'Membro desde ' + new Date(user.createdAt).toLocaleDateString('pt-BR');
            }
        }

        loadProfile();

        // ========== Sidebar ==========
        const sidebar = document.getElementById('sidebar');
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('gentile_current_user');
            window.location.href = 'login.html';
        });

        // ========== Profile Update ==========
        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.className = `text-sm rounded-xl px-4 py-3 ${type === 'success' ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400' : 'bg-red-500/10 border border-red-500/20 text-red-400'}`;
            el.textContent = text;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newName = document.getElementById('editName').value.trim();
            const newEmail = document.getElementById('editEmail').value.trim().toLowerCase();

            const users = JSON.parse(localStorage.getItem('gentile_users') || '[]');
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex === -1) return;

            // Check email conflict
            if (newEmail !== users[userIndex].email && users.find(u => u.email === newEmail)) {
                showMsg('profileMsg', 'Este email já está em uso.', 'error');
                return;
            }

            users[userIndex].name = newName;
            users[userIndex].email = newEmail;
            localStorage.setItem('gentile_users', JSON.stringify(users));

            // Update current session
            currentUser.name = newName;
            currentUser.email = newEmail;
            localStorage.setItem('gentile_current_user', JSON.stringify(currentUser));

            loadProfile();
            showMsg('profileMsg', 'Perfil atualizado com sucesso!', 'success');
        });

        // ========== Password Change ==========
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmNewPassword').value;

            const users = JSON.parse(localStorage.getItem('gentile_users') || '[]');
            const user = users.find(u => u.id === currentUser.id);

            if (!user || user.password !== current) {
                showMsg('passwordMsg', 'Senha atual incorreta.', 'error');
                return;
            }

            if (newPass.length < 6) {
                showMsg('passwordMsg', 'A nova senha deve ter pelo menos 6 caracteres.', 'error');
                return;
            }

            if (newPass !== confirm) {
                showMsg('passwordMsg', 'As senhas não coincidem.', 'error');
                return;
            }

            user.password = newPass;
            localStorage.setItem('gentile_users', JSON.stringify(users));

            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
            showMsg('passwordMsg', 'Senha alterada com sucesso!', 'success');
        });

        // ========== Danger Zone ==========
        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if (!confirm('Tem certeza? Isto irá eliminar todas as suas sessões e metas.')) return;

            // Remove user sessions and goals
            const sessions = JSON.parse(localStorage.getItem('gentile_sessions') || '[]').filter(s => s.userId !== currentUser.id);
            localStorage.setItem('gentile_sessions', JSON.stringify(sessions));

            const goals = JSON.parse(localStorage.getItem('gentile_goals') || '[]').filter(g => g.userId !== currentUser.id);
            localStorage.setItem('gentile_goals', JSON.stringify(goals));

            localStorage.removeItem('gentile_pomodoro_count');

            alert('Dados eliminados com sucesso.');
        });

        document.getElementById('deleteAccountBtn').addEventListener('click', () => {
            if (!confirm('Tem CERTEZA ABSOLUTA? Esta ação é irreversível e eliminará a sua conta e todos os dados.')) return;

            // Remove user
            const users = JSON.parse(localStorage.getItem('gentile_users') || '[]').filter(u => u.id !== currentUser.id);
            localStorage.setItem('gentile_users', JSON.stringify(users));

            // Remove user data
            const sessions = JSON.parse(localStorage.getItem('gentile_sessions') || '[]').filter(s => s.userId !== currentUser.id);
            localStorage.setItem('gentile_sessions', JSON.stringify(sessions));

            const goals = JSON.parse(localStorage.getItem('gentile_goals') || '[]').filter(g => g.userId !== currentUser.id);
            localStorage.setItem('gentile_goals', JSON.stringify(goals));

            localStorage.removeItem('gentile_current_user');
            localStorage.removeItem('gentile_pomodoro_count');

            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
